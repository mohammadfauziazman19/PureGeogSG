2", "marks": 5, "cmd": "Explain", "text": "Using Source E and your own knowledge, explain how overdependence on tourism makes destination regions vulnerable to unexpected events, and assess whether this vulnerability is manageable.", "src": {"t": "table", "lbl": "Source E", "cap": "Economic vulnerability of tourism-dependent regions — three case studies", "credit": "Adapted from UNWTO, Caribbean Tourism Organization and media reports, 2022", "info": "Key lesson: Unexpected events — natural disasters, disease outbreaks, political instability — can instantly devastate tourism-dependent economies. Countries with diversified economies are far more resilient to the same shocks.", "hdr": ["Case study", "Unexpected event", "Arrivals fall", "Revenue impact"], "rows": [["Caribbean Islands", "2017 hurricanes — 95% of buildings destroyed on worst-affected islands", "~−25%", "~US$700M+ revenue loss; 1M fewer arrivals"], ["Thailand", "2020 COVID-19 pandemic — extended border closures", "−83% (39.8M → 6.7M)", "Receipts fell US$60bn → ~US$10bn (−83%)"], ["Egypt", "2011 Arab Spring — political instability and safety concerns", "−33% (14.7M → 9.8M)", "Tourism receipts fell ~30%"]]}, "ans": "Source E shows three distinct types of unexpected events that can trigger sudden collapses in tourist arrivals and devastating economic consequences. The Caribbean hurricanes (2017) destroyed ~95% of buildings on the worst-affected islands and caused revenue losses of over US$700 million — demonstrating how natural disasters can simultaneously destroy tourism infrastructure and deter tourist arrivals, creating a double economic shock for communities that depend almost entirely on tourism income. (1 mark) The COVID-19 impact on Thailand shown in Source E — arrivals falling from 39.8 million to 6.7 million (-83%) and receipts from US$60 billion to ~US$10 billion — demonstrates the extreme vulnerability that results from deep tourism dependence. Thailand's 18% tourism-dependent workforce faced immediate income loss, and the government had to deploy massive financial support programmes. The severity of the impact directly reflects the degree of overdependence — countries with more diversified economies were better placed to absorb the same shock. (1 mark) Source E also shows that political instability — as demonstrated by Egypt's Arab Spring (2011) causing a 33% fall in arrivals — creates tourism vulnerability of a different character: unlike natural disasters, political instability can persist for years, making tourist-dependent economies extremely difficult to manage. Tourists are highly sensitive to perceived safety risks, and destination regions with poor political stability records may take many years to rebuild tourist confidence even after peace is restored. (1 mark) Source E's comparison across all three cases demonstrates that vulnerability is manageable through economic diversification — destinations that have diversified beyond tourism are less severely affected by the same external shocks. Countries like Singapore, France and Germany have kept tourism's share of GDP relatively low (~4-7%) by maintaining strong manufacturing, financial and trade sectors, making tourism downturns an economic inconvenience rather than a crisis. (1 mark) However, Source E implies that vulnerability is only partially manageable for the most tourism-dependent small island destinations. The Maldives and Caribbean island states have extremely limited land area, natural resources and economic alternatives — their geography makes diversification genuinely difficult. For these destinations, vulnerability management requires a dual approach: both reducing leakage so more tourism revenue is retained for emergency reserves, and developing premium, high-value tourism that generates more revenue from fewer visitors while reducing environmental and social carrying capacity pressures. (1 mark)", "lo": false}, {"id": "Q2.2.k", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source F and your own knowledge, explain the positive social impacts of tourism on destination regions.", "src": {"t": "quote", "lbl": "Source F", "cap": "Positive social impacts — cultural preservation and ecosystem services", "credit": "Adapted from case studies of cultural preservation and tourism, 2022", "info": "", "text": "\"Shadow puppetry in China is an ancient art form that is culturally important to local communities as it passes on history and traditions. With tourists showing greater interest, innovations were made to attract viewers — people can now watch a shadow puppetry show using Virtual Reality (VR). This has helped to preserve and revitalise the art form. In Sanjiangyuan National Park in China, sightings of rare snow leopards have drawn tourists. The villagers in Angsai village run a community-based tourism programme which allows tourists to stay with local families and view snow leopards in the wild. Sanjiangyuan National Park provides cultural ecosystem services including aesthetic benefits, educational benefits, recreational benefits, and spiritual benefits for Buddhist locals who connect spir"}, "ans": "Source F shows that tourism revenue can provide powerful incentives for the preservation of traditional cultural practices that might otherwise decline. In China, tourist interest in shadow puppetry encouraged communities to innovate — introducing VR technology to attract younger audiences — thereby revitalising an ancient art form that carries historical and cultural significance. Without tourism demand, there would be less financial incentive for communities to maintain and develop these traditions, and cultural knowledge would risk being lost between generations. (1 mark) Source F also demonstrates how tourism can enhance cultural ecosystem services — the benefits that people derive from their relationship with natural and cultural environments. The Sanjiangyuan National Park community-based tourism programme provides aesthetic, educational, recreational and spiritual benefits to both tourists and local residents. By creating economic value for the snow leopard habitat, tourism gives Buddhist villagers an additional economic incentive to protect the sacred mountains and wildlife they already value spiritually — aligning economic and cultural motivations for conservation. (1 mark) The community-based tourism model described in Source F — where tourists stay with local families and directly engage with local life — represents an approach to tourism that maximises positive social impacts by ensuring authentic cultural exchange rather than superficial tourist-local interaction. When tourists have meaningful, respectful engagement with local communities, both parties benefit: tourists gain genuine cultural understanding, while locals gain income and pride in their culture. (1 mark)", "lo": false}, {"id": "Q2.2.l", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source G and your own knowledge, explain how negative social impacts of tourism can affect the quality of life of local communities in destination regions.", "src": {"t": "table", "lbl": "Source G", "cap": "Negative social impacts of tourism — commodification, cultural clashes and crime", "credit": "Adapted from case studies of negative social impacts of tourism, 2022", "info": "", "hdr": ["Negative impact", "How it occurs", "Example", "Consequence"], "rows": [["Commodification", "Heritage tourism demand causes rituals to be exaggerated, staged or mass-produced for tourists", "Traditional dances performed on demand multiple times daily; mass-produced \"ethnic\" handicrafts", "Loss of authenticity; conflict between locals who support and oppose tourism"], ["Cultural clashes", "Differences in values, dress codes and behaviour between tourists and locals create friction", "Tourists in revealing swimwear in conservative Islamic communities; ignoring local customs", "Hostility, resentment and anti-tourist sentiment among local communities"], ["Rise in crimes", "Tourists with visible wealth in economically unequal destination regions attract criminal activity", "Pickpocketing, scams targeting tourists; drug trafficking in resort areas", "Tourists as crime victims; reputational damage; locals as perpetrators"]]}, "ans": "Source G shows that the commodification of cultural practices directly damages the quality of life of local communities by eroding the authenticity and cultural value of traditions that are central to community identity. When traditional dances are performed on demand multiple times daily or handicrafts are mass-produced for the tourist market, they lose the spiritual and communal significance that made them meaningful. Source G notes that this creates conflict within communities between those who support tourism-led cultural adaptation and those who fear irreversible cultural loss — social division that reduces community cohesion and well-being. (1 mark) Cultural clashes shown in Source G — where differences in dress codes, values and behaviour between tourists and locals create friction — directly harm the quality of life of local residents by making them feel like strangers in their own communities. When tourists in revealing swimwear enter conservative religious communities, or when visitors ignore local customs around silence, dress or sacred spaces, locals experience disrespect and the erosion of cultural norms that define their daily life. Over time, this breeds hostility and anti-tourist sentiment. (1 mark) The rise in crimes shown in Source G — including pickpocketing, scams and drug trafficking — harms the quality of life of both tourists and local communities. The broader community experiences reputational damage to its destination as a safe place to live and visit — potentially reducing future tourism revenues that the community depends on for income and services. (1 mark) The unequal interaction between tourists and local communities described in Source G is particularly damaging for local quality of life when it reflects deeper economic inequalities. When tourists arrive from wealthy generating regions with visible luxury spending power in communities with low incomes, the contrast can create resentment, aspirational consumerism among young locals that conflicts with traditional values, and a sense that the local community exists primarily to serve visitors rather than to live according to its own values and priorities. (1 mark)", "lo": false}, {"id": "Q2.2.m", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source H and your own knowledge, explain both the positive and negative environmental impacts of tourism using the Great Barrier Reef as a case study.", "src": {"t": "quote", "lbl": "Source H", "cap": "Great Barrier Reef — positive and negative environmental impacts of tourism", "credit": "Adapted from UNWTO, Great Barrier Reef Marine Park Authority and academic literature, 2022", "info": "", "text": "\"The Great Barrier Reef attracts approximately 2 million visitors per year and generates around A$6.4 billion annually for the Australian economy. However, tourist boat engines release pollutants into the water; sunscreen chemicals damage coral; waste sometimes enters the marine environment; and the sheer volume of snorkellers and divers physically disturbs coral structures. Nevertheless, tourism has also funded significant conservation efforts — the Great Barrier Reef Marine Park was established in 1975, employing hundreds of specialised rangers and scientists, and tourism revenue funds environmental education programmes that have raised global support for reef protection.\""}, "ans": "Source H shows that tourism generates significant negative environmental impacts on the Great Barrier Reef. Tourist boat engines release carbon dioxide and pollutants; swimmer sunscreen chemicals damage coral; tourist vessel waste enters the marine environment; and the physical disturbance from 2 million annual snorkellers and divers damages coral structures. These impacts have contributed to the reef's severe coral bleaching events, with coral cover dropping to approximately 30% of 1960s levels. (1 mark) The negative environmental impacts described in Source H represent a fundamental paradox of tourism — the natural environment that attracts tourists is simultaneously damaged by their presence. This is a direct manifestation of the stagnation phase of the Tourist Area Cycle, where tourist numbers exceed the destination's carrying capacity, generating negative environmental impacts that threaten the very attractions that drew tourists. (1 mark) However, Source H also demonstrates that tourism generates significant positive environmental impacts — the A$6.4 billion in annual tourism revenue has provided both the financial incentive and the funding needed to establish and maintain the Great Barrier Reef Marine Park since 1975. Without tourism generating economic value from the reef, there would be far less political and financial motivation to fund the hundreds of rangers, scientists and environmental education programmes that the Marine Park employs for reef protection. (1 mark) Source H's environmental education programmes represent a particularly important positive impact — by raising tourist awareness of threats to the reef, tourism creates an informed global community of reef advocates who generate political pressure for stronger environmental protection. This demonstrates how well-managed tourism can simultaneously use and protect natural environments, converting tourist experiences into conservation support through education. (1 mark)", "lo": false}, {"id": "Q2.2.n", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source I and your own knowledge, explain how tourism causes negative environmental impacts through pollution and through the depletion of natural resources and threats to wildlife habitats.", "src": {"t": "table", "lbl": "Source I", "cap": "Negative environmental impacts of tourism — pollution and habitat threats", "credit": "Adapted from UNWTO, ICAO and academic literature, 2022", "info": "", "hdr": ["Impact type", "How tourism causes it", "Scale / example"], "rows": [["GHG emissions", "Aviation accounts for ~2.5% of global CO₂; cruise ships emit sulphur dioxide and particulates", "Aviation CO₂: ~915 million tonnes/year; cruise ship pollution ≡ thousands of cars"], ["Sewage and waste", "Inadequate sewage facilities; tourist vessels discharging waste at sea", "Caribbean cruise ships discharge sewage; beach litter at mass tourism destinations"], ["Habitat encroachment", "Hotel and resort construction clears forests, mangroves and coastal vegetation", "Coastal mangrove loss for resort development in Southeast Asia"], ["Natural resource depletion", "Tourism uses large quantities of freshwater, energy and land", "Golf courses use water equivalent to a town of 60,000 people; coral removed for souvenirs"], ["Wildlife threats", "Tourist boat traffic disturbs marine mammals; souvenir trade drives poaching", "Whale watching boats disturbing cetacean behaviour; illegal coral and shell trade"]]}, "ans": "Source I shows that aviation — the primary transit mode connecting tourist generating and destination regions — accounts for approximately 2.5% of global CO2 emissions and produces approximately 915 million tonnes of CO2 per year. This represents a significant contribution to the enhanced greenhouse effect and climate change that paradoxically threatens many of the natural environments that tourists visit. Cruise ships described in Source I also emit sulphur dioxide and particulates equivalent to thousands of cars, creating localised air pollution around port cities. (1 mark) The sewage and waste pollution described in Source I directly damages the water quality and ecosystem health of destination environments. Caribbean cruise ships discharge treated (and sometimes untreated) sewage into coastal waters, threatening the coral reef ecosystems that are the primary tourist attractions of the region. Beach litter at mass tourism destinations demonstrates how the concentration of large numbers of tourists generates volumes of waste that overwhelm local waste management systems. (1 mark) Source I shows that the construction of hotels, resorts and tourist facilities encroaches on natural habitats — particularly coastal mangroves in Southeast Asia — causing habitat fragmentation. Natural resource depletion is equally significant: golf courses associated with resort tourism can use as much water as a town of 60,000 people, competing directly with local agricultural and domestic water needs in areas that may already face water scarcity. (1 mark) Wildlife threats shown in Source I include both direct impacts (tourist boat traffic disturbing marine mammals; wildlife watching disrupting breeding cycles) and indirect impacts through the souvenir trade (driving poaching of coral and sea shells). These threats demonstrate how even seemingly benign tourist activities — whale watching, reef snorkelling, wildlife safaris — can cumulatively cause significant harm to vulnerable species if not carefully managed. (1 mark)", "lo": false}, {"id": "Q2.2.o", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source J and your own knowledge, explain how tourism can both degrade and restore natural environments, and assess whether tourism revenue is sufficient to fund effective environmental restoration.", "src": {"t": "quote", "lbl": "Source J", "cap": "Environmental restoration through tourism — case studies", "credit": "Adapted from case studies of environmental management in tourism destinations, 2022", "info": "", "text": "\"The restoration of the Singapore River (1977–1987) transformed a heavily polluted waterway into a vibrant waterfront destination — Clarke Quay — after a decade of clean-up costing approximately S$300 million and relocating over 5,000 affected businesses and families. In the Philippines, reef damage at popular dive sites led dive operators to voluntarily establish marine sanctuaries, collecting entrance fees from tourists to fund reef restoration — demonstrating how private sector actors can take responsibility for environmental restoration when government action is insufficient.\""}, "ans": "Source J demonstrates through the Singapore River case that environmental degradation can be reversed through sustained investment and political commitment. The river had been so severely degraded by industrial and agricultural pollution that it could no longer support aquatic life. The S$300 million clean-up over a decade transformed it into a vibrant tourism and cultural asset — Clarke Quay — showing that degraded environments can be successfully restored if sufficient financial and political resources are committed. (1 mark) Source J also shows that environmental restoration can create entirely new tourism attractions, generating revenues that justify and sustain the investment. The Singapore River transformation generated ongoing tourism revenue through restaurants, bars and entertainment venues — demonstrating that environmental restoration can be an economically rational investment rather than purely a cost. (1 mark) The Philippines dive sanctuary example in Source J shows that even without government action, private sector actors can initiate environmental restoration when they recognise that their long-term economic interests depend on maintaining the natural environment. The entrance fee funding model creates a direct financial link between tourist visits and reef restoration, aligning economic incentives with environmental outcomes. (1 mark) However, Source J also illustrates important limitations of tourism revenue as a restoration funding mechanism. The Singapore River required S$300 million and the resettlement of over 5,000 businesses and families — a scale of investment and social disruption that only a well-funded government with strong political authority could coordinate. In most developing tourism destinations, this level of government-led intervention is not feasible. (1 mark) An additional limitation is that tourism revenue itself is the product of the very activities that cause environmental degradation — aviation emissions, tourist footfall, accommodation construction. Using tourism revenue to fund environmental restoration creates a circular problem. True environmental sustainability requires not just restoration funding but fundamental changes in the scale and nature of tourism — reducing visitor numbers below carrying capacity, shifting to low-carbon transport and accommodation, and ensuring that ecosystem services on which tourism depends are genuinely protected rather than merely partially restored. (1 mark)", "lo": false}, {"id": "Q2.2.p", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source K and your own knowledge, to what extent do you agree that tourism is an effective engine of economic development for destination regions? Explain your answer.", "src": {"t": "quote", "lbl": "Source K", "cap": "Commentary from a World Bank economic development report on tourism", "credit": "Adapted from a World Bank economic development report, 2022", "info": "Key claims: Tourism is often the only realistic economic development pathway for small island developing states with limited natural resources. | Where leakage is high, tourism functions as a \"pipeline\" channelling wealth to foreign shareholders — not developing local communities. | Effective tourism development requires deliberate policies: local ownership, local employment and local sourcing of goods. Consider: Is tourism always a reliable development engine? What conditions must be met for to", "text": "Tourism is often promoted as an engine of economic development for low-income countries — a labour-intensive, export-oriented industry that can generate jobs and foreign exchange with relatively low capital investment compared to manufacturing. For small island developing states and landlocked developing countries with limited natural resources, tourism may be the only realistic pathway to economic growth. However, the evidence on tourism's actual development impact is deeply mixed. In countries where leakage rates are highest, the tourism sector has functioned more like a 'pipeline' that channels wealth from foreign tourists through foreign-owned businesses to foreign shareholders, leaving local communities with the environmental costs and social disruption of hosting tourists while shari"}, "ans": "Agree — tourism can generate significant development benefits: Source K correctly identifies tourism's genuine development potential — it is labour-intensive, requires relatively low capital investment compared to manufacturing, and can generate employment and foreign exchange even for countries with limited industrial infrastructure. The Maldives transformed from one of the world's poorest countries in the 1980s to a middle-income economy today through tourism, with revenues funding healthcare, education and infrastructure. In 2019, tourism supported 330 million global jobs — 10% of the workforce — and contributed ~10% of global GDP. For small island developing states with no oil, minerals or manufacturing capacity, tourism is often the only realistic economic development pathway. Partially disagree — leakage severely limits tourism's development impact: However, Source K's critique is powerfully supported by evidence. The UNEP statistic that only US$5 of every US$100 spent by a tourist in a developing country remains in the local host community reveals that mass tourism frequently functions as Source K describes: a 'pipeline' channelling wealth through foreign-owned businesses to foreign shareholders. This means that destination communities bear the environmental costs and social disruption of tourism while receiving only a fraction of the financial benefits. True economic development requires that communities accumulate wealth, improve infrastructure and raise living standards — outcomes that high leakage rates systematically undermine. Conclusion: On balance, I agree that tourism has genuine development potential, but only when the conditions identified in Source K are deliberately created: local ownership, local employment and local sourcing of goods and services. Tourism without these policies functions as an extractive industry rather than a development engine.", "lo": true}, {"id": "Q2.2.q", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"The negative impacts of tourism development always outweigh its positive impacts.\" Do you agree with this statement? Explain your answer.", "src": null, "ans": "Disagree — positive impacts are substantial and well-evidenced: Source L provides clear evidence that tourism development generates genuine and significant positive impacts across economic, social and environmental dimensions. The Maldives example demonstrates that tourism can be transformative — a country that was one of the world's poorest in the 1980s is today a middle-income economy. In China, tourist interest revitalised shadow puppetry, driving technological innovation through VR. The Singapore River restoration created the Clarke Quay tourism zone — a publicly accessible waterfront environment providing aesthetic, recreational and cultural benefits to residents and tourists alike. Partially agree — negative impacts are severe and often underestimated: However, Source L also documents serious negative impacts that can negate positive outcomes when tourism is poorly managed. The COVID-19 shock to Thailand — an 83% fall in arrivals threatening the livelihoods of 18% of the workforce — reveals how economic overdependence on tourism creates systemic vulnerability. The Great Barrier Reef — visited by 2 million tourists annually — faces coral bleaching with coral cover having declined to approximately 30% of 1960s levels. The commodification of Bali's sacred Kecak fire dance — performed on demand multiple times daily — represents the irreversible erosion of spiritual and cultural meaning that cannot be easily restored once lost. Disagree — the balance of impacts depends critically on management quality: The statement's use of 'always' is demonstrably inaccurate. Source L shows that impacts vary dramatically depending on governance, ownership structures and management policies. Singapore — with strong local ownership, institutional capacity and deliberate environmental management — experiences relatively low leakage, restored environments and culturally vibrant tourism. Caribbean small islands — facing up to 80% leakage and limited government capacity — experience a fundamentally different balance of impacts. The difference is not determined by tourism itself but by the policy choices that govern how tourism is managed. Nuanced evaluation — negative impacts are more likely when regulation is absent: Source L suggests that negative impacts tend to dominate when several conditions coincide: high leakage rates, mass tourism volumes that exceed carrying capacity, and weak institutional capacity to regulate environmental and social impacts. In contrast, positive impacts dominate when tourism is locally owned, visitor numbers are managed relative to carrying capacity, and communities have genuine agency in deciding how tourism develops. Conclusion: On balance, I strongly disagree that the negative impacts of tourism development 'always' outweigh the positive impacts. The evidence consistently shows that the balance depends on management quality, governance, leakage rates and whether tourism exceeds carrying capacity. Tourism that is well-managed, locally owned and scaled appropriately to the environment's carrying capacity can and does produce positive impacts that exceed its costs.", "lo": true}, {"id": "Q2.2.r", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"The economic impacts of tourism on destination regions are more significant than the social and environmental impacts.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — economic impacts are immediately visible and large-scale: The economic impacts of tourism are undeniably significant and, in many destination regions, fundamental to national development. Tourism contributed approximately 10% of global GDP and supported 330 million jobs in 2019. For tourism-dependent economies like the Maldives (tourism ~28% of GDP) and Thailand (~20% of GDP), tourism is the primary engine of economic activity — funding government revenues, infrastructure investment and household income for millions of families. The economic impact of COVID-19 on tourism destinations — Thailand losing ~US$50 billion in receipts and having 18% of its workforce threatened — demonstrates the centrality of tourism to destination economies. Disagree — social impacts can be equally severe and longer-lasting: However, the social impacts of tourism can be equally significant — particularly because many are irreversible. Once cultural practices become commodified and lose their authenticity — as with the Balinese Kecak fire dance performed on demand multiple times daily — the spiritual and communal meaning that made them valuable cannot be easily restored. Cultural clashes that create hostility between local communities and tourists fundamentally alter the social fabric of destination communities, creating lasting divisions and resentments. The rise in crime associated with mass tourism has long-lasting consequences for community safety, social trust and destination reputation. Disagree — environmental impacts can be permanent and existential: The environmental impacts of tourism may be the most significant of all in the long run, because they threaten the very natural capital on which all three types of impact depend. The degradation of the Great Barrier Reef represents a potential irreversible loss of one of the world's greatest natural ecosystems. Once coral reef ecosystems collapse, the economic tourism income they generate, the cultural ecosystem services they provide and the regulatory ecosystem services they offer are all simultaneously lost. Deforestation for hotel construction and mangrove clearance for resort development are similarly irreversible on human timescales. Nuanced evaluation — all three are interconnected and mutually reinforcing: The statement's implicit hierarchy — economic > social > environmental — misrepresents the way these impacts interact. Economic impacts depend on social stability (cultural preservation attracts tourists; crime reduces destination appeal) and environmental health (pristine natural environments are primary attractions). Social impacts are shaped by economic conditions (poverty-driven crime; wealth inequality between tourists and locals). Environmental impacts are generated by economic activity and shape the social and cultural life of communities. The three dimensions are inseparable in practice. Conclusion: On balance, I disagree that economic impacts are always more significant than social and environmental impacts. While economic impacts are most immediately visible and measurable, the social and environmental impacts of tourism can be equally or more significant — particularly because many are irreversible. The most accurate characterisation is that all three categories are deeply interconnected and equally significant, requiring simultaneous attention rather than prioritising economic impacts at the expense of social and environmental well-being.", "lo": true}, {"id": "Q2.2.s", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "Using Source M and your own knowledge, to what extent do you agree that the negative social and environmental impacts of tourism on local communities outweigh the economic benefits? Explain your answer.", "src": {"t": "quote", "lbl": "Source M", "cap": "Remarks by a community leader in a tourism destination region", "credit": "Adapted from community testimony at a tourism development forum, 2022", "info": "Key claims: The community had no agency in tourism development — \"we did not invite the hotels\" — tourism arrived and transformed the village without genuine community consent. | Economic benefits are real but limited: \"young people have jobs and we have a new clinic\" — but these are offset by cultural and environmental losses. | Cultural and environmental losses are severe: sacred festival commodified; language eroding; reef \"half gone\" — and these losses persist after tourists stop coming. Con", "text": "We did not invite the hotels. We did not ask for the tour buses. We did not design the souvenir markets that replaced our fishing boats. Tourism arrived and transformed our village — some say for the better, because now our young people have jobs and we have a new clinic. But ask our elders. They will tell you that the festival we once held to give thanks to the sea is now held for the tourists, not for us. They will tell you that our children speak more English than our own language. They will tell you that the reef that our grandparents dived, that fed our families for generations, is half gone. When the tourists finally stop coming — and they always do, eventually — what will be left for us?\" Community leader, tourism destination region Community testimony, tourism development forum, 20"}, "ans": "Agree — Source M powerfully articulates genuine losses: The community leader in Source M articulates a perspective that is too often absent from economic analyses of tourism — the lived experience of communities whose cultures, environments and ways of life have been transformed without their consent. The transformation of a traditional spiritual festival into a tourist performance represents cultural commodification at its most damaging: the festival is 'now held for the tourists, not for us,' meaning the community has lost the primary function — communal spiritual renewal — that made the festival meaningful. Similarly, children speaking 'more English than our own language' reflects linguistic erosion driven by the economic necessity of communicating with tourists — a loss of cultural heritage that is difficult to reverse once intergenerational transmission is broken. Agree — environmental losses can be permanent and community-defining: Source M's reference to 'the reef that our grandparents dived, that fed our families for generations, is half gone' represents perhaps the most serious impact: the permanent loss of a natural provisioning and regulating ecosystem service that sustained community livelihoods and cultural identity over multiple generations. When the natural environment that defines a community's cultural identity, food security and economic foundation is permanently degraded, the loss extends far beyond any economic benefit that tourism has delivered. Partially disagree — economic benefits are real and meaningful: However, it would be inaccurate to dismiss the economic benefits identified even in Source M — 'our young people have jobs and we have a new clinic.' For many communities in tourism destination regions, particularly those in developing countries with limited economic alternatives, tourism employment represents genuine poverty reduction and access to healthcare and education that would otherwise be unavailable. Nuanced evaluation — the balance depends on agency and distribution: Source M's most powerful insight is captured in the phrase 'we did not invite the hotels.' The negative impacts described are most severe precisely because the community was not a decision-making agent in its own tourism development — tourism arrived and transformed the village without genuine community consultation or control. When communities have genuine agency over tourism development — as in community-based tourism programmes like Angsai village's snow leopard tourism — they can design tourism that aligns with their values, preserves their culture and protects their environment while generating economic benefits. Conclusion: On balance, Source M makes a compelling case that in communities where tourism arrived without genuine community agency and has generated high leakage rates, destroyed natural environments and commodified cultural practices, the negative social and environmental impacts do outweigh economic benefits — particularly when seen from the perspective of future generations. However, I do not agree that this is universally true: tourism that is community-designed, locally owned, environmentally managed and culturally sensitive can generate positive outcomes simultaneously. The critical variable is not tourism itself but the governance and agency conditions under which it develops.", "lo": true}, {"id": "Q2.2.t", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "\"Globalisation has brought more benefits than costs to international tourism.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — globalisation has dramatically expanded tourism opportunities and accessibility: Globalisation has unambiguously expanded international tourism by increasing the ability, mobility and motivation of hundreds of millions of people to travel. The global middle class grew from 0.6 billion in 1970 to 4.1 billion in 2022, with billions of new potential tourists in China, India and Southeast Asia gaining the financial ability to travel internationally. Globalisation's digital dimension — the growth of online booking platforms, social media and travel review sites — has made tourism planning and booking dramatically cheaper and easier, democratising access to a far wider range of destinations and experiences. Tourism generating and destination regions have become far more diverse, creating development opportunities for previously overlooked destinations in Asia, Africa and the Middle East. Partially disagree — globalisation has intensified negative tourism impacts: However, globalisation has also intensified the negative impacts of tourism by accelerating the speed and scale at which destinations are discovered and overwhelmed. Before globalisation, the progression of a destination through Butler's Tourist Area Cycle took decades — giving communities time to adapt and manage change. Social media and viral digital content have compressed this to years, as Iceland's transformation from 489,000 to 2.3 million visitors between 2010 and 2018 demonstrates. Globalisation has also enabled large multinational hotel chains and tour operators to dominate destination economies, increasing economic leakage and reducing local community economic participation. Conclusion: On balance, I agree that globalisation has brought more benefits than costs to international tourism — it has created enormous economic opportunities, enabled unprecedented human connection across cultures and democratised access to travel experiences. However, these benefits are most evident when tourism revenues reach local communities rather than leaking to foreign shareholders, and when destinations have the institutional capacity to manage the speed and scale of tourist arrivals that globalisation enables.", "lo": true}], "2.3": [{"id": "Q2.3.a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by \"sustainable tourism development\"?", "src": null, "ans": "Sustainable tourism development is achieved when sustainability principles are applied to the economic, social and environmental aspects of tourism development, with all three dimensions balanced to guarantee tourism's long-term viability for present and future generations. (1 mark)", "lo": false}, {"id": "Q2.3.b", "ao": "AO1", "marks": 1, "cmd": "State", "text": "State the difference between \"ecotourism\" and \"community-based tourism.\"", "src": null, "ans": "Ecotourism is a form of sustainable tourism that takes place in natural areas, aimed at conserving the natural environment while benefiting the local community, whereas community-based tourism is an innovative small-scale tourism managed and owned by local communities — such as homestays and agricultural tourism — that seeks to increase people's involvement and ownership of tourism at the destination. (1 mark)", "lo": false}, {"id": "Q2.3.c", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two ways in which governments can influence sustainable tourism development.", "src": null, "ans": "Governments establish policies, create plans and enforce regulations to manage tourism development — for example, setting visitor quotas, zoning protected natural areas and regulating the construction of tourist facilities. (1 mark) Governments can invest tourism revenues in social services such as schools and clinics that raise standards of living among local communities, ensuring that tourism contributes to economic sustainability. (1 mark)", "lo": false}, {"id": "Q2.3.d", "ao": "AO1", "marks": 2, "cmd": "Identify", "text": "Identify two limitations of pro-poor tourism (PPT) as an approach to sustainable tourism development.", "src": null, "ans": "PPT may be unable to significantly reduce poverty compared to direct investment in social services — tourism income is irregular and seasonal, whereas healthcare and education investments provide more consistent poverty-reducing benefits. (1 mark) The economic benefits of PPT may be highly unevenly distributed, with most benefits flowing to non-poor locals with existing skills, assets or business connections rather than to the poorest community members that PPT aims to help. (1 mark)", "lo": false}, {"id": "Q2.3.e", "ao": "AO1", "marks": 3, "cmd": "State", "text": "State three conditions required for sustainable tourism production.", "src": null, "ans": "The demands placed on ecosystem services by tourism must not exceed the supply of natural resources available — for example, tourist water usage must not deplete freshwater supplies that local communities and agriculture also depend on. (1 mark) Different stakeholders must adopt a long-term, responsible and coordinated approach to tourism development instead of prioritising short-term profits that deplete natural or cultural assets. (1 mark) Tourism development should maintain essential ecological processes and conserve natural heritage and biodiversity, ensuring that the natural environments that attract tourists are preserved for future generations. (1 mark)", "lo": false}, {"id": "Q2.3.f", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source A, explain how tourism development can contribute to sustainable development across all three dimensions, and why all three dimensions must be balanced.", "src": {"t": "note", "lbl": "Source A", "cap": "Three dimensions of sustainable tourism development", "credit": "Adapted from UNWTO Sustainable Tourism Guidelines and case study data, 2022", "info": "Key principle: All three dimensions must be balanced simultaneously. An overfocus on any one dimension leads to the others being compromised — and ultimately undermines the long-term sustainability of the destination itself.", "text": "Key principle: All three dimensions must be balanced simultaneously. An overfocus on any one dimension leads to the others being compromised — and ultimately undermines the long-term sustainability of the destination itself."}, "ans": "Source A shows that economic sustainability requires tourism development to continuously provide stable employment and income growth, and to reinvest tourism revenues in social services such as schools and clinics that raise living standards. The Maldives example demonstrates this — tourism revenues transformed an extremely poor country into a middle-income economy. For economic sustainability to be maintained, tourism income must be stable, accessible to local communities and not so heavily concentrated in foreign-owned businesses that high leakage prevents meaningful community development. (1 mark) Source A demonstrates that social sustainability requires tourism to respect the authenticity of local cultural practices and art forms. Japan's preservation of traditional onsen culture shows how heritage tourism can support local festivals, crafts and traditions when tourism development is designed to enhance rather than exploit cultural identity. Social sustainability fails when commodification destroys the authenticity and cultural meaning that made practices valuable in the first place. (1 mark) Source A highlights that environmental sustainability requires tourism to maintain essential ecological processes and protect biodiversity — Costa Rica's national park system demonstrates how protected natural areas can generate tourism revenue while preserving the biodiversity that attracts tourists. Crucially, an overfocus on economic sustainability (building more resorts for revenue) without environmental sustainability (protecting coral reefs) destroys the very natural environment that generates tourism income — demonstrating why all three dimensions must be balanced. (1 mark)", "lo": false}, {"id": "Q2.3.g", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source B and your own knowledge, explain how sustainable tourism production can be achieved and what happens when it fails.", "src": {"t": "quote", "lbl": "Source B", "cap": "Sustainable tourism production — Sentosa (Singapore) vs Bali (Indonesia)", "credit": "Adapted from UNWTO Sustainable Tourism 2030 and case studies, 2022", "info": "", "text": "\"In Sentosa Island, Singapore, the authorities bring together different stakeholders — comprising businesses, the authorities and locals — to develop a series of long-term plans to enable the island to become more sustainable. To achieve carbon-neutral status, the authorities are working together with businesses and locals to increase the use of locally-sourced produce, as well as adopting renewable energy solutions. In Bali, Indonesia, many hotels and resorts were developed and they use a lot of water. In the long run, water supply may be depleted, negatively impacting the tourism industry and rice farming which requires a lot of water. These farms are also tourist attractions, and if affected, tourists may be less keen to visit Bali. Hence, this may hinder sustainable tourism development"}, "ans": "Source B describes Sentosa Island, Singapore as an example of sustainable tourism production being achieved through a coordinated, multi-stakeholder approach — authorities, businesses and local communities working together towards long-term goals including carbon-neutral status and locally-sourced produce. This reflects the principle that sustainable tourism production requires different stakeholders to adopt a long-term, responsible and coordinated approach instead of prioritising short-term profit. (1 mark) The Bali example in Source B demonstrates what happens when sustainable tourism production fails — the proliferation of hotels and resorts creates such high water demand that it depletes the water supply available for rice farming. This is a direct example of tourism demands on ecosystem services exceeding the supply of resources available, compromising both agricultural and tourism sustainability. (1 mark) Source B's Bali water example illustrates the interconnectedness of sustainability dimensions — the depletion of water (environmental impact) damages the rice farming landscapes that are themselves tourist attractions (economic impact), while the rice farming communities that depend on water lose income (social impact). This cascade demonstrates that when one dimension of sustainability is compromised, the others inevitably follow — reinforcing why all three must be balanced simultaneously. (1 mark) The contrast between Sentosa and Bali in Source B highlights the critical importance of stakeholder coordination and governance. Sentosa's success is directly attributed to authorities bringing together different stakeholders and developing long-term plans — a deliberate governance intervention that creates shared accountability. Bali's water depletion reflects the absence of such coordination — when hotels individually maximise their own water use without coordinated demand management, the collective impact exceeds what the ecosystem can sustainably supply. (1 mark)", "lo": false}, {"id": "Q2.3.h", "ao": "AO2", "marks": 3, "cmd": "Identify", "text": "Using Source C, explain how different stakeholders can contribute to sustainable tourism development and identify the challenges they face.", "src": {"t": "table", "lbl": "Source C", "cap": "Stakeholders in sustainable tourism — roles and limitations", "credit": "Adapted from UNWTO and case study data, 2022", "info": "", "hdr": ["Stakeholder", "Role in sustainable tourism", "Example", "Key limitation"], "rows": [["Government", "Establishes policies, creates plans, enforces regulations to manage tourism development", "Maya Bay closure (Thailand) — government-mandated complete closure and visitor cap", "Political pressure from tourism industry may weaken environmental regulation"], ["International orgs", "Offer consultancy, financial assistance and raise public awareness", "UNESCO World Heritage listing raises awareness and funds for site protection", "Recommendations are non-binding; countries may not comply"], ["Businesses", "Adopt sustainable practices; seek advice; participate in decision-making", "Sentosa businesses adopting renewable energy and locally-sourced produce", "Short-term profit motive may override long-term sustainability commitments"], ["Local communities", "Participate in decision-making; manage community-based tourism", "Angsai village snow leopard CBT programme (China)", "May lack resources or skills to compete with larger tourism operators"], ["Tourists", "Develop genuine interest in destination; interact responsibly; make sustainable choices", "Choosing eco-certified hotels; purchasing locally-made products", "Most tourists prioritise comfort and convenience over sustainability"]]}, "ans": "Source C shows that governments play the most authoritative role in sustainable tourism development by establishing policies, creating plans and enforcing regulations that all other stakeholders must comply with. Thailand's government-mandated complete closure of Maya Bay and subsequent visitor cap of 375 per day demonstrates how decisive government intervention can reverse environmental degradation that market forces had failed to prevent. However, Source C identifies the critical limitation: political pressure from the tourism industry may weaken environmental regulation when economic interests conflict with sustainability goals. (1 mark) Source C demonstrates that businesses and local communities can contribute through adopting sustainable practices and participating in decision-making. Sentosa businesses adopting renewable energy and locally-sourced produce show how private sector actors can align their operations with sustainability goals when given the right incentives and governance framework. Angsai village's snow leopard tourism shows how local communities can manage their own tourism in ways that protect their environment and culture. However, businesses face the constant tension between short-term profit and long-term sustainability, and local communities often lack the resources or skills to compete with larger operators. (1 mark) Source C's final row highlights tourists as the most numerous but least controllable stakeholders — individual tourist choices can collectively have enormous sustainability implications, but most prioritise comfort and convenience over sustainability. International organisations face the limitation that their recommendations are non-binding, meaning countries can ignore UNESCO guidance without consequence. This fragmentation of stakeholder interests — each with different motivations, resources and accountability mechanisms — represents the fundamental challenge of achieving coordinated sustainable tourism development. (1 mark)", "lo": false}, {"id": "Q2.3.i", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source D and your own knowledge, explain why stakeholders frequently have conflicting priorities in sustainable tourism development and assess how these conflicts can be managed.", "src": {"t": "quote", "lbl": "Source D", "cap": "Conflicting stakeholder priorities in sustainable tourism development", "credit": "Adapted from UNWTO, UNESCO and academic literature on sustainable tourism governance, 2022", "info": "Key challenge: Each stakeholder is internally rational — but their collectively rational individual choices can produce outcomes that undermine sustainability for everyone. Coordination mechanisms and genuine compromise are essential.", "text": "\"The challenge of achieving sustainable tourism development is fundamentally a governance challenge. Stakeholders in tourism have profoundly different priorities, resources and perspectives. A national government may prioritise tourism receipts for economic growth; a hotel chain may prioritise occupancy rates and profit margins; a local fishing community may prioritise the protection of their marine environment and traditional way of life; and a backpacker tourist may prioritise authentic experiences at minimal cost. Achieving sustainable tourism therefore requires not just good intentions but genuine compromise — stakeholders must be willing to sacrifice some individual priorities for collective long-term sustainability.\""}, "ans": "Source D identifies the fundamental governance challenge at the heart of sustainable tourism — each category of stakeholder has profoundly different motivations and definitions of success. A national government prioritising GDP growth may approve large resort developments that generate tax revenue while destroying natural environments. A hotel chain prioritising occupancy rates has no financial incentive to limit visitor numbers. A local fishing community has every incentive to protect the marine environment on which their livelihoods depend. These are not merely differences of opinion — they reflect genuinely incompatible short-term interests that make voluntary coordination extremely difficult. (1 mark) Source D's highway example perfectly illustrates how well-intentioned stakeholder actions can undermine sustainability. A government infrastructure investment designed to improve tourist access can simultaneously destroy the natural landscape that attracted tourists, reducing the long-term tourism appeal of the destination while generating short-term economic benefits from construction contracts. This demonstrates how sustainability failures often arise not from malicious intent but from fragmented decision-making where individual stakeholders optimise for their own interests without accounting for system-wide impacts. (1 mark) The hotel chain example in Source D — importing all food and staff to maximise quality — illustrates how business efficiency goals conflict with community economic sustainability. From the hotel's perspective, importing superior food and trained staff maximises guest satisfaction. From the local community's perspective, this generates high leakage that removes most economic benefit before it reaches local households. Both perspectives are internally rational, but they produce outcomes that undermine sustainable tourism's equitable benefit distribution goals. (1 mark) Source D concludes that resolving these conflicts requires genuine compromise — stakeholders must sacrifice some individual priorities for collective long-term sustainability. In practice, this means governance mechanisms that create accountability: regulations requiring hotels to source a percentage of food locally; tourist arrival caps enforced by government; UNESCO designations creating international scrutiny; community representation in tourism planning. Singapore's Sentosa model — where authorities actively bring together businesses, government agencies and local communities — represents this governance approach in practice. (1 mark) However, when stakeholders have differing amounts of control over resources, those with greater economic power — particularly large multinational tourism corporations — can often out-lobby or out-manoeuvre government regulations and community interests. Truly effective stakeholder management therefore requires not just coordination mechanisms but a deliberate redistribution of power — giving local communities genuine decision-making authority over tourism development in their regions, rather than simply consulting them as one voice among many. (1 mark)", "lo": false}, {"id": "Q2.3.j", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source E and your own knowledge, explain the \"attitude-behaviour gap\" in sustainable tourism consumption and what it means for efforts to achieve sustainable tourism development.", "src": {"t": "chart", "lbl": "Source E", "cap": "Attitude-behaviour gap in sustainable tourism consumption", "credit": "Adapted from Global Sustainable Tourism Council and academic surveys, 2022", "info": "Key gap: 62% say they would pay more for eco-certified accommodation — but only 18% actually did on their last trip. A 44-percentage-point gap between intention and action. Implication: Changing tourist attitudes alone is insufficient — sustainable options must be made the easiest, most visible and ", "chartCfg": "{\n  type:'bar',\n  data:{\n    labels:['Eco-accommodation\\n(willing to pay)','Eco-accommodation\\n(actually stayed)','Local restaurants\\n(actual behaviour)','Local souvenirs\\n(actual behaviour)','Researched airline\\nenvironmental policies','Carbon offset\\n(actual behaviour)'],\n    datasets:[\n      {label:'Stated willingness / attitude (%)',data:[62,null,null,null,null,null],backgroundColor:'#185FA5',borderWidth:0,borderRadius:3},\n      {label:'Actual behaviour on last trip (%)',data:[null,18,34,41,9,12],backgroundColor:'#1D9E75',borderWidth:0,borderRadius:3}\n    ]\n  },\n  options:{\n    indexAxis:'y',\n    responsive:true,maintainAspectRatio:false,\n    plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:16}},tooltip:{callbacks:{label:ctx=>ctx.parsed.x+'% of tourists surveyed'}}},\n    scales:{\n      x:{beginAtZero:true,max:100,ticks:{stepSize:20,font:{size:11},color:'#888780',callback:v=>v+'%'},grid:{color:'rgba(136,135,128,0.12)'},border:{display:false},title:{display:true,text:'% of 2,000 tourists surveyed',font:{size:11},color:'#888780'}},\n      y:{ticks:{autoSkip:false,font:{size:10},color:'#888780'},grid:{display:false},border:{display:false}}\n    }\n  }\n}", "chartId": "chart_2_3_E_Q2.3.j"}, "ans": "Source E reveals a dramatic gap between tourists' stated sustainable intentions and their actual behaviour — 62% say they would pay more for eco-certified accommodation, but only 18% actually stayed in eco-certified accommodation on their last trip. This attitude-behaviour gap suggests that while sustainable tourism values are widely held in principle, they are not being translated into actual consumer choices that would drive demand for sustainable tourism products and services. (1 mark) Source E shows that the gap is particularly acute for high-effort sustainability behaviours — only 9% of tourists researched the environmental policies of airlines before booking, and only 12% offset their carbon emissions, despite aviation being tourism's largest contributor to greenhouse gas emissions. Tourists are more willing to make sustainable choices at the point of purchase (local restaurants 34%, local souvenirs 41%) than to make fundamental changes to how they plan and book travel. (1 mark) The attitude-behaviour gap shown in Source E has significant implications for sustainable tourism development. If the 62% of tourists who claim to value eco-certified accommodation actually stayed in it, demand would increase dramatically, creating powerful market incentives for businesses to invest in sustainability. Currently, the low behavioural translation of sustainable attitudes means that businesses face weak market signals — eco-certification costs money but generates only limited additional demand. (1 mark) Source E implies that achieving sustainable tourism consumption requires not only changing tourist attitudes — which are already broadly positive — but changing the conditions under which travel decisions are made. Effective sustainable tourism consumption therefore requires sustainable options to be made the easiest, most visible and most accessible choices — through green certification labels on booking platforms, carbon footprint displays during flight booking, and destination policies that make sustainably-operating businesses the dominant tourism offer rather than a niche alternative. (1 mark)", "lo": false}, {"id": "Q2.3.k", "ao": "AO2", "marks": 3, "cmd": "Describe", "text": "Using Source F, describe the spectrum of ecotourism approaches and explain how ecotourism strategies can achieve environmental and social sustainability.", "src": {"t": "table", "lbl": "Source F", "cap": "Ecotourism — hard to soft spectrum and key strategies", "credit": "Adapted from IUCN, academic literature and case studies, 2022", "info": "", "hdr": ["Ecotourism strategy", "How it achieves sustainability", "Example"], "rows": [["Educate tourists", "Tours in natural areas increase knowledge and appreciation → tourists take action to conserve and minimise damage", "Galápagos Islands — strict visitor education on endemic species protection; guided interpretation at all sites"], ["Minimise environmental impact", "Tourism revenue channelled into conservation → hire local park rangers → enforce environmental laws → damage minimised", "Costa Rica national park system — entrance fees fund rangers who protect 25%+ of national territory"]]}, "ans": "Source F shows that ecotourism exists on a spectrum from 'hard' to 'soft' approaches. Hard ecotourism involves active, deep engagement with natural environments — such as research participation, wildlife monitoring and scientific expeditions — where tourists are primarily motivated by conservation. Soft ecotourism involves passive, casual appreciation of nature within comfortable, managed settings — such as safari lodges, guided rainforest walks and scenic boat tours. Most tourists engage in soft ecotourism, while only a small minority participate in the more demanding hard ecotourism experiences. (1 mark) Source F shows that ecotourism achieves environmental sustainability through two key strategies. Educational programmes in natural areas — such as the Galapagos Islands' strict visitor education on endemic species protection — increase tourists' appreciation of nature, encouraging responsible behaviour and generating global conservation advocacy. Tourism entrance fees are channelled into conservation funds that hire local park rangers to enforce environmental laws, as demonstrated by Costa Rica's national park system, which has used tourism revenue to protect its world-famous biodiversity. (1 mark) Source F's case studies demonstrate how ecotourism achieves social sustainability alongside environmental sustainability. Hiring local park rangers provides stable, skilled employment for community members who develop deep expertise in ecosystem management. This creates a direct economic incentive for local communities to protect rather than exploit their natural environments — aligning the interests of conservation and community development. The Costa Rica model shows how ecotourism can simultaneously generate government revenue, provide community employment and protect biodiversity — achieving all three sustainability dimensions when well-managed. (1 mark)", "lo": false}, {"id": "Q2.3.l", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source G and your own knowledge, assess the effectiveness of ecotourism and community-based tourism as approaches to sustainable tourism development.", "src": {"t": "quote", "lbl": "Source G", "cap": "Limitations of ecotourism and community-based tourism", "credit": "Adapted from case studies on ecotourism and community-based tourism limitations, 2022", "info": "", "text": "\"Despite its appeal, ecotourism faces significant challenges. As ecotourism destinations become popular, increased tourist numbers can cause the very environmental degradation they were meant to prevent. The Galápagos Islands, despite strict management, have seen invasive species introduced through tourist movements and increasing pressure on endemic wildlife. Community-based tourism faces its own challenges: the influx of tourists can gradually erode the very local culture that makes the destination attractive, as communities adapt to tourist expectations. Small community operators also struggle to compete with the marketing resources and distribution networks of larger tourism operators.\""}, "ans": "Source G reveals a fundamental paradox at the heart of ecotourism — its popularity creates the very environmental pressures it was designed to prevent. As ecotourism destinations attract growing numbers of visitors, increased foot traffic tramples vegetation, disrupts wildlife breeding cycles and generates waste. The Galapagos example shows this even at one of the world's most strictly managed ecotourism destinations — invasive species introduced through tourist movements represent irreversible ecological damage despite extensive protection measures. This suggests that ecotourism's effectiveness has inherent limits defined by the ecological fragility of the environments it seeks to protect. (1 mark) Source G also challenges ecotourism's social sustainability credentials — in many projects, employment goes to non-local workers with specialist skills, while local communities see few direct benefits. This echoes the broader economic leakage problem: ecotourism's requirement for skilled workers may create a situation where the communities whose natural environments attract tourists are excluded from the economic benefits by their lack of specialist qualifications. (1 mark) Source G identifies the cultural erosion paradox of community-based tourism — the influx of tourists can gradually erode the very local culture that makes the destination attractive, as communities adapt their practices to tourist expectations. Over time, CBT may produce exactly the commodification of culture that sustainable tourism is meant to prevent, as communities discover that modified, tourist-friendly versions of their culture are more financially rewarding than authentic practices. (1 mark) Source G notes that small community operators struggle to compete with the marketing resources and distribution networks of larger tourism operators — a structural disadvantage that limits CBT's ability to capture sufficient market share to generate meaningful community income. Despite these limitations, both ecotourism and CBT represent meaningful contributions to sustainable tourism development when they are well-governed, locally embedded and supplemented by government policy support that levels the competitive playing field. (1 mark)", "lo": false}, {"id": "Q2.3.m", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source H and your own knowledge, explain how pro-poor tourism can improve livelihoods and assess its limitations as an approach to sustainable tourism development.", "src": {"t": "quote", "lbl": "Source H", "cap": "Pro-poor tourism — strategies and limitations (Three Parallel Rivers Region, China)", "credit": "Adapted from case studies on pro-poor tourism, Three Parallel Rivers Region, China, 2022", "info": "", "text": "\"Pro-poor tourism (PPT) can be found in the villages around China's Three Parallel Rivers Region, a UNESCO World Natural Heritage Site. With financial assistance offered by the authorities, many villagers have set up tourism businesses such as homestays and restaurants. As a result, the local community has experienced an increase in income and standard of living. However, PPT's effectiveness is limited. The economic benefits of tourism are highly unevenly distributed — most benefits tend to flow to villagers who already have business skills, assets or social connections, while the poorest households receive little direct benefit. Critics also argue that PPT may be unable to significantly reduce poverty compared to direct investment in social services.\""}, "ans": "Source H describes how PPT in China's Three Parallel Rivers Region has enabled villagers to set up homestays, restaurants and cultural performances with government financial assistance, generating increased income and improved living standards. PPT works by connecting the economic opportunities created by tourism directly to the livelihoods of poor communities — through training that builds the skills needed to participate in the tourism economy, and through micro-finance that provides the capital needed to establish tourism businesses. These interventions directly address the two primary barriers that prevent the poor from benefiting from tourism: lack of skills and lack of start-up capital. (1 mark) However, Source H reveals a critical limitation of PPT — economic benefits are highly unevenly distributed. Most benefits flow to villagers who already have business skills, assets or social connections — meaning those who were better-off within the community before tourism arrived capture most of the gains. The poorest households, who lack both the human capital and the social networks to establish successful tourism businesses, may receive little direct benefit even from PPT programmes specifically designed to help them. (1 mark) Source H also presents critics' argument that PPT may be unable to significantly reduce poverty compared to direct investment in social services. Healthcare and education are universally accessible and provide consistent poverty-reducing benefits that do not require the poor to compete in a market environment. Tourism income is inherently variable — dependent on visitor numbers, seasonality and external shocks — meaning it provides an unstable income stream for communities that may lack the reserves to manage income gaps. (1 mark) Despite its limitations, PPT represents a meaningful contribution to sustainable tourism development when implemented alongside — rather than instead of — direct social investment. The Three Parallel Rivers example shows that combining government financial assistance with existing natural and cultural tourism assets can generate real income improvements for rural communities. The key is ensuring that PPT programmes actively reach the poorest community members through targeted training, simplified micro-finance application processes and community governance structures that monitor and address benefit distribution. (1 mark)", "lo": false}, {"id": "Q2.3.n", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source I and your own knowledge, explain how sustainable tourism consumption and equitable distribution of tourism benefits can be achieved.", "src": {"t": "table", "lbl": "Source I", "cap": "Sustainable tourism consumption and equitable distribution — case studies", "credit": "Adapted from UNWTO, Maya Bay management documentation and Inkaterra Hotel Group case study, 2022", "info": "", "hdr": ["Approach", "How it is applied", "Example", "Outcome"], "rows": [["Destination manages demand", "Visitor caps; booking systems; entrance fees; seasonal restrictions", "Maya Bay, Thailand: 375 visitors/day cap; no combustion engines; no overnight stays", "Coral reef recovered after 4-year closure; ecosystem restored to near pre-tourism condition"], ["Community-first policies", "Community consultation; local employment requirements; conservation investment", "Inkaterra Hotel, Peru: local materials; trains locals; invests in cloud forest conservation", "Low carbon footprint; strong local economic participation; conservation of surrounding ecosystem"], ["Responsible tourist choices", "Eco-certified accommodation; local purchasing; waste reduction; cultural respect", "Choosing locally-owned homestays over chains; purchasing handmade souvenirs", "Higher proportion of tourist spending retained locally; reduced cultural commodification"], ["Equitable benefit distribution", "High daily tourism fee; revenue allocated to community development and conservation", "Bhutan: high daily fee; funds conservation and community development; low-volume model", "Low-volume, high-value tourism; benefits distributed to community; environment protected"]]}, "ans": "Source I shows that sustainable tourism consumption requires destination regions to actively manage demand — the Maya Bay visitor cap of 375 per day, prohibition of combustion engines and ban on overnight stays demonstrate how strict demand management can restore a severely degraded natural environment. This reflects the principle that sustainable consumption is only achievable when destinations control access so that tourist numbers remain within ecological carrying capacity, rather than allowing unlimited market-driven demand to degrade the very resources that attract tourists. (1 mark) Source I's Inkaterra Hotel example demonstrates how policies that give local communities primary attention can ensure tourism development generates genuine community benefit — the hotel was built with local materials, trains locals in hospitality and environmental care, and invests in conservation of the surrounding cloud forest. This model reduces economic leakage by maximising local economic participation, while simultaneously achieving environmental sustainability through conservation investment. (1 mark) Source I shows that responsible tourist consumption — choosing eco-certified accommodation, purchasing locally-made products and respecting local customs — directly supports sustainable tourism development by ensuring that a higher proportion of tourist spending is retained in the local economy. When tourists choose locally-owned homestays over international chains, their spending circulates through local supply chains rather than leaking to foreign shareholders. (1 mark) Source I's Bhutan example illustrates how equitable distribution of tourism benefits can be built into a destination's fundamental tourism policy — the high daily tourism fee generates revenue specifically allocated to conservation and community development, ensuring that the financial benefits of tourism are distributed to the entire community rather than captured primarily by tourism businesses. Bhutan's deliberately low-volume, high-value tourism model demonstrates that equitable distribution is most achievable when visitor numbers are controlled. (1 mark)", "lo": false}, {"id": "Q2.3.o", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source J and your own knowledge, explain why achieving sustainable tourism development requires simultaneous action across sustainable production, consumption and equitable distribution, and assess whether this is realistic.", "src": {"t": "quote", "lbl": "Source J", "cap": "Three fronts of sustainable tourism — production, consumption and equitable distribution", "credit": "Adapted from academic literature on sustainable tourism and UNWTO 2030 Agenda, 2022", "info": "", "text": "\"Achieving truly sustainable tourism development requires simultaneous action across three interconnected fronts: sustainable production, sustainable consumption and equitable benefit distribution. Sustainable production without sustainable consumption is undermined when unconstrained tourist demand overwhelms conservation efforts; sustainable consumption without equitable distribution creates 'green tourism' that benefits wealthy tourists and eco-certified operators while leaving poor communities behind. The most promising examples — Bhutan's high-value, low-volume model; Costa Rica's national park system; Japan's heritage tourism management — share a common feature: they are places where governments have made deliberate, sustained choices to prioritise long-term sustainability over short"}, "ans": "Source J argues that sustainable production, consumption and equitable distribution are mutually reinforcing and must be pursued simultaneously rather than sequentially. Sustainable production — such as limiting visitor numbers to protect carrying capacity — is undermined if unconstrained consumer demand overwhelms conservation efforts. This shows why production-side sustainability measures must be matched by consumption-side behaviour change: even the best-designed capacity management systems fail if tourists circumvent rules or simply overwhelm destinations with sheer volume. (1 mark) Source J's second observation — that sustainable consumption without equitable distribution creates 'green tourism' that benefits wealthy tourists and eco-certified operators while leaving poor communities behind — is particularly important. Premium eco-certified accommodation accessible only to high-income tourists may protect natural environments effectively while generating minimal economic benefit for local communities, reproducing the same social inequity that mass tourism creates. (1 mark) Source J's third observation — that equitable distribution without sustainable production depletes the natural and cultural assets on which all tourism benefits depend — closes the circle of interdependence. If communities extract maximum economic value from their natural and cultural environments in the short term without maintaining the ecological and cultural conditions that attract tourists, the foundation for all future tourism benefits is destroyed. The Maya Bay example shows this clearly: maximising short-term tourist numbers depleted the coral reef, ultimately eliminating the tourism income the reef had generated. (1 mark) Source J identifies a common feature of the most successful examples — Bhutan, Costa Rica and Japan — that governments have made 'deliberate, sustained choices to prioritise long-term sustainability over short-term tourism growth.' This is a politically difficult commitment: in economies facing economic pressure, governments face powerful incentives to maximise short-term tourism revenues even at the cost of long-term degradation. Whether simultaneous action across all three fronts is realistic therefore depends heavily on political will and institutional capacity. (1 mark) Despite the formidable governance challenges, Source J's examples demonstrate that simultaneous action is not merely theoretical — it has been achieved in multiple real-world contexts. The most realistic path to sustainable tourism development lies in creating governance structures that make sustainability the default: mandatory sustainability certifications for tourism operators; automatic visitor management systems capping arrivals at carrying capacity; community benefit fund requirements embedded in tourism business licences; and international financial support for developing destinations to build the institutional capacity needed for effective sustainability governance. (1 mark)", "lo": false}, {"id": "Q2.3.p", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source K and your own knowledge, to what extent do you agree that ecotourism is an effective approach to achieving sustainable tourism development? Explain your answer.", "src": {"t": "quote", "lbl": "Source K", "cap": "Commentary by a tourism sustainability researcher", "credit": "Adapted from a tourism sustainability research commentary, 2022", "info": "Key claims: Ecotourism is increasingly \"greenwashed\" — operators use sustainability language for marketing without delivering genuine conservation or community benefit. | True ecotourism requires deep, ongoing commitment to environmental conservation and genuine community economic participation — n
