}

async function doHint(){
  if(S.thinking||S.hints>=S.maxHints)return;
  const q=S.q;const ua=document.getElementById('ans-box')?.value||'';
  S.thinking=true;S.hints++;renderTutor();
  const prompt=`You are a Socratic Geography tutor for Singapore O-Level Geography (Syllabus 2279).
Question (${q.marks} marks): "${q.text}"
Model answer (do not reveal): "${q.ans}"
${ua?`Student attempt: "${ua}"`:'No attempt yet.'}
This is hint ${S.hints} of ${S.maxHints}. Hint 1=general direction, Hint 2=specific concept or case study, Hint 3=more direct pointer. 2-4 sentences, plain text, do not reveal the answer.`;
  try{
    const r=await fetch('https://geo-sg-proxy.mohammadfauziazman.workers.dev',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:180,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    S.msgs.push(`<div class="tmsg th"><div class="t-lbl">Hint ${S.hints}</div>${d.content?.[0]?.text||'Think about the key geographical concepts and link to a Singapore case study.'}</div>`);
  }catch{
    S.msgs.push(`<div class="tmsg th"><div class="t-lbl">Hint ${S.hints}</div>Think about what the source is showing you. What geographical process or relationship does it demonstrate? Link to a specific Singapore case study from the syllabus.</div>`);
  }
  S.thinking=false;renderTutor();
}

async function doSubmit(){
  if(S.thinking||S.submitted)return;
  const q=S.q;const ua=document.getElementById('ans-box')?.value?.trim()||'';
  if(!ua){S.msgs.push(`<div class="tmsg te">Please write your answer before submitting.</div>`);renderTutor();return;}
  S.thinking=true;renderTutor();
  const isL=q.lo;
  const prompt=`You are an SEAB O-Level Geography examiner (Syllabus 2279). Mark this student answer.
Question (${q.marks} marks): "${q.text}"
Model answer: "${q.ans}"
Student answer: "${ua}"
${isL?'LORMS: Level 1 (1-2 marks): vague, no judgement. Level 2 (3-4 marks): some understanding, one-sided. Level 3 (5-6 marks): balanced, well-reasoned. State "Level X — Y marks" clearly.':''}
Give: marks (X/${q.marks}), ${isL?'LORMS level, ':''}strengths (1-2 sentences), what was missing (1-2 sentences), one tip. Concise and encouraging. Plain text.`;
  let marksGot=0,lv=null,fbText='Good attempt! Review the model answer carefully. (AI feedback unavailable — check proxy connection.)';
  try{
    const r=await fetch('https://geo-sg-proxy.mohammadfauziazman.workers.dev',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    fbText=d.content?.[0]?.text||fbText;
    const mm=fbText.match(/(\d+)\s*\/\s*\d+/);if(mm)marksGot=parseInt(mm[1]);
    const lm=fbText.match(/Level\s*([123])/i);if(lm)lv=parseInt(lm[1]);
  }catch{}
  S.submitted=true;
  let fh=`<div class="tmsg tf"><div class="t-lbl">Examiner feedback</div>${fbText}`;
  if(isL&&lv){fh+=`<div class="lbar">${[1,2,3].map(i=>`<div class="lseg ${i<=lv?'on':''}"></div>`).join('')}</div><div class="ltxt">LORMS Level ${lv}/3</div>`;}
  fh+=`</div>`;S.msgs.push(fh);
  S.thinking=false;renderTutor();renderLeft();
  if(S.user){
    saveScore(q.id,marksGot,q.marks,q.ao,ua).catch(e=>console.warn('Score save error',e));
    // Update local cache for sidebar tick marks
    if(!S.user._scores)S.user._scores={};
    S.user._scores[q.id]={marks:marksGot,max:q.marks,date:Date.now()};
    renderLeft();
  }
}

async function hashPw(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function createClass(){
  const name=document.getElementById('new-cls-name')?.value?.trim();
  const alertEl=document.getElementById('cls-alert');
  if(!name){alertEl.innerHTML=`<div class="alert a-err">Please enter a class name.</div>`;return;}
  const year=new Date().getFullYear();
  const code='GEO-'+name.toUpperCase().replace(/\s/g,'')+'-'+year;
  alertEl.innerHTML=`<div class="alert a-info">Creating class…</div>`;
  try{
    const existing=await sbGet('classes',`code=eq.${code}&select=code`);
    if(existing.length){alertEl.innerHTML=`<div class="alert a-err">A class with this name already exists for ${year}.</div>`;return;}
    await sbPost('classes',{code,name,teacher_email:S.user.email,teacher_name:S.user.name,school:S.user.school||'',year});
    alertEl.innerHTML=`<div class="alert a-ok">Class created! Code: <strong>${code}</strong> — share this with your students.</div>`;
    renderTSidebar();renderTCl();
  }catch(e){alertEl.innerHTML=`<div class="alert a-err">Error: ${e.message}</div>`;}
}

async function renderTSt(){
  const el=document.getElementById('teacher-main');
  el.innerHTML=`<div class="page-title">Students</div><div class="empty">Loading…</div>`;
  if(!S.tClass)return;
  try{
    const members=await sbGet('class_members',`class_code=eq.${S.tClass}&status=eq.approved&select=student_email,joined_at`);
    if(!members.length){el.innerHTML=`<div class="page-title">Students</div><div class="empty">No enrolled students yet.</div>`;return;}
    const emails=members.map(m=>m.student_email);
    const users=await sbGet('users',`email=in.(${emails.map(e=>encodeURIComponent(e)).join(',')})&select=email,name,school`);
    const userMap={};users.forEach(u=>{userMap[u.email]=u;});
    const scoreRows=await sbGet('scores',`class_code=eq.${S.tClass}&select=student_email,marks_awarded,marks_total,submitted_at&order=submitted_at.desc`);
    // Aggregate per student
    const studentScores={};
    scoreRows.forEach(r=>{
      if(!studentScores[r.student_email])studentScores[r.student_email]=[];
      studentScores[r.student_email].push(r);
    });
    let h=`<div class="page-title">Students</div><div class="page-sub">${members.length} enrolled in ${S.tClass}</div>`;
    members.forEach(m=>{
      const u=userMap[m.student_email]||{};
      const sc=studentScores[m.student_email]||[];
      const attempts=sc.length;
      const avg=attempts?Math.round(sc.reduce((a,r)=>a+(r.marks_awarded/r.marks_total*100),0)/attempts):null;
      h+=`<div style="background:#fff;border:1.5px solid #DDD;border-radius:7px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px">
        <div style="width:34px;height:34px;border-radius:50%;background:#1A3A6C;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:bold;flex-shrink:0">${(u.name||m.student_email)[0].toUpperCase()}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:bold;color:#222">${u.name||m.student_email}</div>
          <div style="font-size:11px;color:#888">${m.student_email}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:16px;font-weight:bold;color:${avg>=60?'#1A7A4A':avg!==null?'#C0392B':'#888'}">${avg!==null?avg+'%':'—'}</div>
          <div style="font-size:10px;color:#888">${attempts} attempt${attempts!==1?'s':''}</div>
        </div>
      </div>`;
    });
    el.innerHTML=h;
  }catch(e){el.innerHTML=`<div class="page-title">Students</div><div class="empty">Error: ${e.message}</div>`;}
}

async function renderTWk(){
  const el=document.getElementById('teacher-main');
  el.innerHTML=`<div class="page-title">Weak spots</div><div class="empty">Loading…</div>`;
  if(!S.tClass)return;
  try{
    const scoreRows=await sbGet('scores',`class_code=eq.${S.tClass}&select=question_id,marks_awarded,marks_total`);
    if(!scoreRows.length){el.innerHTML=`<div class="page-title">Weak spots</div><div class="empty">No attempt data yet.</div>`;return;}
    // Aggregate by topic
    const byTopic={};
    scoreRows.forEach(r=>{
      const topic=r.question_id.match(/Q(\d+\.\d+)/)?.[1]||r.question_id.slice(0,5);
      if(!byTopic[topic])byTopic[topic]={g:0,m:0,count:0};
      byTopic[topic].g+=r.marks_awarded;byTopic[topic].m+=r.marks_total;byTopic[topic].count++;
    });
    const sorted=Object.entries(byTopic).map(([topic,d])=>({topic,pct:Math.round(d.g/d.m*100),count:d.count})).sort((a,b)=>a.pct-b.pct);
    const low=sorted.filter(x=>x.pct<60);const ok=sorted.filter(x=>x.pct>=60);
    let h=`<div class="page-title">Weak spots</div><div class="page-sub">Topics where class average is below 60%</div>`;
    if(low.length){
      h+=low.map(w=>`<div class="weak-item"><div style="flex:1"><div style="font-size:13px;font-weight:bold">Topic ${w.topic}</div><div style="font-size:11px;color:#888">${w.count} attempts</div></div><div style="font-size:18px;font-weight:bold;color:#C0392B">${w.pct}%</div><span class="pill pgr">Needs work</span></div>`).join('');
    } else {
      h+=`<div class="empty" style="color:#1A7A4A">✓ No weak spots — class averaging above 60% on all attempted topics.</div>`;
    }
    if(ok.length){h+=`<div class="sec-lbl" style="margin-top:12px">On track</div>`+ok.map(w=>`<div class="weak-item ok"><div style="flex:1"><div style="font-size:13px;font-weight:bold">Topic ${w.topic}</div><div style="font-size:11px;color:#888">${w.count} attempts</div></div><div style="font-size:18px;font-weight:bold;color:#1A7A4A">${w.pct}%</div><span class="pill pg">On track</span></div>`).join('');}
    el.innerHTML=h;
  }catch(e){el.innerHTML=`<div class="page-title">Weak spots</div><div class="empty">Error: ${e.message}</div>`;}
}

async function init(){
  const session=loadSession();
  if(session?.email){
    try{
      const rows=await sbGet('users',`email=eq.${encodeURIComponent(session.email)}&select=*`);
      if(rows.length){
        const user=rows[0];
        S.user={email:user.email,name:user.name,role:user.role,school:user.school,id:user.id};
        S.role=user.role;
        enterApp();return;
      }
    }catch(e){console.warn('Session restore failed',e);}
  }
  renderAuthForm();show('s-home');
}
init();
