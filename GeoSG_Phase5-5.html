 core, where the process repeats. This continuous cycle of rising and sinking forms convection currents that act as the driving force of overlying tectonic plates. (1 mark)", "lo": false}, {"id": "Q4.1.d", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two landforms or features that result from divergent plate boundaries.", "src": null, "ans": "Mid-ocean ridges — underwater mountain ranges that form where two plates move apart and magma rises to fill the gap, creating new oceanic crust. (1 mark) Rift systems / rift valleys — formed on land where continental plates diverge, as the crust is stretched and pulled apart, creating a long, deep valley. Accept also: submarine volcanoes, volcanic islands, earthquakes. (1 mark)", "lo": false}, {"id": "Q4.1.e", "ao": "AO1", "marks": 3, "cmd": "Explain", "text": "Explain how magnetic striping provides evidence for the plate tectonic theory.", "src": null, "ans": "Basaltic rock that forms the oceanic crust is an iron-rich volcanic rock that contains magnetic minerals. When iron-rich lava erupts at mid-ocean ridges, cools and solidifies, its magnetic minerals align with the Earth's magnetic field at that time — recording the polarity of the Earth's magnetic field. (1 mark) As the Earth's magnetic field reverses periodically, alternating bands of rock with normal and reversed polarity are formed on either side of the mid-ocean ridge, creating a symmetrical zebra-like striped pattern. (1 mark) The fact that this symmetrical pattern is found on both sides of mid-ocean ridges worldwide shows that it is not a random or isolated occurrence — it provides clear evidence that new oceanic crust is continuously being formed at the ridges and pushed outward as plates move apart, supporting the plate tectonic theory. (1 mark)", "lo": false}, {"id": "Q4.1.f", "ao": "AO2", "marks": 3, "cmd": "Describe", "text": "Using Source A, describe the internal structure of the Earth and explain how conditions within the Earth drive tectonic plate movement.", "src": {"t": "note", "lbl": "Source A", "cap": "Earth's internal structure — layers, temperatures and thickness", "credit": "Adapted from Tectonic Textbook, Syllabus 2279", "info": "Lithosphere = crust + uppermost mantle (solid). Divided into tectonic plates. Asthenosphere = semi-solid layer below — convection currents here drive plate movement.", "text": "Lithosphere = crust + uppermost mantle (solid). Divided into tectonic plates. Asthenosphere = semi-solid layer below — convection currents here drive plate movement."}, "ans": "Source A shows that the Earth has a layered internal structure, with the innermost layer being the solid inner core at approximately 6,000°C, surrounded by a liquid outer core, then a thick semi-solid mantle (~2,900 km) at temperatures between 1,000°C and 3,700°C, and finally the thin outermost crust — either oceanic (6-11 km) or continental (35-70 km). The lithosphere — consisting of the crust and uppermost mantle — is divided into tectonic plates that move relative to one another. (1 mark) The extreme heat from the Earth's core described in Source A creates temperature differences within the mantle. These temperature differences cause convection currents — hot, less dense mantle material rises towards the surface, spreads beneath the plates and drags them apart, while cooler, denser material sinks back towards the core. These convection currents are the primary driving force of tectonic plate movement. (1 mark) Source A shows that oceanic crust (6-11 km) is much thinner and denser than continental crust (35-70 km). This density difference is critical for the slab-pull force — when oceanic and continental plates converge, the denser oceanic crust is pulled downward by gravity as it subducts beneath the less dense continental plate, dragging the rest of the oceanic plate with it and contributing to further plate movement. (1 mark)", "lo": false}, {"id": "Q4.1.g", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source B and your own knowledge, explain how the development of the plate tectonic theory illustrates how scientific understanding evolves through the accumulation of new evidence.", "src": {"t": "quote", "lbl": "Source B", "cap": "Development of the plate tectonic theory — from Wegener to modern acceptance", "credit": "Adapted from academic commentary on plate tectonics, 2022", "info": "", "text": "\"The plate tectonic theory was developed in the 1960s, but its origins have been traced to the ideas of Alfred Wegener who proposed in the 1910s that Earth's seven continents were once a single landmass, which he called Pangea. Wegener observed that the coastlines of South America and Africa appear to fit together like pieces of a jigsaw puzzle. He also noted that similar fossils of the same plants and animals were found on opposite sides of the Atlantic Ocean, and that identical rock formations were found on continents now separated by vast oceans. However, Wegener could not explain the mechanism by which continents moved, and his ideas were largely rejected by the scientific community during his lifetime. It was not until the 1960s, when oceanographers discovered seafloor spreading and m"}, "ans": "Source B shows that Wegener's original hypothesis of a single landmass (Pangea) was based on observational evidence — the jigsaw-like fit of continental coastlines, matching fossils on opposite sides of the Atlantic, and identical rock formations on now-separated continents. However, Source B explains that his ideas were 'largely rejected by the scientific community during his lifetime' because he could not explain the mechanism by which continents moved — demonstrating that scientific hypotheses require not only observational evidence but also a credible explanation of the processes involved. (1 mark) Source B explains that the breakthrough came in the 1960s when oceanographers discovered seafloor spreading and magnetic striping. Seafloor spreading showed that magma rising at mid-ocean ridges creates new oceanic crust that pushes existing plates apart — providing the mechanism of plate movement that Wegener's hypothesis had lacked. This demonstrates how scientific understanding evolves when new observations from different fields fill the explanatory gaps that prevent earlier hypotheses from being accepted. (1 mark) Magnetic striping provided additional independent evidence supporting plate movement — the symmetrical pattern of normal and reversed polarity bands on either side of mid-ocean ridges confirmed that new crust was continuously being created and pushed outward. The combination of seafloor spreading and magnetic striping evidence finally gave the scientific community sufficient confidence to accept the plate tectonic theory — illustrating how convergent evidence from multiple independent sources is required before scientific theories gain widespread acceptance. (1 mark) The evolution from Wegener's rejected hypothesis to the widely accepted plate tectonic theory also demonstrates that scientific understanding is a cumulative, self-correcting process. Wegener's initial observations were not wrong — they were simply incomplete. Each new piece of evidence added to and refined the theoretical framework, ultimately producing a comprehensive theory that unified explanations of earthquakes, volcanoes, mountain building and ocean formation. (1 mark)", "lo": false}, {"id": "Q4.1.h", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source C, explain how seafloor spreading provides evidence for the plate tectonic theory.", "src": {"t": "table", "lbl": "Source C", "cap": "Seafloor spreading — rock age and sediment evidence", "credit": "Adapted from Tectonic Textbook, Syllabus 2279", "info": "Process: At divergent plate boundary → plates move apart → magma rises through mid-ocean ridge → cools and solidifies → new oceanic crust formed → pushed outward in both directions as new magma rises behind it.", "hdr": ["Location relative to mid-ocean ridge", "Rock age", "Sediment thickness"], "rows": [["At the ridge crest (0 km)", "&lt;1 million years old", "Very thin (&lt;100 m)"], ["150 km from ridge", "~5 million years old", "Thin (~200 m)"], ["500 km from ridge", "~15 million years old", "Moderate (~500 m)"], ["1,500 km from ridge", "~50 million years old", "Thick (~1,000 m)"], ["Near subduction zone (3,000+ km)", "~100–150 million years old", "Thick — then destroyed"]]}, "ans": "Source C shows that at the mid-ocean ridge, magma rises from the mantle, cools and solidifies to form new oceanic crust, which is then pushed outward in both directions as new magma continues to rise. This process of seafloor spreading directly demonstrates that tectonic plates are moving apart — the continuous creation of new oceanic crust at the ridge pushes the existing plates progressively further away from the centre. (1 mark) The rock age data in Source C provides compelling supporting evidence — rocks within 50 km of the ridge are less than 1 million years old, while rocks more than 500 km away are over 10 million years old. This progressive age increase with distance from the ridge is exactly what the plate tectonic theory predicts: the oldest rocks are furthest from the ridge because they were formed first and have been pushed the greatest distance by subsequent seafloor spreading. (1 mark) Source C also shows that sediment accumulation is limited near the ridge but greater further away. This is consistent with the plate tectonic theory — older oceanic crust further from the ridge has had more time to accumulate sediment, while younger crust near the ridge has only recently been formed. Additionally, older oceanic crust is eventually destroyed at subduction zones, which explains why oceanic crust is always younger than continental crust — it is continuously being created at ridges and destroyed at trenches in a continuous cycle. (1 mark)", "lo": false}, {"id": "Q4.1.i", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source D and your own knowledge, explain how the age of rocks and sediment accumulation provide evidence for seafloor spreading and support the plate tectonic theory.", "src": {"t": "chart", "lbl": "Source D", "cap": "Rock age distribution from the Mid-Atlantic Ridge — seafloor spreading evidence", "credit": "Adapted from academic literature and Tectonic Textbook, Syllabus 2279", "info": "Symmetry: Rock age increases equally on BOTH sides of the ridge — confirming that plates move apart equally in both directions from the centre. This symmetry is the strongest evidence for seafloor spreading.", "chartCfg": "{\n  type:'line',\n  data:{\n    labels:distances.map(d=>d+'km'),\n    datasets:[\n      {label:'Left side of ridge',data:ages,borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0.08)',borderWidth:2,pointRadius:4,pointBackgroundColor:'#185FA5',pointBorderColor:'#fff',pointBorderWidth:1.5,tension:0.3,fill:true},\n      {label:'Right side of ridge',data:ages,borderColor:'#27500A',backgroundColor:'rgba(39,80,10,0.06)',borderWidth:2,borderDash:[5,3],pointRadius:4,pointBackgroundColor:'#27500A',pointBorderColor:'#fff',pointBorderWidth:1.5,tension:0.3,fill:false}\n    ]\n  },\n  options:{\n    responsive:true,maintainAspectRatio:false,\n    plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:14}},tooltip:{callbacks:{label:ctx=>ctx.parsed.y+' million years old'}}},\n    scales:{\n      x:{ticks:{autoSkip:false,font:{size:10},color:'#888780'},grid:{display:false},border:{display:false},title:{display:true,text:'Distance from mid-ocean ridge (km)',font:{size:11},color:'#888780'}},\n      y:{beginAtZero:true,max:150,ticks:{stepSize:25,font:{size:11},color:'#888780',callback:v=>v+'Ma'},grid:{color:'rgba(136,135,128,0.12)'},border:{display:false},title:{display:true,text:'Age of oceanic crust (million years)',font:{size:11},color:'#888780'}}\n    }\n  }\n}", "chartId": "chart_4_1_D_Q4.1.i"}, "ans": "Source D shows a clear and systematic relationship between distance from the mid-ocean ridge and the age of oceanic crust — rocks at the Mid-Atlantic Ridge crest are less than 1 million years old, increasing to ~5 million years at 150 km, ~15 million years at 500 km, ~50 million years at 1,500 km, and ~100-150 million years near subduction zones. This progressive age increase with distance directly supports seafloor spreading — new oceanic crust is continuously being created at the ridge and pushed progressively further away, so older crust is always found further from the ridge. (1 mark) The pattern in Source D is symmetrical — rocks at equal distances on opposite sides of the ridge are approximately the same age. This symmetry is exactly what seafloor spreading predicts: magma rises at the ridge, solidifies, and is pushed equally in both directions by new magma rising behind it. The symmetry cannot be explained by any mechanism other than continuous seafloor spreading, making it powerful evidence for the plate tectonic theory. (1 mark) Source D shows that sediment thickness also increases with distance from the ridge — from very thin (<100 m) at the crest to thick (~1,000 m) at 1,500 km from the ridge. This reflects the fact that older oceanic crust has had more time to accumulate sediment from the water above. Near the ridge, newly formed crust has barely had time to accumulate any sediment. This relationship between distance, age and sediment thickness provides independent supporting evidence that the oceanic crust is moving away from the ridge over time. (1 mark) Source D's final row shows that oceanic crust near subduction zones (~100-150 million years old) is eventually 'destroyed' as it is subducted beneath another plate. This explains why oceanic crust is always much younger than continental crust — the oldest oceanic crust is only ~150-200 million years old, while continental crust can be billions of years old. The continuous cycle of creation at mid-ocean ridges and destruction at subduction zones is the fundamental mechanism of seafloor spreading, and the age distribution shown in Source D is direct evidence that this cycle is actively occurring. (1 mark)", "lo": false}, {"id": "Q4.1.j", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source E and your own knowledge, explain how magnetic striping provides evidence for the plate tectonic theory.", "src": {"t": "quote", "lbl": "Source E", "cap": "Magnetic striping — how it forms and what it shows", "credit": "Adapted from Tectonic Textbook, Syllabus 2279", "info": "", "text": "\"When iron-rich basaltic lava erupts at mid-ocean ridges, it cools and solidifies. As it does so, the magnetic minerals within the basalt align with the direction of Earth's magnetic field at that time, permanently recording the polarity of Earth's magnetic field. Earth's magnetic field periodically reverses — approximately every 200,000 to 300,000 years. Each time the polarity reverses, newly formed oceanic crust records the new polarity direction. As plates continue to move apart, successive bands of rock with alternating normal and reversed polarity form on either side of the ridge. The resulting pattern — a symmetrical zebra-like striped pattern of alternating magnetic polarity — is found on both sides of mid-ocean ridges worldwide. This pattern is not random or isolated. It is strong "}, "ans": "Source E explains that basaltic rock forming the oceanic crust contains magnetic minerals that permanently record the direction of the Earth's magnetic field at the time they cool and solidify. Because the Earth's magnetic field periodically reverses approximately every 200,000-300,000 years, each new band of oceanic crust formed at the ridge records the polarity at the time of its formation. As plates move apart and new crust is continuously created, successive bands of rock with alternating normal and reversed polarity build up on either side of the ridge. (1 mark) Source E describes the resulting pattern as 'a symmetrical zebra-like striped pattern of alternating magnetic polarity' found on both sides of mid-ocean ridges. This symmetry is the most powerful evidence — bands of the same age and polarity are found at equal distances on either side of the ridge, confirming that new crust is being created at the ridge and pushed outward equally in both directions. If plates were not moving, no such symmetrical pattern would exist. (1 mark) Source E emphasises that the pattern 'is not random or isolated' — it is found 'on both sides of mid-ocean ridges worldwide.' The global consistency of the magnetic striping pattern means it cannot be explained by local geological processes — it can only be explained by the continuous global mechanism of seafloor spreading described by the plate tectonic theory. The worldwide occurrence of the symmetrical pattern therefore provides compelling, independent confirmation that tectonic plates are moving apart at divergent boundaries. (1 mark)", "lo": false}, {"id": "Q4.1.k", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source F and your own knowledge, explain how each feature of magnetic striping contributes to the evidence for the plate tectonic theory.", "src": {"t": "table", "lbl": "Source F", "cap": "Four features of magnetic striping and the evidence each provides", "credit": "Adapted from Tectonic Textbook, Syllabus 2279", "info": "", "hdr": ["Feature", "Evidence provided", "What it supports"], "rows": [["Rock composition Basalt contains magnetic minerals", "When iron-rich lava erupts, cools and solidifies, magnetic minerals align with Earth's magnetic field", "Oceanic crust records Earth's magnetic polarity at the time of formation"], ["Alternating polarity bands", "Earth's magnetic field reverses periodically; each reversal is recorded in newly formed crust", "New oceanic crust has been forming continuously over millions of years"], ["Symmetrical pattern Both sides of ridge", "Bands of same age and polarity found at equal distances either side of the ridge", "Plates are moving apart equally in both directions from the ridge"], ["Worldwide occurrence All mid-ocean ridges", "Not a random or isolated local occurrence — found at every mid-ocean ridge on Earth", "A single global mechanism — seafloor spreading — explains the pattern"]]}, "ans": "Source F shows that the first key feature — basalt containing magnetic minerals — establishes the fundamental mechanism of magnetic recording. When iron-rich basaltic lava erupts at mid-ocean ridges, its magnetic minerals align with the Earth's magnetic field as it cools and solidifies, permanently recording the polarity at that moment. This means that oceanic crust functions as a natural magnetic tape recorder, preserving a continuous record of both plate movement and changes in Earth's magnetic polarity over geological time. (1 mark) The second feature shown in Source F — alternating bands of normal and reversed polarity — demonstrates that oceanic crust has been forming continuously over millions of years. Each time Earth's magnetic field reverses, newly formed crust records the new polarity direction, creating a sequential record of polarity reversals moving progressively away from the ridge. The number and spacing of these bands can be used to calculate the rate at which plates are moving apart, providing quantitative evidence for plate movement. (1 mark) Source F highlights the symmetrical pattern on both sides of mid-ocean ridges as perhaps the most compelling evidence. Bands of the same age and polarity are found at equal distances on either side of the ridge, confirming that plates are moving apart equally in both directions — exactly as seafloor spreading predicts. This symmetry would be statistically impossible if the oceanic crust were not moving. (1 mark) The final feature in Source F — the worldwide occurrence of the magnetic striping pattern at all mid-ocean ridges — eliminates the possibility that the pattern is a local anomaly caused by regional geological processes. The global consistency of the pattern can only be explained by a single global mechanism acting identically at all divergent boundaries. This worldwide evidence transforms seafloor spreading from a local observation into a fundamental global process, providing the most robust possible support for the plate tectonic theory as a universal explanation of Earth's geological activity. (1 mark)", "lo": false}, {"id": "Q4.1.l", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source G, explain how the type of plate boundary determines the landforms and features produced.", "src": {"t": "table", "lbl": "Source G", "cap": "Types of plate boundaries — movement, landforms and examples", "credit": "Adapted from Tectonic Textbook, Syllabus 2279", "info": "", "hdr": ["Boundary type", "Plate movement", "Landforms produced", "Example"], "rows": [["Divergent", "Plates move away from each other", "Mid-ocean ridges · submarine volcanoes · volcanic islands · rift systems · earthquakes", "Mid-Atlantic Ridge; East African Rift Valley"], ["Convergent — oceanic-oceanic", "Two oceanic plates converge; denser subducts", "Oceanic trench · island arc volcanoes · earthquakes", "Mariana Trench; Japan island arc"], ["Convergent — oceanic-continental", "Oceanic subducts beneath continental", "Oceanic trench · fold mountains · volcanoes · earthquakes", "Andes Mountains; Cascades (USA)"], ["Convergent — continental-continental", "Two continental plates collide; neither subducts", "Fold mountains · earthquakes (NO volcanoes)", "Himalayas (India-Eurasia collision)"], ["Transform", "Plates slide past each other horizontally", "Faults · earthquakes (NO volcanoes, NO fold mountains)", "San Andreas Fault, California"]]}, "ans": "Source G shows that at divergent plate boundaries, where plates move apart, mid-ocean ridges form as magma rises to fill the gap created by the separating plates. On land, this produces rift valleys — such as the East African Rift Valley — where the continental crust is being pulled apart. The rising magma also creates submarine volcanoes and volcanic islands, and the movement of plates generates earthquakes. (1 mark) At convergent boundaries where oceanic crust is involved, Source G shows that the denser oceanic plate subducts beneath the less dense plate, forming a deep oceanic trench at the point of subduction. When two oceanic plates converge, the subducting plate melts in the mantle, and the magma rises to form a chain of island arc volcanoes parallel to the trench — as seen at Japan. When an oceanic plate subducts beneath a continental plate, fold mountains and coastal volcanoes form instead — as in the Andes of South America. (1 mark) Source G highlights an important exception — at continental-continental convergent boundaries, neither plate subducts because both are too buoyant. Instead, the crust is compressed and forced upward to form massive fold mountain ranges such as the Himalayas. Crucially, Source G notes there are 'no volcanoes' at this type of boundary — because neither plate subducts, no magma is generated. This demonstrates how the density of the colliding plates determines not just the scale but the type of landforms produced. (1 mark) At transform boundaries shown in Source G, plates slide horizontally past each other. This lateral movement produces faults and earthquakes as stress builds up and is suddenly released along the fault line. Source G notes there are no volcanoes and no fold mountains at transform boundaries — because no plate is subducting (no magma generation) and no compression is occurring (no crustal thickening). The San Andreas Fault in California regularly generates significant earthquakes from accumulated stress. (1 mark)", "lo": false}, {"id": "Q4.1.m", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source H and your own knowledge, explain the sequence of processes that occur at an oceanic-continental convergent plate boundary and the landforms they produce.", "src": {"t": "quote", "lbl": "Source H", "cap": "Oceanic-continental convergent boundary — processes and landforms", "credit": "Adapted from Tectonic Textbook, Syllabus 2279", "info": "", "text": "\"At oceanic-continental convergent boundaries, the denser oceanic plate is forced to subduct beneath the less dense continental plate. As the oceanic plate descends into the mantle, it carries with it water and other volatile substances absorbed from the ocean. The heat and pressure at depth cause the water to be released from the subducting plate into the overlying mantle. The addition of water lowers the melting point of the mantle rock above, causing it to melt and form magma. Being less dense than the surrounding rock, the magma rises through the overlying continental plate, erupting to form chains of volcanoes parallel to the subduction zone. The result is a characteristic combination of an oceanic trench (at the subduction zone), a chain of fold mountains, and a series of volcanic pe"}, "ans": "Source H describes the fundamental process at oceanic-continental convergent boundaries — the denser oceanic plate is forced beneath the less dense continental plate at a subduction zone. This density difference is the key driver: because oceanic crust is denser than continental crust, it cannot remain at the surface when the two plates converge, and gravity forces it downward into the mantle. The point where the oceanic plate begins to descend forms a deep oceanic trench — one of the deepest features on Earth's surface. (1 mark) Source H explains the mechanism of volcanic formation at these boundaries. As the oceanic plate descends, heat and pressure cause water and volatile substances absorbed from the ocean to be released into the overlying mantle. This addition of water lowers the melting point of the mantle rock, causing it to melt and generate magma. The magma is less dense than the surrounding rock, so it rises through the continental plate and erupts at the surface, forming a chain of volcanoes parallel to the subduction zone. (1 mark) Simultaneously, Source H explains that the compression of the two converging plates forces the continental crust to be folded and uplifted, creating fold mountains alongside the volcanic chain. The Andes Mountains provide the textbook example — formed by the subduction of the oceanic Nazca Plate beneath the continental South American Plate. This process demonstrates how a single convergent boundary can simultaneously produce multiple landforms through different mechanisms: the oceanic trench from subduction, the fold mountains from compression, and the Andean volcanic arc from magma generation. (1 mark) The process described in Source H also generates significant seismic activity. As the oceanic plate descends, friction between the subducting plate and the overlying continental plate builds up stress that is periodically released as earthquakes. These subduction-zone earthquakes can be extremely powerful — the 2010 Chile earthquake (Mw 8.8) and the 2011 Tohoku earthquake (Mw 9.0) were both generated at oceanic-continental convergent boundaries. (1 mark)", "lo": false}, {"id": "Q4.1.n", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source I and your own knowledge, explain how the similarities and differences between the three types of plate boundaries help geographers understand the global distribution of tectonic features.", "src": {"t": "table", "lbl": "Source I", "cap": "Comparison of three plate boundary types — features and tectonic activity", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and academic literature", "info": "", "hdr": ["Feature", "Divergent", "Convergent", "Transform"], "rows": [["Plate movement", "Apart", "Towards each other", "Sideways (past each other)"], ["Earthquakes?", "✓ Shallow", "✓ Shallow to deep", "✓ Shallow"], ["Volcanoes?", "✓ Yes", "✓ Yes (except continental-continental)", "✗ No"], ["Fold mountains?", "✗ No", "✓ Yes", "✗ No"], ["New crust created?", "✓ Yes — at mid-ocean ridges", "✗ No", "✗ No"], ["Crust destroyed?", "✗ No", "✓ Yes — at subduction zones", "✗ No"], ["Example", "Mid-Atlantic Ridge", "Mariana Trench; Himalayas", "San Andreas Fault"]]}, "ans": "Source I shows that earthquakes occur at all three types of plate boundaries — making earthquakes the most universally distributed tectonic feature. However, the depth of earthquakes varies significantly: at divergent and transform boundaries, earthquakes are shallow; at convergent boundaries with subduction, earthquakes can range from shallow to very deep (up to 700 km), as the subducting plate continues to generate seismic activity as it descends into the mantle. This depth variation helps geographers identify the type of plate boundary responsible for specific earthquake events. (1 mark) Source I highlights a key distinction — volcanoes only form where magma is generated: at divergent boundaries (decompression melting as plates separate) and at convergent boundaries where subduction occurs (water released from the subducting plate lowers the melting point of the mantle). Crucially, volcanoes do not form at transform boundaries or at continental-continental convergent boundaries. This explains why areas like the San Andreas Fault (transform) and the Himalayas (continental-continental convergent) experience earthquakes but no volcanic activity. (1 mark) Source I shows that new crust is only created at divergent boundaries and only destroyed at convergent boundaries. This creates a global balance — the Earth's total surface area remains roughly constant because the rate of crust creation at mid-ocean ridges is balanced by the rate of destruction at subduction zones. This balance is fundamental to understanding the global distribution of ocean basins (young oceanic crust spreading from mid-ocean ridges) and mountain chains (old oceanic crust being subducted, generating fold mountains along continental margins). (1 mark) Taken together, Source I's comparison allows geographers to map the expected distribution of tectonic features globally. The Pacific Ring of Fire corresponds to the convergent boundaries surrounding the Pacific Ocean, where multiple oceanic plates are subducting beneath continental plates. The Mid-Atlantic Ridge is a classic divergent boundary generating new oceanic crust. The San Andreas Fault represents a transform boundary producing shallow earthquakes without volcanic activity. Understanding which type of boundary exists at each location allows geographers to predict which combination of tectonic features and hazards can be expected. (1 mark)", "lo": false}, {"id": "Q4.1.o", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source J and your own knowledge, explain how the location and nature of plate boundaries determined the scale and type of the tectonic hazards experienced in Japan in 2011.", "src": {"t": "quote", "lbl": "Source J", "cap": "2011 Tohoku earthquake and tsunami, Japan — tectonic context and impacts", "credit": "Adapted from academic literature and case studies, 2022", "info": "", "text": "\"On 11 March 2011, the subduction of the Pacific Plate beneath the North American Plate generated a magnitude 9.0 earthquake approximately 70 km east of the Oshika Peninsula. Japan sits at the intersection of four major tectonic plates — the Pacific Plate, the Philippine Sea Plate, the North American Plate and the Eurasian Plate — making it one of the world's most seismically and volcanically active nations. The earthquake triggered a massive tsunami with waves reaching heights of up to 40 metres in some coastal areas, devastating the Tōhoku region. The disaster resulted in over 15,000 deaths, the displacement of approximately 340,000 people, and economic losses estimated at US$235 billion. The earthquake also triggered meltdowns at three of the six reactors at the Fukushima Daiichi Nuclea"}, "ans": "Source J explains that Japan sits at the intersection of four major tectonic plates — the Pacific, Philippine Sea, North American and Eurasian plates. This location at the convergence of multiple plate boundaries means Japan is simultaneously subject to the seismic and volcanic hazards generated by each of these boundaries. The subduction of both the Pacific and Philippine Sea Plates beneath Japan generates a particularly hazardous environment — multiple subduction zones surrounding Japan means the country faces a higher frequency and diversity of tectonic hazards than most nations on Earth. (1 mark) The magnitude 9.0 earthquake described in Source J was generated by the subduction of the Pacific Plate beneath the North American Plate at a convergent boundary — one of the most powerful types of tectonic event possible. At convergent boundaries with subduction, stress builds up as the descending oceanic plate and the overlying continental plate lock together; when the stress is suddenly released, the energy produces extremely powerful earthquakes. The scale of the 2011 earthquake (Mw 9.0) reflects the enormous area of the locked fault zone and the length of time stress had accumulated before the rupture. (1 mark) Source J highlights that the earthquake triggered a massive tsunami — one of the most devastating secondary hazards associated with subduction-zone earthquakes. When the fault rupture caused the seafloor to suddenly displace upward, the overlying column of ocean water was displaced, generating tsunami waves that reached heights of up to 40 metres. This demonstrates how the location of the earthquake approximately 70 km offshore — at the subduction zone — directly determined the type of secondary hazard: a seafloor earthquake generates tsunami; an inland earthquake of the same magnitude would not. (1 mark) Source J describes economic losses of US$235 billion and the displacement of approximately 340,000 people — a scale of impact reflecting not only the physical power of the hazard but Japan's high population density, extensive coastal infrastructure and advanced nuclear power infrastructure concentrated in a tectonically active zone. The Fukushima nuclear meltdown — triggered by the tsunami flooding the power plant's cooling systems — illustrates how tectonic hazards at plate boundaries can trigger cascading technological disasters, dramatically amplifying the total impact of a single seismic event. (1 mark) Japan's experience demonstrates a broader principle about the relationship between plate boundary location and disaster risk: countries positioned at convergent plate boundaries face multiple simultaneous hazard types — earthquakes, tsunamis, volcanic eruptions and their secondary effects — and the interaction between these hazards can be more devastating than any single hazard alone. Despite Japan's world-leading investment in earthquake-resistant construction and early warning systems, the scale of the 2011 disaster shows that the combination of a massive subduction-zone earthquake and the cascading tsunami remains one of the greatest natural hazard challenges that plate boundary communities face. (1 mark)", "lo": false}, {"id": "Q4.1.p", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source K and your own knowledge, to what extent do you agree that the plate tectonic theory is a complete and fully effective explanation of tectonic phenomena? Explain your answer.", "src": {"t": "quote", "lbl": "Source K", "cap": "Commentary on the plate tectonic theory — strengths and limitations", "credit": "Adapted from academic commentary on plate tectonics, 2022", "info": "Key claims: Plate tectonic theory is a major unifying achievement — it explains earthquakes, volcanoes, mountain ranges and ocean trenches under one framework. | Key limitation: the theory explains WHERE tectonic activity occurs but cannot predict WHEN specific earthquakes will happen. | Short-term earthquake prediction remains beyond the reach of science despite decades of monitoring — even for Japan's world-leading seismic network. Consider: Is spatial explanation (where) sufficient to make th", "text": "The plate tectonic theory is one of the most successful unifying theories in the history of science. Before its development, earthquakes, volcanoes, mountain ranges and ocean trenches were studied as separate, unrelated phenomena. The plate tectonic theory brought them all under a single explanatory framework — showing that they are all expressions of the same underlying process: the movement of tectonic plates driven by convection currents and slab-pull forces within the Earth. However, the theory is not without its limitations. It explains where tectonic activity occurs but is less successful at predicting when specific earthquakes or eruptions will happen. Despite decades of monitoring and research, reliable short-term earthquake prediction remains beyond the reach of science. The plate"}, "ans": "Agree — the theory provides a powerful, comprehensive explanatory framework: Source K correctly identifies the plate tectonic theory's greatest achievement — it unified previously disconnected explanations of earthquakes, volcanoes, mountain ranges and ocean trenches under a single framework, showing that all are expressions of the movement of tectonic plates. The theory is supported by multiple independent lines of evidence — seafloor spreading (progressive age increase of oceanic crust with distance from mid-ocean ridges), magnetic striping (symmetrical zebra-like pattern of alternating polarity on either side of ridges), and the global distribution of earthquakes and volcanoes along plate boundaries. The theory correctly predicts the types of tectonic features found at each type of boundary — volcanoes at divergent and subduction-zone convergent boundaries, fold mountains at continental-continental convergent boundaries, faults and shallow earthquakes at transform boundaries — giving geographers a powerful tool for understanding the spatial distribution of tectonic hazards globally. Partially disagree — Source K correctly identifies the predictive limitation: However, Source K identifies a fundamental limitation: the theory explains where tectonic activity occurs but cannot predict when specific events will happen. The 2011 Tohoku earthquake (Mw 9.0) was not predicted despite Japan's extensive seismic monitoring network and world-leading tectonic research — illustrating that even the most seismically monitored nation on Earth cannot translate the plate tectonic theory's spatial explanations into reliable short-term temporal predictions. This limitation has enormous practical implications for disaster risk management. Conclusion: On balance, I agree that the plate tectonic theory is highly effective as a spatial explanatory framework — it represents one of science's greatest achievements in unifying diverse phenomena. However, it is not 'complete' in the sense of being a fully predictive theory: its explanatory power is spatial rather than temporal. For geographers, its value lies in identifying hazard-prone regions and understanding the processes that generate specific hazard types — a foundation for effective long-term disaster risk management even in the absence of reliable short-term earthquake prediction.", "lo": true}, {"id": "Q4.1.q", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Seafloor spreading provides stronger evidence for the plate tectonic theory than magnetic striping.\" Do you agree with this statement? Explain your answer.", "src": null, "ans": "Partially agree — seafloor spreading provides direct, quantifiable evidence: Source L shows that seafloor spreading provides two distinct, independently verifiable lines of evidence. The rock age evidence — youngest rocks at the ridge crest increasing systematically in age with distance — can be directly measured using radiometric dating and provides quantifiable data on the rate of plate movement. The Mid-Atlantic Ridge, for example, is spreading at approximately 2.5 cm per year — a rate that can be calculated from the age-distance relationship. This quantitative precision makes seafloor spreading particularly compelling: it is not merely qualitative evidence that plates move, but a measurable demonstration of exactly how fast they are moving. Partially disagree — magnetic striping provides equally powerful independent confirmation: However, Source L shows that magnetic striping provides an entirely independent line of evidence that reaches the same conclusion by a completely different mechanism. The symmetrical zebra-like pattern of alternating normal and reversed polarity on both sides of ALL mid-ocean ridges worldwide — described in Source L as a pattern 'only explicable by continuous seafloor spreading' — is perhaps the most striking single piece of evidence for plate tectonics. The global consistency of the pattern is particularly important: the same symmetrical striping is found at every mid-ocean ridge on Earth, making it impossible to explain by any local geological process. Disagree — the two lines of evidence are complementary and mutually reinforcing: The more important point is that the question of which provides 'stronger' evidence misunderstands how scientific evidence works. Neither seafloor spreading nor magnetic striping is stronger in isolation — each is more powerful because the other exists. The rock age evidence tells us that crust is older further from the ridge; the magnetic striping tells us that crust was being created continuously as Earth's polarity reversed; together they provide a chronological and spatial record of plate movement that neither could provide alone. Nuanced evaluation — historical significance of magnetic striping: It is worth noting that in terms of historical impact on scientific acceptance, magnetic striping may have been more significant. Its striking symmetrical visual pattern made the evidence immediately compelling to sceptical scientists in a way that age-distance data alone did not. Source B noted that the plate tectonic theory gained 'widespread acceptance' when oceanographers discovered seafloor spreading and magnetic striping together — suggesting that it was the combination, not either evidence alone, that was decisive. Conclusion: On balance, I do not agree that seafloor spreading provides stronger evidence than magnetic striping — both are essential, complementary lines of evidence that together provide a powerful, mutually reinforcing case for the plate tectonic theory. Science advances most convincingly when multiple independent lines of evidence converge on the same conclusion — and it is the convergence of seafloor spreading and magnetic striping evidence that makes the plate tectonic theory one of the strongest theories in Earth science.", "lo": true}, {"id": "Q4.1.r", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Convergent plate boundaries produce more significant tectonic features and hazards than divergent or transform plate boundaries.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — convergent boundaries produce the greatest variety and scale of tectonic features: Convergent plate boundaries produce the widest range and most dramatic tectonic features of any boundary type. At subduction zones, the combination of features is unmatched: deep oceanic trenches (the Mariana Trench, the deepest point on Earth at ~11,000 m), chains of explosive volcanoes, fold mountain ranges and devastating earthquakes all occur simultaneously. The Andes Mountains — fold mountains formed by subduction of the Nazca Plate beneath the South American Plate — are among the world's most extensive mountain ranges. Japan's volcanic arc, formed by subduction of the Pacific and Philippine Sea Plates, contains over 100 active volcanoes. At continental-continental convergent boundaries, the collision of the Indian and Eurasian plates produced the Himalayas — the world's highest mountain range, with peaks exceeding 8,800 m. Agree — convergent boundaries produce the most hazardous tectonic events: The most devastating tectonic disasters in recorded history have occurred at convergent boundaries. The 2011 Tohoku earthquake (Mw 9.0, Japan), the 2004 Indian Ocean earthquake and tsunami (Mw 9.1), and the 2010 Chile earthquake (Mw 8.8) are among the most powerful earthquakes ever recorded, all generated at convergent subduction zones. Subduction-zone earthquakes generate tsunamis — a secondary hazard that dramatically amplifies the death toll and economic damage. The 2004 Indian Ocean tsunami killed over 230,000 people across 14 countries. Partially disagree — divergent boundaries produce globally significant features: However, divergent boundaries also produce features of global significance. The Mid-Atlantic Ridge is the longest mountain range on Earth (approximately 16,000 km) — far exceeding any convergent boundary mountain range in linear extent. The East African Rift Valley represents an active divergent boundary on land that is reshaping the African continent. Iceland — a volcanic island built entirely by divergent plate activity at the Mid-Atlantic Ridge — demonstrates that divergent boundaries can produce substantial volcanic activity. The 2010 Eyjafjallajokull eruption disrupted aviation across Europe for weeks, demonstrating the wide-reaching economic impact of divergent boundary volcanism. Partially disagree — transform boundaries produce highly hazardous events: Transform boundaries, while producing fewer landform types, generate shallow earthquakes that can be extremely destructive due to their proximity to the surface. The 1906 San Francisco earthquake (transform boundary, San Andreas Fault) and the 1999 Izmit earthquake in Turkey (North Anatolian Fault — a transform boundary) demonstrate that transform boundary earthquakes can cause catastrophic urban destruction. Conclusion: On balance, I agree that convergent plate boundaries produce the most significant tectonic features and hazards overall — they generate the greatest diversity of features, the most powerful earthquake events and the most devastating secondary hazards. However, the statement overstates the case by implying that divergent and transform boundaries are unimportant. The Mid-Atlantic Ridge is Earth's longest mountain range; San Andreas Fault earthquakes are capable of devastating major cities; Iceland's volcanism has global economic consequences. Tectonic significance is not the exclusive property of convergent boundaries — it is distributed, with different intensities and types, across all three boundary types.", "lo": true}, {"id": "Q4.1.s", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source M and your own knowledge, to what extent do you agree that an understanding of plate tectonics is essential for effective hazard management? Explain your answer.", "src": {"t": "quote", "lbl": "Source M", "cap": "Commentary by a geoscientist on plate tectonics and hazard management", "credit": "Adapted from a geoscientist's commentary on plate tectonics and hazard management, 2022", "info": "Key claims: Plate tectonic theory is the scientific foundation for ALL natural hazard management tools — early warning systems, building codes, evacuation plans, monitoring networks. | Without plate tectonics, there would be no scientific basis for identifying at-risk communities or prioritising hazard preparedness investment. | The theory's spatial explanatory power (\"where to prepare\") is \"the most important knowledge of all\" — even without temporal predictive power (\"when\"). Consider: Is Sour", "text": "Understanding plate tectonics is not merely an academic exercise — it is the foundation of everything we do in natural hazard management. Every earthquake early warning system, every building code for earthquake-resistant construction, every tsunami evacuation plan, every volcanic monitoring network is built on the knowledge that tectonic plates move, and that the hazards they generate follow predictable spatial patterns. Without the plate tectonic theory, we would have no scientific basis for knowing which communities are at risk, which coastlines need tsunami barriers, or which cities need reinforced buildings. The theory does not tell us when the next earthquake will strike — but it tells us where to prepare, and that is the most important knowledge of all.\" Geoscientist Commentary on p"}, "ans": "Agree — plate tectonics provides the spatial foundation for all hazard preparedness: Source M makes a compelling case that the plate tectonic theory is the essential scientific foundation for natural hazard management. Every major hazard management tool — building codes, early warning systems, tsunami evacuation plans, volcanic monitoring networks — depends on knowing where tectonic hazards can be expected. Without understanding that Japan sits at the convergence of four major tectonic plates at subduction zones, there would be no scientific basis for Japan's extraordinary investment in earthquake-resistant construction. Without understanding that the Pacific Ring of Fire marks a belt of convergent boundaries, there would be no scientific rationale for concentrating tsunami warning networks around the Pacific Ocean. The theory's power to explain the spatial distribution of hazards — even without predicting their timing — is, as Source M argues, 'the most important knowledge of all' for hazard preparedness. Partially disagree — plate tectonics is necessary but not sufficient for effective hazard management: However, Source M's argument, while compelling, overstates the case slightly. Understanding plate tectonics tells communities where to prepare — but effective hazard management also requires economic resources to implement preparedness measures, political will to enforce building codes, and community capacity to conduct evacuation drills. Bangladesh lies along a plate boundary and faces significant earthquake risk, but as a developing country with limited financial resources, only 21% of buildings in Dhaka are earthquake-resistant — not because of ignorance of plate tectonics, but because of resource constraints. This demonstrates that tectonic knowledge alone is insufficient — it must be accompanied by the institutional, financial and political capacity to act on that knowledge. Conclusion: On balance, I strongly agree with Source M that understanding plate tectonics is essential for effective hazard management — it provides the irreplaceable spatial framework that identifies at-risk communities and guides the design of all preparedness systems. Without it, hazard management would be reactive rather than proactive. However, tectonic knowledge is the necessary starting point, not the complete solution — translating that knowledge into effective protection requires the additional resources, governance capacity and community resilience that determine whether at-risk communities can actually act on what the plate tectonic theory tells them.", "lo": true}, {"id": "Q4.1.t", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"The location of a community at a plate boundary is the most important factor determining its risk from tectonic hazards.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — plate boundary location determines exposure to tectonic hazards: Location at a plate boundary is unquestionably a fundamental determinant of tectonic hazard risk — it determines a community's exposure, one of the three key components of disaster risk (alongside hazard and vulnerability). Communities located at convergent boundaries — such as those around the Pacific Ring of Fire — face the full spectrum of tectonic hazards: powerful subduction-zone earthquakes, volcanic eruptions, tsunamis and landslides. Japan, positioned at the convergence of four major tectonic plates, experiences approximately 1,500 earthquakes per year and is home to over 100 active volcanoes. Communities far from plate boundaries — such as those in the interior of stable continental cratons — face virtually no risk from primary tectonic hazards. Partially disagree — hazard type and magnitude vary significantly between boundary types: However, not all plate boundary locations carry equal risk. Transform boundaries (such as the San Andreas Fault) generate shallow earthquakes but no tsunamis and no volcanic eruptions — a significantly different risk profile from subduction zones. Continental-continental convergent boundaries generate earthquakes and fold mountains but no volcanoes. Hot spot volcanoes — such as those in Hawaii — occur far from plate boundaries, demonstrating that tectonic hazard risk is not exclusively confined to boundary locations. Partially disagree — vulnerability is equally or more important in determining actual disaster risk: The disaster risk equation — risk = hazard x vulnerability x exposure — makes clear that location (which determines exposure) is only one of three factors. Vulnerability — the susceptibility of people and their properties to the impacts of hazards — can be more decisive than location in determining actual disaster outcomes. The 2010 Haiti earthquake (Mw 7.0) killed over 230,000 people; the 2011 Christchurch earthquake (Mw 6.3) in New Zealand killed 185 people. Both occurred at plate boundaries, both were significant earthquakes — but the difference in death toll reflects vastly different vulnerability levels. Haiti's poor building quality, inadequate healthcare infrastructure and limited emergency response capacity transformed a moderate earthquake into a catastrophic disaster. New Zealand's earthquake-resistant building codes and well-funded emergency services meant a similar-scale earthquake caused a fraction of the casualties. Nuanced evaluation — economic development mediates the impact of location: This comparison reveals that economic development — which determines the resources available for hazard-resistant construction, monitoring systems and emergency response — is a critical mediating variable between plate boundary location and actual disaster risk. Japan and Chile are both located at highly active subduction zones yet have relatively low per-capita death rates from earthquakes compared to developing countries at similar boundaries. Conclusion: On balance, I partially agree that location at a plate boundary is the most important single factor determining tectonic hazard risk — it creates the fundamental condition of exposure without which tectonic disaster risk cannot exist. However, it is not sufficient to determine actual disaster risk. The 2010 Haiti vs 2011 Christchurch comparison demonstrates that two communities at plate boundaries can experience radically different disaster outcomes from similar hazard events depending on their vulnerability. Effective disaster risk management must therefore address both dimensions: understanding the spatial distribution of hazards through plate tectonic theory, and systematically reducing community vulnerability through hazard-resistant construction, early warning systems and community preparedness.", "lo": true}], "4.2": [{"id": "Q4.2.a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by the \"focus\" of an earthquake?", "src": null, "ans": "The focus is the point in the Earth's crust where seismic waves are released — it is the origin point of the earthquake from which energy radiates outward in all directions. (1 mark)", "lo": false}, {"id": "Q4.2.b", "ao": "AO1", "marks": 1, "cmd": "State", "text": "State the difference between the Richter Scale and the Moment Magnitude Scale.", "src": null, "ans": "The Richter Scale measures the local magnitude of earthquakes based on the height of the largest seismic wave recorded, whereas the Moment Magnitude Scale measures earthquakes based on the total energy released throughout the entire earthquake, making it more accurate for measuring larger earthquakes. (1 mark)", "lo": false}, {"id": "Q4.2.c", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two differences between a stratovolcano and a shield volcano.", "src": null, "ans": "Stratovolcanoes are steep and conical in shape with highly viscous magma that traps dissolved gases, resulting in violent, explosive eruptions; shield volcanoes are broad and dome-shaped with less viscous magma that allows dissolved gases to escape easily, resulting in gentle, effusive eruptions. (1 mark) Stratovolcanoes are generally associated with high-silica magma at convergent plate boundaries, whereas shield volcanoes are associated with low-silica magma and are typically found at divergent boundaries and hot spots such as Hawaii. (1 mark)", "lo": false}, {"id": "Q4.2.d", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two hazards associated with volcanic eruptions.", "src": null, "ans": "Pyroclastic flows — extremely fast-moving hot mixtures of rock fragments, gas and ash that travel rapidly down the slopes of a volcano, destroying everything in their path. (1 mark) Lahars — volcanic mudflows consisting of a mixture of water and volcanic debris that move rapidly downstream, burying settlements and infrastructure. Accept also: tephra, volcanic gases, lava flows, volcanic landslides. (1 mark)", "lo": false}, {"id": "Q4.2.e", "ao": "AO1", "marks": 3, "cmd": "State", "text": "State three benefits of living near a volcano.", "src": null, "ans": "Fertile soil for farming — volcanic materials break down and weather over time to produce extremely fertile soils, supporting high agricultural yields. (1 mark) Geothermal energy — energy harnessed from the Earth's natural heat associated with active or geologically young inactive volcanoes can be used to generate electricity and heat homes, providing a renewable energy source. (1 mark) Tourism activities — volcanic landscapes, including craters, lava flows and hot springs, attract large numbers of tourists, generating income and employment for local communities. (1 mark)", "lo": false}, {"id": "Q4.2.f", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source A, explain how tectonic processes cause earthquakes and how the location of the focus affects the experience of ground shaking.", "src": {"t": "note", "lbl": "Source A", "cap": "How tectonic processes cause earthquakes — the four-stage process", "credit": "Adapted from Tectonic Textbook, Syllabus 2279", "info": "", "text": "How tectonic processes cause earthquakes — the four-stage process"}, "ans": "Source A explains that earthquakes occur when rock masses on either side of a fault are pushed by tectonic forces, causing friction that locks the rocks together and builds up stress. When the accumulated stress exceeds the strength of the fault or surrounding rock, the rocks suddenly snap or move to a new position — releasing energy in the form of seismic waves that radiate outward from the focus, causing the ground shaking experienced as an earthquake. (1 mark) Source A identifies the focus as the point in the Earth's crust where seismic waves are released — the origin of the earthquake. The depth of the focus is significant: shallow-focus earthquakes (where the focus is close to the Earth's surface) tend to cause more intense ground shaking at the surface than deep-focus earthquakes of the same energy release, because the seismic energy travels a shorter distance before reaching the surface and has less time to dissipate. (1 mark) Source A explains that the epicentre — the point on the Earth's surface directly above the focus — is where ground shaking is generally felt most strongly. Seismic waves travel upward from the focus to the epicentre through the shortest possible path, arriving with greater intensity than at locations further from the epicentre where the waves have travelled further and lost more energy. This explains why communities closest to the epicentre typically suffer the greatest damage in an earthquake. (1 mark)", "lo": false}, {"id": "Q4.2.g", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source B and your own knowledge, explain why the Moment Magnitude Scale is more accurate than the Richter Scale for measuring large earthquakes, and assess the importance of accurate earthquake measurement.", "src": {"t": "table", "lbl": "Source B", "cap": "Richter Scale vs Moment Magnitude Scale — comparison", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and USGS data", "info": "Key example: 1964 Prince William Sound earthquake, Alaska — initially rated 8.6 (Richter) → later adjusted to Mw 9.2 when total energy properly calculated. A difference of 0.6 on a logarithmic scale = approximately 12 times more energy.", "hdr": ["Feature", "Richter Scale (ML)", "Moment Magnitude Scale (Mw)"], "rows": [["Basis", "Height of the largest seismic wave recorded", "Total energy released throughout the entire earthquake"], ["Strength", "Simple to calculate; well-established historical record", "More accurate especially for magnitude 8+; considers total seismic energy"], ["Limitation", "Underestimates long earthquakes; a single large wave scores higher than sustained energy release", "More complex to calculate"], ["Best used for", "Small, local earthquakes (&lt;magnitude 7)", "Large earthquakes globally — now the standard"], ["Scale type", "Both are logarithmic — magnitude 6 releases ~32 times more energy than magnitude 5"]]}, "ans": "Source B explains that the Richter Scale calculates earthquake magnitude based on the height of the largest seismic wave recorded on a seismometer. The fundamental limitation is that it measures maximum seismic intensity rather than total seismic energy — meaning it rates an earthquake with a single dramatic spike in wave energy as having higher magnitude than a longer earthquake with many large, sustained waves. This underestimates the magnitude of long-duration earthquakes that release more total energy and are likely to cause more damage overall. (1 mark) The Moment Magnitude Scale overcomes this limitation by measuring the total energy released throughout the entire earthquake — not just the peak wave height. As Source B shows, this makes it significantly more accurate for large earthquakes, particularly those of magnitude 8 and above. The 1964 Prince William Sound earthquake demonstrates this concretely: initially rated 8.6 on the Richter Scale, it was later adjusted to Mw 9.2 when the total energy was properly calculated — a difference of 0.6 on a logarithmic scale that represents approximately 12 times more energy. (1 mark) Both scales are logarithmic — each step represents approximately 32 times more energy released. The difference between a Mw 8.6 and a Mw 9.2 earthquake is not a marginal measurement error but a fundamental underestimation of the event's energy. Underestimating the magnitude of large earthquakes has serious practical consequences: if engineers design buildings and infrastructure to withstand Mw 8.6 rather than Mw 9.2, the structures may be significantly under-engineered for the actual forces they need to withstand. (1 mark) Accurate earthquake measurement using the Moment Magnitude Scale is essential for effective disaster risk management. Precise magnitude data enables seismologists to assess the likelihood of tsunamis — particularly important for subduction-zone earthquakes where the seafloor displacement that generates tsunamis is proportional to the total energy released, not just the peak wave height. The 2004 Indian Ocean earthquake and the 2011 Tohoku earthquake demonstrate how measurement accuracy can have life-or-death significance for communities downrange of a tsunami-generating earthquake. (1 mark)", "lo": false}, {"id": "Q4.2.h", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source C, explain why some volcanic eruptions are more explosive than others and what determines the magnitude of a volcanic eruption.", "src": {"t": "note", "lbl": "Source C", "cap": "High-silica vs low-silica magma — why some eruptions are more explosive", "credit": "Adapted from Tectonic Textbook, Syllabus 2279", "info": "Key principle: The magnitude of a volcanic eruption is determined by how easily dissolved gases can escape from the magma. High viscosity → gases trapped → explosive eruption. Low viscosity → gases escape → gentle effusive eruption. Exception: Mount Merapi (a stratovolcano) had a non-explosive erupt", "text": "Key principle: The magnitude of a volcanic eruption is determined by how easily dissolved gases can escape from the magma. High viscosity → gases trapped → explosive eruption. Low viscosity → gases escape → gentle effusive eruption. Exception: Mount Merapi (a stratovolcano) had a non-explosive erupt"}, "ans": "Source C shows that the explosivity of a volcanic eruption is fundamentally determined by the viscosity of the magma and how easily dissolved gases can escape from it. High-silica magma associated with stratovolcanoes is highly viscous — it resists flowing. As this magma rises towards the Earth's surface, the dissolved gases within it cannot escape easily because the thick, sticky magma traps them. Pressure therefore builds up continuously until the gases escape explosively, resulting in violent eruptions. (1 mark) In contrast, Source C shows that low-silica magma associated with shield volcanoes is much less viscous and flows easily. As this magma rises, dissolved gases can escape gradually and easily from the less resistant magma. Much less pressure therefore builds up, and the magma reaches the surface in gentle, effusive eruptions that produce primarily lava flows. The ongoing effusive eruption of Kilauea in Hawaii compared to the catastrophic VEI 6 explosion of Mount Pinatubo in 1991 illustrates this contrast dramatically. (1 mark) Source C demonstrates that the magnitude of a volcanic eruption is therefore determined by a combination of the amount of dissolved gases in the magma and its viscosity — these two factors together control the rate at which pressure can build up and the force with which that pressure is released. The Volcanic Explosivity Index (VEI) captures this by considering the volume of ejected materials, the height of the eruption cloud and the duration of the eruption — together providing a comprehensive measure of eruptive magnitude. (1 mark)", "lo": false}, {"id": "Q4.2.i", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source D and your own knowledge, explain how the Volcanic Explosivity Index measures volcanic eruptions and assess its usefulness for understanding the impacts of volcanic hazards.", "src": {"t": "note", "lbl": "Source D", "cap": "Volcanic Explosivity Index (VEI) — scale, criteria and examples", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and academic literature", "info": "VEI criteria: Volume of ejected material + height of eruption cloud + duration of eruption. A VEI 8 eruption is 10 million times more powerful than a VEI 1 eruption.", "text": "VEI criteria: Volume of ejected material + height of eruption cloud + duration of eruption. A VEI 8 eruption is 10 million times more powerful than a VEI 1 eruption."}, "ans": "Source D explains that the VEI measures volcanic eruptions on a logarithmic scale of 0 to 8 using three criteria: the volume of ejected material, the height of the eruption cloud, and the duration of the eruption. As a logarithmic scale, each step of 1 on the VEI indicates an eruption 10 times more powerful than the previous number — meaning a VEI 8 eruption is 10 million times more powerful than a VEI 1 eruption. This logarithmic structure allows the scale to encompass the enormous range of volcanic activity from Kilauea's gentle effusive flows to mega-colossal supereruptions like Toba within a single manageable numerical framework. (1 mark) Source D provides the Toba supereruption as a compelling example of the VEI's upper end — a VEI 8 event that ejected approximately 2,800 km3 of material 74,000 years ago, covering India and parts of Southeast Asia in over 15 cm of ash. The scale of this eruption demonstrates how the VEI's multi-criteria approach captures the total hazard footprint of an eruption — not just the energy at the vent but the area and depth of ash deposition, which may be the most significant impact for human and natural systems far from the volcano itself. (1 mark) The VEI is useful for understanding volcanic hazard impacts because it allows comparison across different eruptions at different times and places — enabling scientists and emergency managers to understand the likely range of hazards from any given volcano by examining its eruption history. A volcano with a history of VEI 4-5 eruptions can be expected to produce pyroclastic flows, significant ash falls and lahars; a VEI 7-8 eruption history signals the potential for climate-affecting supereruptions. (1 mark) However, the VEI has limitations as a tool for understanding volcanic hazard impacts. It measures explosivity but not the specific types of hazard generated — two eruptions with the same VEI can have very different impact profiles depending on the direction of pyroclastic flows, prevailing wind patterns, proximity of water bodies generating lahars, and population density. The VEI also does not measure volcanic gas emissions, which can cause significant health impacts and acid rain far beyond the physical reach of tephra or lava. (1 mark)", "lo": false}, {"id": "Q4.2.j", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source E, explain the distribution of earthquakes and volcanoes and how tectonic hazards can affect areas beyond plate boundaries.", "src": {"t": "table", "lbl": "Source E", "cap": "Distribution of earthquakes, volcanoes and tectonic hazards", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and USGS data", "info": "", "hdr": ["Feature", "Distribution pattern", "Reason", "Example"], "rows": [["Earthquakes", "Along ALL plate boundaries; largest concentration at Pacific Ring of Fire", "At all boundaries, plates interact creating stress that is released as earthquakes; subduction zones generate highest stress", "San Andreas Fault (transform); Mid-Atlantic Ridge (divergent); Cascadia subduction zone (convergent)"], ["Volcanoes", "Near convergent and divergent plate boundaries; NOT at transform or continental-continental convergent", "At convergent subduction zones: water lowers mantle melting point → magma rises. At divergent: decompression melting", "Pacific Ring of Fire; Mid-Atlantic Ridge volcanoes (Iceland)"], ["Hot spot volcanoes", "Away from plate boundaries", "Extra-hot regions in the mantle (mantle plumes) generate magma independently of plate boundaries", "Hawaii (Pacific Plate) — Kilauea"], ["Tsunamis", "Generated near earthquake epicentres but travel thousands of km across ocean basins", "Seafloor displacement during large earthquakes creates ocean waves that maintain energy across deep ocean basins", "2004 Indian Ocean tsunami reached 14 countries from Sumatra epicentre"], ["Volcanic ash", "Ejected near volcanoes but carried far beyond eruption site by wind", "Fine ash particles are light enough to be transported by upper atmosphere winds across continents", "1991 Pinatubo ash covered SE Asia; Toba ash covered India"]]}, "ans": "Source E shows that earthquakes occur along all types of plate boundaries — convergent, divergent and transform — because tectonic forces at all boundaries create stress in the Earth's crust that is periodically released as earthquakes. The Pacific Ring of Fire has the largest concentration of earthquakes because it is surrounded by multiple convergent subduction zones where the highest stress levels build up as oceanic plates are forced beneath continental plates. (1 mark) Source E demonstrates that volcanoes have a more restricted distribution than earthquakes — they occur near convergent and divergent plate boundaries but not at transform or continental-continental convergent boundaries. At convergent subduction zones, water released from the descending plate lowers the melting point of the overlying mantle, generating magma. At divergent boundaries, decompression melting as plates move apart generates magma. Source E also identifies hot spot volcanoes — such as Hawaii — as exceptions that form away from plate boundaries over extra-hot regions in the mantle. (1 mark) Source E critically shows that tectonic hazards can extend far beyond their plate boundary origin through secondary effects. Tsunamis travel at up to 800 km/h in deep water — the 2004 Indian Ocean tsunami reached 14 countries from the Sumatra epicentre. Volcanic ash, being light enough to be carried by upper atmosphere winds, can also spread far beyond the eruption site — the Toba supereruption covered India despite the volcano being located in Sumatra. This means communities far from plate boundaries can still be severely affected by secondary tectonic hazards. (1 mark)", "lo": false}, {"id": "Q4.2.k", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source F and your own knowledge, explain how the distribution of tectonic activity led to the 2004 Indian Ocean tsunami affecting countries across such a wide geographic area.", "src": {"t": "quote", "lbl": "Source F", "cap": "2004 Indian Ocean earthquake and tsunami — tectonic context and geographic spread", "credit": "Adapted from case study of the 2004 Indian Ocean tsunami and media reports", "info": "", "text": "\"On 26 December 2004, a magnitude 9.1 earthquake struck off the northwest coast of Sumatra, caused by the subduction of the Indian Plate beneath the Burma Plate. The sudden displacement of the seafloor along approximately 1,200 km of the fault line generated tsunami waves that spread across the Indian Ocean at speeds of up to 800 km/h. Within 15 minutes, the waves reached the coasts of Banda Aceh with heights of up to 30 metres. Within two hours, they struck Thailand and India. Within seven hours, they reached the eastern coast of Africa — over 5,000 km from the epicentre. The disaster killed over 230,000 people across 14 countries, making it one of the deadliest natural disasters in recorded history.\""}, "ans": "Source F explains that the 2004 Indian Ocean earthquake was generated by the subduction of the Indian Plate beneath the Burma Plate at a convergent boundary off the northwest coast of Sumatra. The magnitude 9.1 earthquake released enormous energy that suddenly displaced approximately 1,200 km of seafloor along the fault line. This seafloor displacement — the direct result of plate boundary tectonic activity — generated the tsunami waves that then spread across the entire Indian Ocean. (1 mark) Source F demonstrates how the geography of the Indian Ocean basin amplified the spatial reach of the hazard. Tsunami waves travel at up to 800 km/h in deep water — comparable to a passenger jet aircraft. The 7 hours required to cross the 5,000 km to reach the east coast of Africa was entirely feasible at this speed. Unlike earthquakes, whose intensity diminishes rapidly with distance from the epicentre, tsunamis maintain much of their energy across ocean basins because there is little resistance in deep water. (1 mark) Source F shows that countries as diverse as Indonesia, Thailand, India and countries on the east coast of Africa — all facing the Indian Ocean basin — were struck by the same tsunami originating from a single tectonic event at a plate boundary. The 14 countries affected and over 230,000 deaths demonstrate that tectonic hazards can generate truly transnational secondary hazards. The distribution of impact was therefore determined not only by the location of the plate boundary but by the shape, depth and connectivity of the Indian Ocean basin. (1 mark) The 2004 disaster also illustrates that countries with no proximity to plate boundaries — such as those on the eastern coast of Africa — faced significant tsunami risk simply by virtue of facing an ocean basin connected to a major subduction zone. This has major implications for disaster risk management: national preparedness systems must account for hazards generated thousands of kilometres away at distant plate boundaries, not only for hazards originating within their own territory. (1 mark)", "lo": false}, {"id": "Q4.2.l", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source G and your own knowledge, explain how earthquakes generate multiple hazards and assess which earthquake hazard poses the greatest risk to communities.", "src": {"t": "table", "lbl": "Source G", "cap": "Earthquake hazards — types, how they occur, impacts and case studies", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and case studies", "info": "", "hdr": ["Hazard", "How it occurs", "Impacts", "Case study"], "rows": [["Ground shaking", "Seismic waves cause the ground to shake", "Destroys buildings and infrastructure; causes injuries and deaths; disrupts transport and utilities", "2011 Tohoku, Japan — ground shaking damaged buildings across Tohoku region"], ["Soil liquefaction", "Water-saturated loose soil loses structure and behaves as a thick fluid due to ground shaking", "Buildings and structures sink or topple; roads become impassable; underground pipes burst", "Christchurch, NZ 2011 — extensive liquefaction in residential areas"], ["Landslides", "Ground shaking destabilises slopes, causing rock and soil to slide downhill", "Buries settlements and blocks roads; damages ecosystems", "Kashmir earthquake 2005 — landslides buried entire villages"], ["Tsunami", "Seafloor displacement during large earthquakes generates ocean waves", "Coastal flooding and destruction; drowning; damage to coastal ecosystems", "2004 Indian Ocean tsunami — 230,000+ deaths across 14 countries"]]}, "ans": "Source G shows that a single earthquake event can simultaneously generate multiple distinct hazards through different physical mechanisms. Ground shaking is the primary direct hazard — seismic waves cause the ground to shake, destroying buildings and infrastructure. Ground shaking then triggers secondary hazards: it destabilises water-saturated soils to cause liquefaction (as in Christchurch 2011), destabilises slopes to cause landslides (as in the 2005 Kashmir earthquake) and — when the earthquake occurs at the seafloor — displaces the ocean floor to generate tsunamis (as in the 2004 Indian Ocean disaster). (1 mark) Source G's liquefaction example from Christchurch 2011 illustrates a hazard that is often underestimated relative to ground shaking — when water-saturated soil loses its structure and behaves as a fluid, buildings and structures sink or topple even in areas that experienced only moderate ground shaking. This demonstrates how local geological conditions can dramatically amplify earthquake impacts beyond what ground shaking alone would cause. (1 mark) Assessing which hazard poses the greatest risk to communities depends heavily on context. In terms of global death tolls, tsunami is by far the most deadly single earthquake-generated hazard — the 2004 Indian Ocean tsunami alone killed over 230,000 people across 14 countries, a death toll exceeding that of all other earthquake hazards combined in recorded history. The ability of tsunamis to propagate across entire ocean basins means they can affect densely populated coastlines thousands of kilometres from the earthquake epicentre. (1 mark) However, ground shaking remains the most consistently lethal earthquake hazard for communities at or near the epicentre — particularly in developing countries where building quality is poor. The 2010 Haiti earthquake (Mw 7.0) killed over 230,000 people primarily through the collapse of poorly constructed buildings, without generating any significant tsunami. This demonstrates that the greatest risk depends on the combination of hazard type, community vulnerability and exposure. No single hazard is universally the greatest risk — effective disaster
