.fl{font-size:11px;font-weight:bold;color:#333;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;display:block}

.ans-lbl{font-size:11px;font-weight:bold;color:#333;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;margin-top:11px}
.ans-box{width:100%;border:1.5px solid #AAA;border-radius:6px;padding:9px;font-size:14px;color:#111;font-family:Arial,sans-serif;line-height:1.5;resize:vertical;min-height:100px;background:#fff}

.ans-box:disabled{background:#F5F5F5;color:#555}
.a-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding-top:11px;border-top:1.5px solid #EEE}
.nav-info{font-size:12px;color:#888}
.model-box{background:#F0FFF5;border:1.5px solid #1A7A4A;border-radius:6px;padding:11px;margin-top:9px}
.model-lbl{font-size:10px;font-weight:bold;color:#1A7A4A;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;font-family:monospace}
.model-txt{font-size:13px;color:#111;line-height:1.5}
/* TIMER */
.timer{background:#EEF2F8;border:1.5px solid #1A3A6C;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:bold;color:#1A3A6C;font-family:monospace;display:inline-block;margin-top:9px}

.timer.danger{background:#FFEEEE;border-color:#C0392B;color:#C0392B;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
/* SCENARIO */
.sc-intro{background:#FFFDE7;border:1.5px solid #C47B0A;border-radius:6px;padding:10px;margin-bottom:11px;font-size:13px;color:#333;line-height:1.5;font-style:italic}
.sc-prog{display:flex;gap:5px;margin-bottom:11px}
.sc-seg{flex:1;height:6px;border-radius:3px;background:#DDD;cursor:pointer}
.sc-seg.done{background:#1A7A4A}.sc-seg.active{background:#C47B0A}
/* TUTOR */
.t-hdr{padding:10px 14px;background:#1A3A6C;flex-shrink:0}
.t-title{font-size:13px;font-weight:bold;color:#fff;display:flex;align-items:center;gap:7px}
.t-dot{width:7px;height:7px;border-radius:50%;background:#2ECC71;display:inline-block}
.t-sub{font-size:11px;color:#AABBCC;margin-top:2px}
.t-msgs{flex:1;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:#F5F6F8}
.tmsg{border-radius:6px;padding:10px;font-size:12px;line-height:1.5}
.t-lbl{font-size:10px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;font-family:monospace}
.ts{background:#fff;border:1px solid #CCC;color:#333}.ts .t-lbl{color:#888}
.th{background:#FFFDE7;border:1.5px solid #C47B0A;color:#222}.th .t-lbl{color:#7A4000}
.tf{background:#F0FFF5;border:1.5px solid #1A7A4A;color:#111}.tf .t-lbl{color:#1A7A4A}
.te{background:#FFEEEE;border:1.5px solid #C0392B;color:#111}
.lbar{display:flex;gap:4px;margin-top:7px}
.lseg{flex:1;height:6px;border-radius:3px;background:#CCC}.lseg.on{background:#1A7A4A}
.ltxt{font-size:11px;color:#1A7A4A;font-weight:bold;margin-top:3px}
.thinking{display:flex;gap:5px;align-items:center;padding:6px 0}
.dot{width:7px;height:7px;border-radius:50%;background:#888;animation:bob 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.t-acts{padding:10px;border-top:1.5px solid #DDD;display:flex;flex-direction:column;gap:7px;background:#fff;flex-shrink:0}
.hint-ct{font-size:11px;color:#888;text-align:center;font-family:monospace}
/* TABLES + PILLS */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#1A3A6C;color:#fff;padding:7px 9px;text-align:left;font-size:12px;font-weight:bold}
.tbl td{padding:7px 9px;border-bottom:1px solid #EEE;color:#222;vertical-align:middle}
.tbl tr:hover td{background:#F5F6F8}.tbl tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.pg{background:#DDFAEE;color:#1A6B3C;border:1px solid #97C459}
.pr{background:#FFEEEE;color:#C0392B;border:1px solid #F09595}
.po{background:#FFF3CC;color:#7A4000;border:1px solid #C47B0A}
.pgr{background:#F0F0F0;color:#555;border:1px solid #CCC}
.bar-row{display:grid;grid-template-columns:120px 1fr 38px;gap:8px;align-items:center;margin-bottom:7px}
.bar-n{font-size:12px;color:#333}
.bar-t{background:#EEE;border-radius:3px;height:8px;overflow:hidden}
.bar-f{height:100%;border-radius:3px;transition:width .5s}
.bar-p{font-size:11px;color:#888;font-family:monospace;text-align:right}
.divider{height:1.5px;background:#EEE;margin:11px 0}
.sec-lbl{font-size:11px;font-weight:bold;color:#1A3A6C;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;margin-top:13px}
.page-title{font-size:16px;font-weight:bold;color:#1A3A6C;margin-bottom:4px}
.page-sub{font-size:12px;color:#888;margin-bottom:13px}
.empty{background:#fff;border:1.5px dashed #CCC;border-radius:7px;padding:22px;text-align:center;font-size:13px;color:#888;line-height:1.7}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.join-item{background:#fff;border:1.5px solid #DDD;border-radius:7px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:9px}

.score-row:last-child{border-bottom:none}
</style>

const CLUSTERS=[
  {id:'gel',name:'GEL Cluster',topics:[{id:'1.1',name:'Thinking Geographically'},{id:'1.2',name:'Sustainable Development'},{id:'1.3',name:'Geographical Methods',sc:true}]},
  {id:'tourism',name:'Tourism Cluster',topics:[{id:'2.1',name:'Tourism Trends'},{id:'2.2',name:'Tourism Development'},{id:'2.3',name:'Sustainable Tourism'}]},

  {id:'singapore',name:'Singapore Cluster',topics:[{id:'5.1',name:'Food Security'},{id:'5.2',name:'Water Security'},{id:'5.3',name:'Energy Security'}]},
];

const QUESTIONS={
  '1.1':[
    {id:'Q1.1a',ao:'AO1',marks:1,cmd:'Define',text:'What is meant by "sense of place"?',src:null,
     ans:'Sense of place refers to the importance, meanings and memories people associate with specific locations in their neighbourhoods, acquired through experiences with natural and built environments and interactions with others at these locations.'},
    {id:'Q1.1b',ao:'AO1',marks:2,cmd:'State',text:'State two ways in which nature areas benefit people in their neighbourhoods.',src:null,
     ans:'(1) Nature areas lower air temperatures through shading by trees and vegetation, reducing the urban heat island effect. (2) Nature areas provide space for recreation and leisure, helping residents maintain physical and mental well-being.'},
    {id:'Q1.1c',ao:'AO2',marks:3,cmd:'Explain',text:'Using Source A, explain the interdependent relationship between local communities and nearby nature areas.',
     src:{t:'table',lbl:'Source A',cap:'Interdependent relationship between people and nature (GEL Textbook, Syllabus 2279)',
      hdr:['Direction','How it occurs','Singapore example'],
      rows:[['People depend on nature','Nature provides essentials; spaces for recreation','NParks Therapeutic Gardens improve well-being'],
            ['Nature depends on people','People tend to health of nearby nature areas','Green Wave campaign educates youths about conservation'],
            ['People bring disadvantages','Visitors cause soil erosion, damage vegetation','Trampling on trails in Central Catchment Nature Reserve'],
            ['Nature brings disadvantages','Wildlife may harm people; limits on development','Wild boars venturing into residential areas']]},
     ans:'Source A shows people and nature are fundamentally interdependent. People depend on nature for essentials and recreation. Nature also depends on people through conservation efforts like the Green Wave campaign. The relationship also involves mutual disadvantages: visitors cause erosion in nature areas, while wildlife can harm residents and environmental protection limits development.'},
    {id:'Q1.1d',ao:'AO2',marks:4,cmd:'Explain',text:"Using Source D and your own knowledge, explain how media representations can enhance or contradict people's sense of place.",
     src:{t:'quote',lbl:'Source D',cap:'Adapted from GEL Textbook, Syllabus 2279',text:"Using the hashtag #sgmemory, Instagram users share photographs of memorable experiences of places around Singapore, building a collective digital archive of neighbourhood memories. Websites featuring the history of Beaulieu House in Sembawang develop people's appreciation for the place. However, the negative media portrayal of Yishun following coverage of unusual incidents caused the Nee Soon Town Council and residents to share official statistics to show that Yishun is a typical Singapore town."},
     ans:"Source D explains that media can enhance sense of place — #sgmemory posts build a collective digital archive of positive neighbourhood memories. However, media can also contradict sense of place: the negative portrayal of Yishun created a reputation contradicting residents' lived experiences, prompting a defensive community response."},
    {id:'Q1.1e',ao:'AO3',marks:6,cmd:'Evaluate',lo:true,text:'"The sense of place that people develop in their neighbourhoods is more strongly shaped by natural environments than by built environments." To what extent do you agree?',src:null,
     ans:"Agree: Nature areas generate strong memorable sense of place through sensory richness. Disagree: The built environment — HDB blocks, void decks, hawker centres — dominates most Singaporeans' daily lives. Conclusion: Natural environments do not more strongly shape sense of place than built environments for most Singaporeans. The strongest sense of place emerges where natural and built environments are well-integrated."},
  ],
  '1.2':[
    {id:'Q1.2a',ao:'AO1',marks:1,cmd:'Define',text:'What is meant by "sustainable development"?',src:null,
     ans:'Sustainable development refers to development that meets the needs of the present population while ensuring the ability of future generations to meet their own needs.'},
    {id:'Q1.2b',ao:'AO2',marks:3,cmd:'Explain',text:"Using Source C, explain how different types of ecosystem services benefit people in Singapore's urban neighbourhoods.",
     src:{t:'table',lbl:'Source C',cap:'Four types of ecosystem services in Singapore (GEL Textbook, Syllabus 2279)',
      hdr:['Type','Definition','Singapore example'],
      rows:[['Provisioning','Tangible resources — food, water','Community gardens at Tampines HDB rooftops; reservoirs'],
            ['Regulating','Benefits from ecosystem processes','Trees in Bishan-AMK Park cool temperatures, reduce runoff'],
            ['Cultural','Non-material benefits — aesthetics, recreation','Bukit Timah Nature Reserve — hiking, fieldwork, appreciation'],
            ['Supporting','Services that make all others possible','Wild bees pollinate community gardens; trees maintain oxygen']]},
     ans:'Source C shows provisioning services provide the most tangible benefits — fresh water and food from urban ecosystems. Regulating services from Bishan-AMK Park perform continuous environmental management. Cultural services from Bukit Timah Nature Reserve contribute to mental health and sense of place, while supporting services like pollination make all other ecosystem services possible.'},
    {id:'Q1.2c',ao:'AO3',marks:6,cmd:'Evaluate',lo:true,text:'"Investing in urban green infrastructure is the most cost-effective approach to achieving sustainable urban neighbourhoods." To what extent do you agree?',
     src:{t:'quote',lbl:'Source M',cap:'Adapted from GEL Textbook, Syllabus 2279',text:'"The ecosystem services that our parks and nature areas provide — cooling, flood control, clean air, mental health restoration — save us money that we would otherwise spend on air conditioning, drainage infrastructure, healthcare and mental health services. Every dollar spent on green infrastructure is an investment that pays back across multiple dimensions of urban sustainability." — Urban planner'},
     ans:"Agree: Source M's argument is well-supported — the HDB Green Towns Programme reduces energy consumption; naturalised waterways reduce stormwater costs. Disagree: Green infrastructure cannot address all sustainability challenges. Conclusion: Green infrastructure is highly cost-effective but is one important element within a comprehensive sustainability strategy, not the single most cost-effective approach."},
  ],
};

(function(){
  var extra={"2.1": [{"id": "Q2.1.a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by a \"tourist generating region\"?", "src": null, "ans": "A tourist generating region is a place where tourists originate — it is the permanent place of residence of tourists, from which they depart to travel to tourist destination regions. (1 mark)", "lo": false}, {"id": "Q2.1.b", "ao": "AO1", "marks": 1, "cmd": "State", "text": "State one push factor and one pull factor that motivate tourists to travel.", "src": null, "ans": "Push factor: Stress from work / desire to escape routine / boredom with daily life. (½ mark) Pull factor: Attractive natural scenery / cultural heritage / relaxation activities available at the destination. (½ mark) *Both required for 1 mark.*", "lo": false}, {"id": "Q2.1.c", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two ways in which growth in disposable incomes has contributed to the growth of tourism.", "src": null, "ans": "Higher disposable incomes give people more money to spend on travel, accommodation and leisure activities at tourist destinations. (1 mark) Higher disposable incomes increase people's ability to travel, as they can afford the costs of air tickets, hotels and tour packages that were previously out of reach. (1 mark)", "lo": false}, {"id": "Q2.1.d", "ao": "AO1", "marks": 2, "cmd": "Identify", "text": "Identify two characteristics of Venturer-type tourists.", "src": null, "ans": "Venturers spend money more readily and are guided by their personal judgement rather than authority figures in making travel decisions. (1 mark) Venturers prefer to be spontaneous, travel alone, and explore less-developed, unique places where they can participate in new experiences and activities — often setting travel trends for others. (1 mark)", "lo": false}, {"id": "Q2.1.e", "ao": "AO1", "marks": 3, "cmd": "State", "text": "State three characteristics of the stagnation stage in the Tourist Area Cycle of Evolution.", "src": null, "ans": "Tourist arrivals have peaked and begin to decline as the destination has reached or exceeded its carrying capacity, resulting in negative environmental and social effects. (1 mark) The destination may no longer be as attractive as it once was — facilities and attractions may have become old and run down, and tourists start to feel the location has nothing new to offer them. (1 mark) Contributions of tourism to the local economy begin to stagnate, threatening the livelihoods of local businesses and residents who depend on tourism. (1 mark)", "lo": false}, {"id": "Q2.1.f", "ao": "AO2", "marks": 3, "cmd": "Describe", "text": "Using Source A, describe the global pattern of international tourist arrivals and explain how the tourism system connects tourist generating and destination regions.", "src": {"t": "table", "lbl": "Source A", "cap": "International tourist arrivals by region — 2019 vs 2022 recovery", "credit": "Adapted from UNWTO World Tourism Barometer, 2023", "info": "Asia Pacific anomaly: Only 19% recovery by 2022, largely due to China's extended border restrictions — demonstrating how closure of a major generating region cascades through the entire tourism system.", "hdr": ["Region", "Arrivals 2019", "Arrivals 2022", "% Recovery", "Top generating markets"], "rows": [["Europe", "748 million", "585 million", "78%", "Germany, UK, France, Russia"], ["Asia Pacific", "360 million", "67 million", "19% ▼", "China, Japan, Australia, S. Korea"], ["Americas", "217 million", "167 million", "77%", "USA, Canada, Mexico"], ["Middle East", "58 million", "83 million", "143% ▲", "Saudi Arabia, UAE"], ["Africa", "68 million", "62 million", "91%", "South Africa, Nigeria, Morocco"]]}, "ans": "Source A shows that Europe dominates international tourist arrivals — receiving 748 million in 2019 and recovering to 585 million (78%) by 2022 — while Asia Pacific had the slowest recovery at only 19% of pre-COVID levels, largely due to extended border restrictions in China. The Middle East was the only region to exceed pre-COVID arrival numbers by 2022 (+143%). (1 mark) The tourism system connects tourist generating regions — such as Germany, the USA and China — with tourist destination regions through transit routes including international air travel, cruise ships and overland transport. Tourist generating regions provide the demand for tourism, while destination regions supply the attractions, accommodation and services that satisfy tourists' push and pull motivations. (1 mark) Source A demonstrates the interdependence of tourist generating and destination regions — the dramatic collapse in Asia Pacific arrivals (from 360 million to 67 million) during COVID-19 shows how the closure of generating regions such as China immediately devastated destination economies across Southeast Asia, illustrating how disruptions to one part of the tourism system affect all other parts. (1 mark)", "lo": false}, {"id": "Q2.1.g", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source B and your own knowledge, explain how the tourism system operates as an interconnected system and why changes in one part affect other parts.", "src": {"t": "quote", "lbl": "Source B", "cap": "COVID-19 and the interconnected tourism system", "credit": "Adapted from UNWTO Tourism and COVID-19 Report, 2021", "info": "Key concept: Tourism system is interdependent — disruptions to transit routes (border closures) immediately cascade to both generating regions (airlines, travel agents) and destination regions (hotels, restaurants, local attractions). US$1.3 trillion in lost revenues = 11× greater than the 2009 fina", "text": "\"The COVID-19 pandemic devastated global tourism in 2020, with international tourist arrivals falling by 74% — the worst result in recorded tourism history. The economic impact was catastrophic: an estimated US$1.3 trillion in lost export revenues, more than 11 times the loss recorded during the 2009 global financial crisis. Countries most dependent on tourism suffered disproportionately. Thailand saw tourist arrivals collapse from 39.8 million in 2019 to fewer than 7 million in 2020. The crisis highlighted how deeply interdependent tourist generating regions, transit routes and destination regions are, and how events in any one part of the system can cascade through the entire global tourism economy.\""}, "ans": "Source B shows that the COVID-19 pandemic caused a 74% collapse in international tourist arrivals in 2020 — demonstrating how disruptions to transit routes (border closures, flight cancellations) immediately cut off the flow of tourists between generating and destination regions. When transit routes shut down, the entire tourism system ceased to function. (1 mark) The collapse of tourist arrivals from generating regions like China, Germany and the USA caused cascading economic damage in destination regions — Source B shows Thailand's arrivals collapsed from 39.8 million to fewer than 7 million, threatening the livelihoods of millions of workers in hotels, restaurants, transport and leisure activities. (1 mark) The US$1.3 trillion in lost export revenues described in Source B shows that the impacts cascaded far beyond the immediate tourism sector — businesses and organisations in both tourist generating regions (airlines, travel agents, tour operators) and destination regions (hotels, restaurants, local attractions) are mutually dependent. When one part of the system fails, all interdependent parts suffer simultaneously. (1 mark) Source B also shows that recovery in the tourism system is similarly interconnected — as vaccinations spread and borders reopened, traveller confidence returned and the Middle East became the first region to exceed pre-pandemic levels. Positive changes in transit routes and generating regions restore the flow of tourists through the entire system, triggering recovery across all destination regions. (1 mark)", "lo": false}, {"id": "Q2.1.h", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source C and your own knowledge, explain the factors that have led to the dramatic growth of international tourism since 1950.", "src": {"t": "chart", "lbl": "Source C", "cap": "Growth of international tourist arrivals globally, 1950–2022", "credit": "Adapted from UNWTO Tourism Highlights, 2023", "info": "Long-term growth: 25 million (1950) → 1.5 billion (2019) — driven by improved mobility, rising incomes and growing motivation to travel. COVID-19 impact: 1.5 billion (2019) → ~400 million (2020) — a 74% collapse — before partial recovery to ~963 million (2022).", "chartCfg": "{type:'line',data:{labels:yrs,datasets:[{label:'Arrivals (millions)',data:arr,borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0.08)',borderWidth:2.5,pointRadius:arr.map((_,i)=>i===9||i===10?7:4),pointBackgroundColor:arr.map((_,i)=>i===10?'#E24B4A':'#185FA5'),pointBorderColor:'#fff',pointBorderWidth:2,tension:0.35,fill:true}]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:20}},plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.parsed.y.toLocaleString()+' million arrivals'}}},scales:{x:{ticks:{autoSkip:false,maxRotation:45,font:{size:10},color:'#888780'},grid:{display:false},border:{display:false}},y:{beginAtZero:true,max:1700,ticks:{stepSize:250,font:{size:11},color:'#888780',callback:v=>v===0?'0':v+'M'},grid:{color:'rgba(136,135,128,0.12)'},border:{display:false},title:{display:true,text:'International tourist arrivals (millions)',font:{size:11},color:'#888780'}}}}}", "chartId": "chart_2_1_C_Q2.1.h"}, "ans": "Source C shows that international tourist arrivals grew from just 25 million in 1950 to over 1.5 billion by 2019 — a 60-fold increase driven by multiple reinforcing factors. The acceleration from the 1990s onward coincides with rapid growth in disposable incomes across both developed and newly emerging economies, giving more people the financial ability to travel internationally. (1 mark) The growth in mobility in travel — through the expansion of global aviation infrastructure, the introduction of fuel-efficient jet aircraft reducing air travel costs, and the growth of budget airlines like AirAsia and Ryanair — dramatically lowered the cost barrier to international travel, enabling hundreds of millions more people to afford overseas trips. (1 mark) Business innovations shown by the steep growth from the 1990s onward reflect the role of online booking platforms (Expedia, Booking.com, Airbnb) and digital marketing, which made it far easier and cheaper for tourists to research, plan and book international travel independently — removing the reliance on expensive travel agents and opening up a far wider range of destinations. (1 mark) The dramatic drop in Source C in 2020 — from 1.5 billion to 400 million — confirms the strength of the underlying growth factors: when COVID-19 removed the ability to travel through border closures, arrivals collapsed immediately, and the rapid partial recovery to 963 million by 2022 shows how strong the pent-up motivation and ability to travel remained. (1 mark)", "lo": false}, {"id": "Q2.1.i", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source D, explain how improvements in the ability and mobility of tourists have driven the growth of international tourism.", "src": {"t": "table", "lbl": "Source D", "cap": "Key enabling factors for international tourism growth — historical trends", "credit": "Adapted from IATA, Airbus and World Bank data, 2022", "info": "Key insight: Flight costs fell −80% while the global middle class grew +583% — together improving both the mobility and ability of hundreds of millions of new tourists to travel internationally.", "hdr": ["Factor", "1970", "2000", "2022", "Trend"], "rows": [["Avg. long-haul flight cost (USD, real)", "~$4,000", "~$1,500", "~$800", "−80% in real terms"], ["Global commercial aircraft fleet", "~5,000", "~17,000", "~25,000", "+400% ▲"], ["Global middle class (billions)", "~0.6 bn", "~1.8 bn", "~4.1 bn", "+583% ▲"], ["International tourist arrivals", "166 million", "674 million", "963 million", "+480% ▲"], ["Online travel agency market", "N/A", "~$10 billion", "~$450 billion", "Rapid growth ▲"]]}, "ans": "Source D shows that the average cost of a long-haul international flight fell by approximately 80% in real terms between 1970 and 2022 — from ~$4,000 to ~$800. This dramatic reduction in transport costs directly improved tourists' ability and mobility by making international air travel affordable to a far wider segment of the global population. (1 mark) The growth of the global commercial aircraft fleet from ~5,000 in 1970 to ~25,000 in 2022 (+400%) shown in Source D demonstrates how the expansion of aviation infrastructure has increased the frequency, range and accessibility of international air travel routes — directly enhancing tourists' mobility to reach a wider variety of destinations. (1 mark) Source D shows the global middle class grew from ~0.6 billion in 1970 to ~4.1 billion in 2022 (+583%). This massive expansion — particularly in Asia — dramatically increased the number of people with the disposable incomes and paid vacation time needed to afford international travel. The parallel growth of the online travel agency market from ~$10 billion to ~$450 billion further enhanced ability by making booking faster, cheaper and more accessible. (1 mark)", "lo": false}, {"id": "Q2.1.j", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source E and your own knowledge, explain how changes in transport and business innovations have increased the mobility and ability of tourists.", "src": {"t": "quote", "lbl": "Source E", "cap": "Aviation as the engine of international tourism growth", "credit": "Adapted from IATA and World Tourism Organization, 2022", "info": "Key statistic: London–New York return: 70% of annual salary (1952) → less than 1% (2022) . This 70× reduction in real cost democratised international long-haul air travel — making it accessible to ordinary working people for the first time.", "text": "\"The growth of aviation has been the single most transformative force in international tourism. In 1952, a return flight from London to New York cost approximately £280 — equivalent to about 70% of the average annual UK salary at the time. By 2022, the same flight could be booked for as little as £300 in nominal terms — less than 1% of the average UK annual salary. The introduction of wide-body aircraft in the 1970s, the deregulation of the aviation industry from the 1980s, and the emergence of low-cost carriers in the 1990s collectively made air travel accessible to ordinary working people for the first time. Today, more than 4 billion passenger journeys are made by air each year.\""}, "ans": "Source E provides a compelling illustration of improved ability — a London-New York return flight fell from 70% of the average annual UK salary in 1952 to less than 1% by 2022. This dramatic reduction in the cost of international air travel — driven by wide-body aircraft, industry deregulation and low-cost carriers — gave hundreds of millions of ordinary working people the financial ability to travel internationally for the first time. (1 mark) The introduction of wide-body aircraft in the 1970s described in Source E directly enhanced tourist mobility by dramatically increasing the carrying capacity of each flight, reducing per-seat costs and enabling airlines to open new long-haul routes. This expanded the range of destinations that tourists could practically reach, transforming regions like Southeast Asia and the Caribbean into accessible mass tourism destinations. (1 mark) The emergence of low-cost carriers (LCCs) from the 1990s described in Source E created an entirely new tourism market segment — stimulating demand among price-sensitive tourists who had never previously flown. LCCs opened new secondary airport routes, expanded intra-regional travel and enabled short-break tourism that would have been impossible with traditional full-service airline pricing. (1 mark) The growth of online booking platforms — enabling tourists to compare prices, read reviews and book flights, accommodation and activities directly — represents a business innovation that has reduced both the cost and effort of international travel planning. Source E shows this has contributed to a total of more than 4 billion air passenger journeys annually, demonstrating how transport improvements and digital business innovations have together created an era of unprecedented tourist mobility. (1 mark)", "lo": false}, {"id": "Q2.1.k", "ao": "AO2", "marks": 3, "cmd": "Describe", "text": "Using Source F, describe the Tourist Area Cycle of Evolution and explain how different destinations are at different stages of this cycle.", "src": {"t": "table", "lbl": "Source F", "cap": "Tourist Area Cycle of Evolution — stages and destination examples", "credit": "Adapted from Butler (1980) and case studies of tourism development in selected destinations", "info": "", "hdr": ["Destination", "Stage", "Key characteristics", "Tourist arrivals"], "rows": [["Bhutan", "Involvement", "Small numbers of high-paying tourists; government limits arrivals; locals offer guide services", "~145,000/year (controlled)"], ["Bali, Indonesia", "Consolidation/Stagnation", "Mass tourism; tourists exceed local population in peak season; environmental pressure on coastline", "~6 million/year (pre-COVID)"], ["Maya Bay, Thailand", "Decline → Rejuvenation", "Coral reef destroyed by pollution; closed 2018; reopened 2022 with strict visitor cap of 375/day", "Closed 2018; limited reopening 2022"], ["Sentosa, Singapore", "Continuous Rejuvenation", "Sustained government investment — Universal Studios, integrated resorts; 2030 sustainable goals", "~30 million/year"]]}, "ans": "Source F illustrates the Tourist Area Cycle of Evolution across four different destinations. Bhutan, in the involvement stage, has small numbers of high-paying tourists with locals beginning to offer guide services and the government controlling arrivals to protect its environment and culture — reflecting the characteristic of locals providing basic tourist services and advertising the destination at an early stage of development. (1 mark) Bali in the consolidation/stagnation stage shows how tourist numbers eventually exceed the local population in peak season, creating significant environmental pressure. This reflects the cycle's prediction that as tourist numbers grow beyond the destination's carrying capacity, negative impacts begin to emerge, threatening both the environment and the quality of the tourist experience. (1 mark) Source F shows two destinations in the decline and rejuvenation phases. Maya Bay experienced classic decline — coral reef destruction led to the beach being closed in 2018 — but achieved rejuvenation through new management rules when it reopened in 2022. Sentosa, Singapore demonstrates continuous active rejuvenation through major new investments, maintaining tourist appeal through ongoing product development — demonstrating that rejuvenation requires sustained investment and innovation to reverse decline or prevent stagnation. (1 mark)", "lo": false}, {"id": "Q2.1.l", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source G and your own knowledge, explain how carrying capacity relates to the Tourist Area Cycle of Evolution and what it means for the management of tourist destinations.", "src": {"t": "quote", "lbl": "Source G", "cap": "Maya Bay, Thailand — carrying capacity exceeded and rejuvenation", "credit": "Adapted from Tourism Authority of Thailand and media reports, 2022", "info": "", "text": "\"Maya Bay on Koh Phi Phi Leh island in Thailand rose to global fame after being featured in the 2000 film 'The Beach.' By the mid-2010s, the bay was receiving up to 5,000 tourists per day — far exceeding its ecological carrying capacity. Boat engines polluted the water, tourists trampled the coral reef, and the bay's pristine natural environment was rapidly degrading. In 2018, Thai authorities closed Maya Bay completely. By 2022, when the bay was cautiously reopened, coral cover had recovered significantly, and marine life had returned. The reopening came with strict new rules: no boats with combustion engines, a daily visitor cap of 375 people, and a ban on overnight stays.\""}, "ans": "Source G shows that Maya Bay's carrying capacity was dramatically exceeded when arrivals reached up to 5,000 per day. This directly relates to the stagnation stage of the Tourist Area Cycle, where tourist numbers peak at or beyond the destination's carrying capacity, resulting in negative environmental impacts: coral destruction, water pollution and ecosystem degradation. (1 mark) When a destination exceeds its carrying capacity and enters decline, Source G shows that intervention becomes necessary to prevent permanent environmental damage. Thai authorities chose complete closure — reflecting the severity of the ecological damage. This was only possible because the destination's natural environment was the primary tourist resource, and its recovery required complete removal of tourist pressure. (1 mark) The successful recovery of Maya Bay — with coral cover and marine life returning during the four-year closure — demonstrates the potential for rejuvenation when destinations take decisive action. This corresponds to Butler's rejuvenation stage, achieved through restoring the natural environment that originally attracted tourists. (1 mark) The strict management rules introduced at Maya Bay's reopening — visitor cap of 375 per day, no combustion engines, no overnight stays — demonstrate how effective destination management must permanently constrain tourist numbers below carrying capacity to prevent a return to the stagnation/decline cycle. Sustainable tourism requires demand management alongside supply, ensuring that the destination's primary attractions are protected for future generations. (1 mark)", "lo": false}, {"id": "Q2.1.m", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source H and your own knowledge, explain how the characteristics of tourist destinations change as they progress through the Tourist Area Cycle of Evolution.", "src": {"t": "table", "lbl": "Source H", "cap": "Tourist Area Cycle — changing characteristics across stages", "credit": "Adapted from World Tourism Organization and case study data, 2022", "info": "", "hdr": ["Characteristic", "Exploration", "Development", "Stagnation", "Rejuvenation"], "rows": [["Tourist numbers", "Very small; individuals", "Growing rapidly; mass arrivals", "Peaked; beginning to decline", "Growing again after investment"], ["Type of tourist", "Mostly Venturers", "Increasingly Dependables", "Predominantly Dependables", "Mix — new Venturers drawn by new attractions"], ["Infrastructure", "Virtually none; primitive", "Rapid development of hotels and attractions", "Well-developed but aging", "Redeveloped / upgraded / new"], ["Local community involvement", "High — locals provide all services", "Declining — foreign investment and labour", "Low — dominated by foreign businesses", "Variable — may increase with new management"], ["Economic contribution", "Minimal", "Significant and growing", "Stagnating; businesses threatened", "Recovering and growing again"]]}, "ans": "Source H shows that in the exploration stage, tourist numbers are very small and infrastructure is virtually absent — mostly Venturer-type tourists travel individually to experience the destination's primary natural or cultural attractions. Local community involvement is high at this stage as locals provide all tourist services, and the economic contribution is minimal but growing. (1 mark) As destinations progress to the development and consolidation stages shown in Source H, tourist numbers grow rapidly — from individual Venturer travellers to predominantly Dependable-type mass tourists attracted by well-developed hotels, man-made attractions and advertising campaigns. Foreign investment and labour increasingly replace local community involvement, and the destination becomes economically dependent on tourism revenues. (1 mark) At stagnation shown in Source H, tourist infrastructure has become aging and no longer competitive. Economic contributions stagnate and local businesses face increasing pressure as the destination loses its appeal. Source H highlights that local community involvement is low at this stage, dominated by foreign businesses that extract profits rather than reinvesting in the local economy. (1 mark) Source H shows that rejuvenation reverses the stagnation/decline trajectory through investment in new or redeveloped infrastructure, which attracts a new mix of tourists — including Venturer types drawn by genuinely new experiences. This corresponds to Butler's description of rejuvenation requiring 'a complete change in the attractions on which tourism is based.' Successful rejuvenation requires sustained investment and innovative product development that continuously refreshes the destination's appeal. (1 mark)", "lo": false}, {"id": "Q2.1.n", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source I and your own knowledge, explain how the differences between Dependable-type and Venturer-type tourists affect tourist destination regions differently.", "src": {"t": "note", "lbl": "Source I", "cap": "Tourist personality characteristics — Plog's Dependables vs Venturers", "credit": "Adapted from Plog (2002) and Tourism Textbook, Syllabus 2279", "info": "", "text": "Tourist personality characteristics — Plog's Dependables vs Venturers"}, "ans": "Source I shows that Dependable-type tourists prefer popular destinations with well-developed mass tourism infrastructure. Their preference for structured, predictable experiences means they tend to concentrate in already well-established destinations like Bali, Phuket and Singapore, generating large volumes of spending but also contributing to the congestion and overcrowding that can push destinations towards stagnation. (1 mark) Venturer-type tourists described in Source I prefer to explore less-developed, unique places guided by their own personal judgement. They therefore tend to visit destinations in the earlier stages of the Tourist Area Cycle — exploration and involvement stages — where infrastructure is limited but the destination's natural or cultural authenticity is intact. Their spending is more ready and they are more likely to engage with local businesses directly, meaning more of their spending is retained in the local economy with less leakage. (1 mark) Source I highlights that Venturer-type tourists set travel trends for others — meaning they effectively serve as \"scouts\" for new destinations. This explains the progression from exploration to development stages: Venturer pioneers discover destinations, their experiences generate publicity, and growing numbers of Dependables follow as infrastructure develops to meet their comfort requirements. (1 mark) The coexistence of Dependable and Venturer types creates different management challenges for destination regions. Destinations catering primarily to Dependables must invest in mass tourism infrastructure and manage large crowds. Destinations attracting Venturers must balance authentic experiences with the growing infrastructure demands that follow. Most tourists are in the middle of the spectrum — meaning most destinations must design experiences that appeal to a broad range of tourist personalities to maximise visitor numbers without sacrificing authenticity. (1 mark)", "lo": false}, {"id": "Q2.1.o", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source J and your own knowledge, explain how the interaction between tourist personality characteristics and the Tourist Area Cycle of Evolution shaped Iceland's tourism development.", "src": {"t": "chart", "lbl": "Source J", "cap": "Iceland's tourism transformation — from Venturers to mass tourism", "credit": "Adapted from case study of Iceland's tourism development, 2022", "info": "Cycle progression: Exploration (pre-2010, Venturers) → Development/Consolidation (2012–2019, Dependable mass growth) → Approaching Stagnation (overcrowding at Blue Lagoon, Jökulsárlón). Key mechanism: Venturer tourists discover destination → viral social media spreads awareness → Dependables follow ", "chartCfg": "{type:'bar',data:{labels:['2010','2011','2012','2013','2014','2015','2016','2017','2018','2019'],datasets:[{label:'Arrivals (thousands)',data:[489,566,672,807,997,1289,1792,2225,2348,2007],backgroundColor:['#185FA5','#185FA5','#1D9E75','#1D9E75','#1D9E75','#EF9F27','#EF9F27','#E24B4A','#E24B4A','#E24B4A'],borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.parsed.y.toLocaleString()+'k arrivals'}}},scales:{x:{ticks:{autoSkip:false,font:{size:11},color:'#888780'},grid:{display:false},border:{display:false}},y:{beginAtZero:true,max:2600,ticks:{stepSize:500,font:{size:11},color:'#888780',callback:v=>v+'k'},grid:{color:'rgba(136,135,128,0.12)'},border:{display:false},title:{display:true,text:'Tourist arrivals (thousands)',font:{size:11},color:'#888780'}}}}}", "chartId": "chart_2_1_J_Q2.1.o"}, "ans": "Source J shows Iceland's transformation from 489,000 visitors in 2010 to 2.3 million by 2018 — a pattern that directly reflects the Tourist Area Cycle of Evolution. In the early stage (pre-2010), Iceland was in the exploration stage, attracting Venturer-type tourists drawn by its extraordinary and largely undiscovered natural landscapes — glaciers, geysers, volcanoes and the Northern Lights. (1 mark) Source J illustrates how Venturer-type tourists set travel trends for Dependables — the dramatic landscapes were documented through viral social media and Instagram photography, transforming Iceland into a globally recognised destination. This media exposure bridges the gap between the exploration/involvement stages and the rapid development stage, dramatically accelerating the transition that might otherwise have taken decades. (1 mark) As Iceland's reputation grew through Venturer-initiated social media content, growing numbers of Dependable-type tourists drove arrivals to 2.3 million. This corresponds to the development/consolidation stage of Butler's model, where destinations experience rapid growth in tourist numbers, increasing infrastructure development and advertising, and growing numbers of less adventurous tourists. (1 mark) Source J demonstrates how exceeding carrying capacity triggers the onset of stagnation — overcrowding and queues at key sites threatened the very authenticity and pristine natural beauty that attracted tourists initially. When carrying capacity is exceeded, the destination risks losing its appeal to Venturer-type tourists, who will move on to new undiscovered destinations. (1 mark) Iceland's government response — visitor capacity limits and increased fees — reflects the management principle that destination regions must actively control demand to prevent the stagnation/decline trajectory. By limiting access to key sites, Iceland is attempting to maintain the quality of tourist experience that sustains its appeal to both Venturer and Dependable types — a strategy consistent with sustainable tourism management principles. (1 mark)", "lo": false}, {"id": "Q2.1.p", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source K and your own knowledge, to what extent do you agree that the Tourist Area Cycle of Evolution is a useful model for understanding how tourist destinations develop? Explain your answer.", "src": {"t": "quote", "lbl": "Source K", "cap": "Commentary by a tourism geographer", "credit": "Adapted from a tourism geography commentary, 2022", "info": "Key claims: The cycle is \"too deterministic\" — stagnation and decline are not inevitable for all destinations. | Sentosa Island has been continuously rejuvenated through proactive management — never reaching stagnation. | The cycle is best understood as a \"warning\" for poorly managed destinations, not a universal prediction. Consider: Is the Tourist Area Cycle still a useful model despite its limitations? What evidence supports or challenges Source K's view?", "text": "The Tourist Area Cycle of Evolution is a useful analytical tool, but it is too deterministic. It implies that all destinations will inevitably follow the same path from exploration to stagnation and decline — as if decline and stagnation are somehow unavoidable. In reality, the most successful destinations have avoided stagnation entirely through proactive management and continuous reinvestment. Singapore's Sentosa Island has been continuously rejuvenated for decades — never reaching stagnation because of sustained government investment in new world-class attractions. The cycle is best understood not as a prediction, but as a warning: destinations that fail to manage their development proactively will follow it; those that manage well need not.\" Tourism geographer Tourism geography comment"}, "ans": "Agree — the cycle provides a useful framework for understanding destination development: The Tourist Area Cycle of Evolution provides a powerful conceptual framework identifying the key stages — exploration, involvement, development, consolidation, stagnation and decline/rejuvenation — and the mechanisms that drive progression through them, including growing tourist numbers, infrastructure development and eventually the degradation of carrying capacity. Maya Bay, Thailand provides compelling real-world evidence — tourist numbers grew from a handful of Venturer-type visitors in the 1990s to 5,000 per day by the 2010s, destroying the very coral reef environment that attracted them, exactly as the model predicts for the stagnation/decline stage. Iceland's trajectory from 489,000 visitors in 2010 to 2.3 million by 2018 also mirrors the cycle's development/consolidation stages closely. Partially agree — Source K correctly identifies limitations: However, Source K raises valid criticisms. The cycle's deterministic implication that all destinations will inevitably reach stagnation and decline is not well-supported by evidence. Singapore's Sentosa Island has been continuously rejuvenated through sustained government investment and has never reached stagnation. Bhutan has deliberately constrained itself to the involvement stage through strict visitor limits and high-value tourism policies, never experiencing the mass tourism development the cycle would predict. These examples show that proactive management can override the cycle's predicted trajectory. Conclusion: On balance, I agree that the cycle is a useful model but not a deterministic one. As Source K argues, it is best understood as a warning — not a prediction — of what happens when destinations fail to manage their development proactively. Its value lies in helping managers identify which stage a destination is at and what interventions are needed to avoid negative outcomes.", "lo": true}, {"id": "Q2.1.q", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"The growth of tourism always benefits tourist destination regions more than it harms them.\" Do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — tourism generates significant economic benefits for destination regions: Source L shows that tourism is a major contributor to the economies of destination regions. Thailand's tourism sector contributed ~20% of GDP and employed ~18% of the workforce in 2019 — generating enormous income and employment opportunities. For the Maldives, tourism contributes ~28% of GDP and employs ~30% of the workforce, making it the foundation of the entire national economy. For many developing destination regions, tourism represents the most accessible path to economic development — it is labour-intensive, can utilise existing natural and cultural assets, and generates foreign exchange that supports infrastructure development, healthcare and education. Disagree — overdependence on tourism creates serious vulnerability: However, Source L also reveals the severe risks of overdependence on tourism. Thailand's tourist arrivals collapsed from 39.8 million in 2019 to just 6.7 million in 2020 — an 83% fall — due to COVID-19. This single external shock threatened the livelihoods of millions of workers in the 18% of the Thai workforce dependent on tourism, demonstrating how overdependence makes destination regions acutely vulnerable to events beyond their control. The Maldives, with tourism contributing 28% of GDP and 30% of employment, faces an even more acute vulnerability. Disagree — benefits are unevenly distributed and harm specific groups: The statement's claim that tourism 'always benefits destination regions' also ignores the uneven distribution of benefits and costs. Economic leakages — where tourism revenue flows out to foreign-owned hotel chains, airlines and tour operators — reduce the actual benefit retained locally. Communities near Maya Bay experienced severe environmental degradation — the destruction of their coral reef — while the economic benefits of tourism were largely captured by boat operators and hotels. Nuanced evaluation — benefits vs harms depend on management quality: Source L demonstrates that the balance of benefits and harms depends significantly on management approach. France — with 90.9 million arrivals but tourism contributing only 7% of GDP — has a diversified economy that buffers tourism shocks. Bhutan's policy of limiting arrivals keeps tourism's GDP contribution at a manageable 7% while protecting its cultural and environmental assets. Singapore's tourism contributes only 4% of GDP thanks to a highly diversified economy. Conclusion: On balance, I do not agree that tourism 'always' benefits destination regions more than it harms them. Tourism can bring enormous economic benefits — particularly in developing destinations with limited alternative economic opportunities — but these benefits are unevenly distributed, vulnerable to external shocks, and can be overshadowed by environmental degradation, cultural disruption and social problems when tourism exceeds carrying capacity or creates economic overdependence. The balance ultimately depends on the quality and proactiveness of tourism management.", "lo": true}, {"id": "Q2.1.r", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Venturer-type tourists are more beneficial than Dependable-type tourists for tourist destination regions.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — Venturers bring unique benefits to destination regions: Venturer-type tourists provide several distinctive benefits that Dependable-type tourists do not. Venturers travel to less-developed destinations in the exploration and involvement stages, bringing tourism income to regions that have not yet attracted mass tourism. Their willingness to explore off-the-beaten-track destinations helps distribute tourism benefits more broadly — beyond established mass tourism hotspots. Venturers spend money more readily and are more likely to engage directly with local businesses, homestays and community-based services rather than foreign-owned mass tourism operators, meaning more of their spending is retained in the local economy with less leakage. Partially disagree — Dependables generate greater scale and economic stability: However, Dependable-type tourists — who make up the large majority of the global tourism market — generate far greater absolute economic benefits at established destinations through sheer numbers. Destinations like Bali, Phuket and Paris receive tens of millions of Dependable-type mass tourists annually, generating billions of dollars in tourism receipts, millions of jobs and significant government tax revenues. While individual Dependables may spend more cautiously, their aggregate spending vastly exceeds that of the much smaller number of Venturers. Dependable tourists also provide economic stability through predictable, repeat visitation patterns that allow businesses to plan and invest with confidence. Partially disagree — Venturers can inadvertently trigger mass tourism development: While Venturers are often portrayed as environmentally sensitive, their role in 'discovering' new destinations can inadvertently trigger the development/consolidation cycle that eventually brings the mass tourism they sought to avoid. By documenting their experiences on social media and travel blogs, Venturers generate the awareness that attracts growing numbers of Dependables — as Iceland's viral Instagram transformation from 489,000 to 2.3 million visitors illustrates. Nuanced evaluation — context determines which type is more beneficial: The relative benefit of Venturer versus Dependable tourists ultimately depends on the specific destination and its stage in the Tourist Area Cycle. For a destination in the exploration or involvement stage — like Bhutan — Venturer-type high-value, low-volume tourism is clearly more sustainable. For a destination in the development or consolidation stage — like Bali — the large volumes of Dependable tourists are essential to the local economy. The statement's implication that one type is universally 'more beneficial' oversimplifies the complex interplay between tourist personality, destination characteristics and management quality. Conclusion: On balance, I partially agree that Venturer-type tourists can be more beneficial in specific contexts — particularly for fragile, early-stage destinations where their tendency towards authentic, community-based and lower-impact tourism produces more sustainable outcomes. However, at scale and for established destination economies, Dependable-type mass tourists generate greater absolute economic benefits. The most successful tourist destinations attract a healthy mix of both types.", "lo": true}, {"id": "Q2.1.s", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source M and your own knowledge, to what extent do you agree that limiting tourist numbers is the most effective way to ensure a destination remains attractive in the long run? Explain your answer.", "src": {"t": "quote", "lbl": "Source M", "cap": "Remarks by a tourism policy consultant", "credit": "Adapted from a tourism policy consultation address, 2022", "info": "Key claims: Maximising arrivals is not the same as maximising long-term benefit — \"growth is always good\" is a misconception in tourism management. | Bhutan, Galápagos and Swiss Alps succeeded by setting strict limits and investing in environmental protection — not by maximising arrivals. | The race to mass tourism (cheaper, more, faster) is \"a race no destination can win\" — quality and limits outlast volume strategies. Consider: Is limiting tourist numbers always the most effective approach? Co", "text": "The biggest misconception in tourism management is that growth is always good. Every tourism minister wants more arrivals, more receipts, more jobs. But the evidence from destinations around the world tells a very different story. The places that have succeeded in the long run — Bhutan, the Galápagos Islands, the Swiss Alps — are precisely those that resisted the temptation to maximise short-term arrivals and instead set strict limits, maintained high quality standards and invested in environmental protection. They have lasting appeal because they refused to sacrifice what made them special. The race to the bottom in mass tourism — cheaper, more, faster — is a race no destination can win.\" Tourism policy consultant Tourism policy consultation address, 2022"}, "ans": "Agree — visitor limits protect carrying capacity and long-term appeal: Source M makes a compelling case that the most successful long-term destinations — Bhutan, the Galapagos, the Swiss Alps — resisted maximising short-term arrivals. Bhutan's deliberate policy of limiting tourist arrivals to ~145,000 per year through a high daily fee has protected its extraordinary cultural and natural landscape from the overcrowding and commodification that has damaged many other Asian destinations. Maya Bay's recovery after a complete closure demonstrates that strict visitor limits — 375 people per day after reopening — can successfully restore and maintain a destination's primary appeal. Partially disagree — limits alone are insufficient; active management and reinvestment are also needed: However, visitor limits alone do not guarantee long-term attractiveness. The Swiss Alps and Galapagos cited in Source M succeed not only because they limit numbers but because they combine limits with strict environmental protection, high-quality tourism infrastructure and continuous product development. Singapore's Sentosa Island — which receives ~30 million visits per year — has maintained its attractiveness through continuous active reinvestment, not through visitor limits. This suggests that proactive management and investment can be equally or more effective than limits alone for destinations with larger carrying capacities. Conclusion: On balance, I agree that managing tourist numbers relative to carrying capacity is essential for long-term destination attractiveness — particularly for fragile natural or cultural environments. However, visitor limits are most effective when combined with environmental protection, high standards of tourist experience and continuous reinvestment in destination quality. For some destinations with greater carrying capacity, active management and reinvestment may be more appropriate than strict limits.", "lo": true}, {"id": "Q2.1.t", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Improvements in mobility — particularly the growth of aviation — have been the most important factor in the growth of international tourism since 1950.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — aviation has been the single most transformative enabler of international tourism growth: The growth of aviation since the 1950s has been the most direct and powerful enabler of international tourism growth. A London-New York return flight fell from approximately 70% of the average UK annual salary in 1952 to less than 1% by 2022 — making international long-haul travel accessible to ordinary working people for the first time. The introduction of wide-body aircraft in the 1970s (Boeing 747), industry deregulation from the 1980s, and the emergence of low-cost carriers like AirAsia and Ryanair from the 1990s collectively created a global aviation network of unprecedented coverage and affordability. The global commercial aircraft fleet grew from ~5,000 in 1970 to ~25,000 in 2022, enabling new international routes that connected previously inaccessible destinations. When air travel was virtually halted in 2020 during COVID-19, international tourist arrivals collapsed by 74% immediately — confirming that aviation is the arterial system of the global tourism economy. Partially disagree — growth in disposable incomes and ability to travel are equally fundamental: However, aviation's impact on mobility would have been largely irrelevant without the parallel growth in tourists' ability to travel — particularly the dramatic growth in global disposable incomes and paid vacation time. The global middle class grew from ~0.6 billion in 1970 to ~4.1 billion in 2022, giving billions more people the financial means to afford international travel. Countries that introduced mandatory paid vacation — in Europe, Japan and increasingly in Asia — gave their populations the time as well as the money needed to travel internationally. Without this growth in income and leisure time, cheaper and more accessible aviation would simply have reduced the cost of something most people still could not afford. Partially disagree — motivation to travel and business innovations are also significant: The motivation to travel — individuals' growing desire for relaxation, self-fulfilment and unique travel experiences — cannot be reduced to a mere by-product of mobility and income. The transformation of tourism from an elite privilege to a mass aspiration reflects deep social changes: rising education levels that created interest in different cultures; social media that generated travel aspirations through shared experiences; and a post-war global culture that increasingly valued exploration. Business innovations — online booking platforms, budget accommodation services like Airbnb, travel review sites like TripAdvisor — further amplified motivation and ability by dramatically reducing the information and transaction costs of international travel planning. Nuanced evaluation — all three factors are mutually reinforcing: The growth of international tourism since 1950 is best understood as the product of three mutually reinforcing factors — motivation, ability and mobility — operating simultaneously rather than any single dominant cause. Aviation improvements created the possibility of affordable international travel; growth in disposable incomes and paid vacation created the financial and temporal ability to take advantage of that possibility; and growing motivation to seek new experiences created the demand that drove both aviation expansion and income growth. Conclusion: On balance, I agree that aviation — as the primary driver of improved mobility — has been the single most important enabling factor in international tourism growth, in that without affordable air travel, the international dimension of tourism could not have reached its current scale regardless of income growth or motivation. However, the dramatic growth of international tourism since 1950 is a genuinely multi-causal phenomenon — aviation enabled it, but rising incomes, paid vacation and growing motivation created the demand that made aviation expansion worthwhile.", "lo": true}], "2.2": [{"id": "Q2.2.a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by \"economic leakage\" in the context of tourism?", "src": null, "ans": "Economic leakage occurs when revenue generated by tourism in the destination region is lost to the economies of other countries — for example, when tourist businesses pay for imported goods and services, or when profits are repatriated by foreign-owned tourism companies. (1 mark)", "lo": false}, {"id": "Q2.2.b", "ao": "AO1", "marks": 1, "cmd": "State", "text": "State one positive economic impact and one negative economic impact of tourism on destination regions.", "src": null, "ans": "Positive: Tourism creates employment opportunities in formal and informal tourism sectors, reducing unemployment and generating income for local residents. (½ mark) Negative: Economic leakage reduces the actual tourism revenue retained in the local economy, as money flows out to foreign-owned businesses or imported goods. (½ mark) *Both required for 1 mark.*", "lo": false}, {"id": "Q2.2.c", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two ways in which globalisation has influenced trends in international tourism.", "src": null, "ans": "Globalisation has increased the ability to travel by enabling people to search for and buy tourism-related services from anywhere, creating greater competition among businesses and more affordable travel options. (1 mark) Globalisation has increased tourists' motivation to travel by giving people greater access to information about tourism destinations and experiences through new online media and social media, stimulating desire to visit places they previously had no knowledge of. (1 mark)", "lo": false}, {"id": "Q2.2.d", "ao": "AO1", "marks": 2, "cmd": "Identify", "text": "Identify two negative social impacts of tourism on destination regions.", "src": null, "ans": "Commodification of traditional cultural practices and art forms — as demand for heritage tourism increases, traditions may be exaggerated, staged or mass-produced for tourists, losing their authenticity and cultural value. (1 mark) Cultural clashes — differences in values, beliefs and behaviours between tourists and local communities can create hostility, discomfort and conflict, particularly when tourists fail to respect local customs and norms. (1 mark)", "lo": false}, {"id": "Q2.2.e", "ao": "AO1", "marks": 3, "cmd": "State", "text": "State three ways in which tourism can cause negative environmental impacts on destination regions.", "src": null, "ans": "Greenhouse gas emissions from aviation and other transport used by tourists contribute to air pollution and climate change. (1 mark) Inadequate sewage facilities or improper waste disposal at tourist destinations pollutes water bodies and soils, harming aquatic and terrestrial ecosystems. (1 mark) Construction of hotels, resorts and tourist facilities encroaches on natural habitats, depletes natural resources such as timber and freshwater, and threatens wildlife habitats and biodiversity. (1 mark)", "lo": false}, {"id": "Q2.2.f", "ao": "AO2", "marks": 3, "cmd": "Describe", "text": "Using Source A, describe how globalisation has led to greater diversity in both tourist generating and destination regions, and explain one trend in the changing demand for tourism.", "src": {"t": "table", "lbl": "Source A", "cap": "Trends in international tourism — diversity of generating and destination regions", "credit": "Adapted from UNWTO World Tourism Barometer, 2023", "info": "Key driver: Globalisation has diversified both generating regions (new middle classes in Asia) and destination regions (Asia Pacific, Middle East), while social media has popularised \"second cities\" and niche tourism experiences.", "hdr": ["Trend", "Evidence", "Example"], "rows": [["Diverse generating regions", "China: US$255bn outbound spending (2019) vs US$10bn (2000)", "Rapid middle-class growth in China, India, Brazil, South Korea"], ["Diverse destination regions", "Asia Pacific share: 16% (2000) → 25% (2019) of world arrivals", "Thailand, Japan, Vietnam, UAE emerging as major destinations"], ["Second cities popularity", "Porto, Portugal: +110% visitors between 2013 and 2019", "Porto, Medellín (Colombia), Tbilisi (Georgia) gaining global appeal"], ["New tourism experiences", "Medical tourism: ~US$100 billion globally by 2022", "Adventure, heritage, sports, wellness and medical tourism all growing"]]}, "ans": "Source A shows that tourist generating regions have become far more diverse — China grew from spending just US$10 billion on outbound tourism in 2000 to US$255 billion in 2019, reflecting the rapid growth of a wealthy middle class in China and other rapidly developing countries like India and Brazil. Globalisation has reduced barriers to international travel by improving transport connections and enabling online booking, transforming these newly wealthy populations into major sources of international tourist flows. (1 mark) Source A also shows that destination regions have become more diverse — Asia Pacific's share of world tourist arrivals rose from 16% in 2000 to 25% in 2019, with Thailand, Japan, Vietnam and the UAE emerging as major global destinations. Globalisation has increased tourists' awareness of and access to a far wider range of destinations, fuelled by social media content and online travel platforms that make previously little-known places instantly accessible. (1 mark) Source A illustrates the growing popularity of \"second cities\" as a trend in changing tourism demand — visitors to Porto, Portugal grew by 110% between 2013 and 2019. As major cities become crowded and expensive, tourists are increasingly seeking authentic, less commercialised experiences in smaller cities. Social media platforms have been particularly important in driving this trend by showcasing the charm and uniqueness of lesser-known urban destinations to global audiences. (1 mark)", "lo": false}, {"id": "Q2.2.g", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source B and your own knowledge, explain how changing demand and changing supply have transformed international tourism in recent years.", "src": {"t": "quote", "lbl": "Source B", "cap": "Changing demand and supply in international tourism", "credit": "Adapted from UNWTO and World Travel and Tourism Council, 2022", "info": "", "text": "\"The tourism industry is undergoing rapid transformation in both demand and supply. On the demand side, tourists are increasingly seeking unique, personalised and authentic experiences rather than the standardised packages of mass tourism — driving the emergence of adventure tourism, heritage tourism, sports tourism, wellness tourism and medical tourism. On the supply side, traditional travel agencies and print brochures have been largely replaced by online booking platforms such as Booking.com, Expedia and Airbnb. Social media platforms — particularly Instagram and TikTok — have become the most powerful tools for tourism marketing, with a single viral post capable of transforming an obscure destination into a global must-visit overnight. Small specialist tour operators have carved out pro"}, "ans": "Source B shows that demand for tourism has shifted from standardised mass market packages towards unique, personalised and authentic experiences — driving growth in adventure, heritage, sports, wellness and medical tourism. This shift reflects changes in tourist motivation: tourists are increasingly seeking self-fulfilment, personal discovery and differentiated experiences rather than the predictable comfort of conventional package holidays. (1 mark) Source B explains that the supply of tourism has been transformed by technology — traditional travel agencies and print brochures have been largely replaced by online booking platforms such as Booking.com, Expedia and Airbnb, which give tourists direct access to accommodation and experiences globally. This disintermediation has dramatically reduced the cost and complexity of travel planning, enabling independent tourism to grow rapidly. (1 mark) Source B highlights the transformative power of social media — particularly Instagram and TikTok — as tourism marketing tools. A single viral post can transform an obscure destination into a global must-visit overnight, as demonstrated by Iceland's rapid growth from 489,000 to 2.3 million visitors between 2010 and 2018, driven largely by viral photography of its dramatic landscapes. This represents a fundamental shift in tourism marketing from top-down advertising by mass market operators to peer-to-peer content created by individual tourists. (1 mark) Source B also notes that small specialist tour operators have carved out profitable niches by offering deeply tailored experiences that mass market operators cannot replicate. This reflects the broader trend of supply diversification — the tourism market now supports a much wider spectrum of operators, from global online travel agencies to boutique specialists offering highly personalised itineraries for small groups, creating opportunities for local entrepreneurs to compete with large foreign-owned operators. (1 mark)", "lo": false}, {"id": "Q2.2.h", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source C and your own knowledge, explain the positive economic impacts of tourism for both tourist generating and destination regions.", "src": {"t": "table", "lbl": "Source C", "cap": "Positive economic impacts of tourism — global employment and GDP data", "credit": "Adapted from World Travel and Tourism Council and ILO, 2022", "info": "", "hdr": ["Economic indicator", "Global data (2019)", "Generating regions", "Destination regions"], "rows": [["Direct employment", "330 million jobs (10% of global workforce)", "Airlines, travel agents, tour operators", "Hotels, restaurants, guides, local transport"], ["New jobs (2015–2019)", "25% of all new global jobs", "Airline crew, booking platform staff", "Local guides, artisans, drivers, vendors"], ["Employment type", "Mix of formal and informal", "Predominantly formal (contracts, benefits)", "Significant informal sector (no contracts)"], ["Tourism % of GDP", "~10% of global GDP", "~5–6% in developed countries", "Up to 20–28% in tourism-dependent countries"]]}, "ans": "Source C shows that tourism created 330 million direct jobs globally in 2019 — approximately 10% of the global workforce — demonstrating that tourism is one of the world's most important sources of employment. The labour-intensive nature of tourism means it creates employment across a wide range of skill levels, from hotel receptionists and airline crew to street vendors and tour guides, providing income opportunities for people of varying educational backgrounds. (1 mark) Source C shows that between 2015 and 2019, approximately 25% of all new global jobs were created by the tourism industry. In destination regions, this includes both formal employment (hotel staff with written contracts and benefits) and significant informal sector employment (street-side vendors, independent guides, artisans), all of whom benefit from tourist spending. (1 mark) Tourism generating regions also experience positive economic impacts — as Source C shows, tourism contributes ~5-6% of GDP in developed countries, supporting airline industries, travel agencies, online booking platforms and tour operators. When tourists spend money on flights, travel insurance and pre-trip shopping, significant economic activity is generated in their home generating regions before they even arrive at their destination. (1 mark) The income generated from tourists' spending on consumer goods and services in destination regions is particularly significant — Source C shows tourism can contribute up to 20-28% of GDP in heavily tourism-dependent countries like the Maldives and Thailand. When tourists spend money on accommodation, food, transport and leisure activities, this income flows through the local economy, allowing governments to invest in infrastructure, healthcare and education, raising standards of living. Tourism revenue also enabled the Maldives to transform from one of the world's poorest countries in the 1980s to a middle-income economy today. (1 mark)", "lo": false}, {"id": "Q2.2.i", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source D and your own knowledge, explain how economic leakage reduces the benefit of tourism for destination regions and why overdependence on tourism creates vulnerability.", "src": {"t": "quote", "lbl": "Source D", "cap": "Economic leakage and tourism vulnerability", "credit": "Adapted from UNEP, World Bank and academic literature, 2022", "info": "Leakage causes: Importing food/beverages/equipment from overseas; foreign-owned hotels repatriating profits; skilled workers sourced from abroad. Leakage is highest in small island economies that must import almost everything.", "text": "\"Economic leakage is one of the most significant but least visible costs of mass tourism in developing countries. According to the United Nations Environment Programme, for every US$100 spent by a tourist on a holiday to a developing country, only US$5 remains in the local host community — meaning 95% leaks out of the local economy. Leakages occur when tourism businesses import food, beverages and equipment from overseas; when foreign-owned hotels and tour operators repatriate profits; and when skilled workers are brought in from abroad rather than training local staff. In some developing countries, leakages can be so significant that they wipe out most of the economic benefits of tourism, leaving local communities with environmental degradation and social disruption but little of the prom"}, "ans": "Source D reveals the shocking scale of economic leakage — for every US$100 spent by a tourist in a developing country, only US$5 remains in the local host community, meaning 95% leaks out. This occurs through multiple channels: tourism businesses importing food, beverages and equipment from overseas; foreign-owned hotels and tour operators repatriating profits; and skilled workers being brought from abroad rather than trained locally. Each of these leakage pathways removes money that could otherwise circulate through the local economy, multiplying income and employment benefits for local communities. (1 mark) Source D explains that leakages are particularly severe in small island tourism economies like the Maldives, where almost all food, fuel and building materials must be imported. The paradox is that the most tourism-dependent economies often face the highest leakage rates, because their small size and limited industrial capacity mean they cannot produce the goods that tourist facilities require, forcing heavy dependence on imports that drain revenue offshore. (1 mark) Overdependence on tourism creates acute economic vulnerability because a sudden fall in tourist numbers — due to natural disasters, political instability, disease outbreaks or global economic downturns — can instantly devastate the livelihoods of workers who have no alternative income sources. Source D notes that in some developing countries, leakages can wipe out most economic benefits, meaning communities face environmental degradation and social disruption without accumulating the reserves needed to withstand tourism shocks. (1 mark) The COVID-19 pandemic demonstrated this vulnerability on a global scale — Thailand's tourist arrivals fell from 39.8 million in 2019 to just 6.7 million in 2020, threatening the livelihoods of the 18% of the Thai workforce employed in tourism. Countries that had diversified their economies — like France, where tourism contributes only ~7% of GDP — were far more resilient to this shock, demonstrating why economic overdependence on tourism is a significant negative impact that policy-makers must actively manage. (1 mark)", "lo": false}, {"id": "Q2.2.j", "ao": "AO
