on people worldwide rely on seafood as their primary source of protein. (1 mark)", "lo": false}, {"id": "Q3.2.m", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source H and your own knowledge, explain how changes in extreme weather due to climate change threaten flora and fauna in terrestrial ecosystems.", "src": {"t": "quote", "lbl": "Source H", "cap": "Text extract — Adapted from IPCC Sixth Assessment Report and case study records, 2022 (verify)", "text": "\"Climate change is increasingly disrupting terrestrial ecosystems through changes in extreme weather."}, "ans": "Source H shows that excessive rainfall caused by climate change can directly kill terrestrial wildlife — floods in Assam, India in 2020 killed more than 200 wild animals including eight endangered one-horned rhinoceroses. Intense flooding destroys habitats and causes terrestrial species to drown, directly reducing biodiversity and threatening vulnerable species with extinction. (1 mark) The California drought example in Source H (2012-2016) demonstrates how droughts reduce the availability of water, food and habitat for terrestrial species. As wetlands dried up, insects, fish and plants died, causing a cascade of starvation up the food chain — migratory birds lost their food source and starved to death, illustrating how drought impacts spread through entire food webs. (1 mark) Source H also highlights how climate change-induced droughts facilitate the spread of disease — thousands of ducks and geese crowding into the remaining California wetlands led to the rapid spread of cholera. Warmer and drier conditions created by climate change also favour diseases like botulism, which thrive in warm, stagnant water — directly threatening wildlife populations. (1 mark) Extreme weather events such as those described in Source H threaten biodiversity by forcing animal species to move to new locations in search of water, food and habitat. When species are forced to relocate, they may encounter unfamiliar predators, competitors or pathogens. Over time, repeated extreme weather events can reduce population sizes to the point where species become locally extinct or globally endangered — as highlighted by the deaths of endangered rhinoceroses in Source H. (1 mark)", "lo": false}, {"id": "Q3.2.n", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source I and your own knowledge, explain why the impacts of climate change on human systems are geographically uneven.", "src": {"t": "table", "lbl": "Source I", "cap": "Geographically uneven impacts of climate change on human systems", "credit": "Adapted from IPCC, WHO and World Bank reports, 2022", "info": "", "hdr": ["Impact type", "How climate change causes it", "Example of geographically uneven impact"], "rows": [["Food insecurity", "Rising temperatures and changing rainfall reduce crop yields; extreme weather destroys harvests", "Sub-Saharan Africa and South Asia face greater food insecurity than Europe due to higher temperatures and more variable rainfall"], ["Disease spread", "Warmer and wetter conditions expand range of disease vectors (mosquitoes)", "Dengue spreading to higher altitudes and latitudes; ~390 million infections annually — predominantly in tropical developing countries"], ["Coastal flooding", "Sea-level rise and more intense cyclones threaten low-lying coastal areas", "Small island states (Maldives, Tuvalu) and delta cities (Bangladesh, Vietnam) at highest risk — existential threat"], ["Economic losses", "Damage to infrastructure, agriculture and tourism from extreme weather", "Developing countries lose a disproportionately larger share of GDP to climate disasters than developed countries"], ["Ecosystem service loss", "Melting Arctic ice; degradation of natural landscapes", "Arctic indigenous cultures dependent on sea ice face existential cultural threats; Arctic tourism severely impacted"]]}, "ans": "Source I shows that food insecurity caused by climate change is geographically uneven — Sub-Saharan Africa and South Asia face greater food insecurity than Europe because they experience higher temperatures, more variable rainfall and weaker capacity to adapt through irrigation and agricultural technology. Communities in these regions are more dependent on rain-fed agriculture and have fewer financial resources to cope with crop failures. (1 mark) Source I demonstrates that the spread of vector-borne diseases like dengue is geographically uneven — warmer and wetter conditions are expanding the range of mosquitoes to higher altitudes and latitudes. Communities in tropical and subtropical regions such as Southeast Asia and Sub-Saharan Africa face a disproportionately higher burden of dengue and malaria, while temperate regions experience these threats only as temperatures increase. (1 mark) The risk of coastal flooding shown in Source I is geographically concentrated in small island developing states such as the Maldives and Tuvalu, and delta cities such as Bangladesh and Vietnam — these low-lying areas face an existential threat from sea-level rise and more intense cyclones, while higher-elevation or better-protected regions face far lower risks. (1 mark) Source I also shows that economic losses from climate-related disasters are geographically uneven — developing countries lose a disproportionately larger share of their GDP to climate disasters than developed countries. This reflects differences in infrastructure quality, disaster preparedness, financial reserves and insurance coverage. Developed countries can more effectively buffer the economic shock of extreme weather events, while developing nations face greater vulnerability due to weaker adaptive capacity. (1 mark)", "lo": false}, {"id": "Q3.2.o", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source J and your own knowledge, explain the direct and indirect impacts of climate change on human systems.", "src": {"t": "chart", "lbl": "Source J", "cap": "Frequency and intensity of selected extreme weather events — 1980–2000 vs 2001–2022", "credit": "Adapted from insurance industry records, NOAA and IPCC, 2022", "info": "", "chartCfg": "{type:'bar',data:{labels:['Heat waves\\n(major events)','Cat. 4–5 cyclones\\n(annual)','Major flood events\\n(annual)'],datasets:[{label:'1980–2000',data:[6,28,68],backgroundColor:'#185FA5',borderWidth:0,borderRadius:3,barThickness:45},{label:'2001–2022',data:[14,38,152],backgroundColor:'#E24B4A',borderWidth:0,borderRadius:3,barThickness:45}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.parsed.y+' events/year'}}},scales:{x:{ticks:{autoSkip:false,font:{size:11},color:'#888780',maxRotation:0},grid:{display:false},border:{display:false}},y:{beginAtZero:true,max:180,ticks:{stepSize:30,font:{size:11},color:'#888780'},grid:{color:'rgba(136,135,128,0.12)'},border:{display:false},title:{display:true,text:'Avg annual events',font:{size:11},color:'#888780'}}}}}", "chartId": "chart_3_2_J_Q3.2.o"}, "ans": "Source J shows that the frequency of major heat waves has increased by 133% between 1980-2000 and 2001-2022. Directly, heat waves cause heat stress, heat stroke and death — particularly among elderly people, outdoor workers and those without access to air conditioning. Economic productivity also declines as workers are unable to work safely in extreme heat, while energy demand for cooling surges. (1 mark) Source J shows that major flood events have increased by 124% in frequency. Directly, flooding causes loss of life, displacement of communities and destruction of homes, transport infrastructure and livelihoods. Indirectly, flooding contaminates water supplies and agricultural land, destroying crops and threatening food security — provisioning ecosystem services are severely disrupted when farmland is submerged and irrigation systems are damaged. (1 mark) Source J shows that severe tropical cyclones (Category 4-5) have increased by 36%. Directly, stronger cyclones bring more destructive winds and heavier rainfall that destroy crops and infrastructure — as demonstrated by Typhoon Goni in the Philippines (2020), which caused nearly one million evacuations and $36 million in crop damage. Indirectly, cyclone damage reduces agricultural output and disrupts food production systems, creating food insecurity that outlasts the storm itself. (1 mark) The increase in large-scale wildfires shown in Source J by approximately 50% has both direct and indirect impacts. Directly, wildfires destroy homes, displace communities and cause deaths from burns and smoke inhalation. Indirectly, wildfire smoke causes serious respiratory health impacts and destroys natural landscapes that provide cultural ecosystem services such as recreation, tourism and spiritual value for indigenous communities. (1 mark) Beyond individual extreme weather events, the cumulative indirect impact of increasing climate change on human systems is a shift in disease patterns — regulating ecosystem services are disrupted as warmer, wetter conditions caused by climate change expand the range of disease vectors such as mosquitoes. The melting of Arctic ice alters cultural ecosystem services — threatening Arctic indigenous cultures, shipping routes and the natural landscapes that millions of tourists visit annually. These indirect impacts demonstrate how the impacts of climate change cascade from natural systems through to human systems. (1 mark)", "lo": false}, {"id": "Q3.2.p", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source K and your own knowledge, to what extent do you agree that anthropogenic factors are more important than natural factors in causing current climate change? Explain your answer.", "src": {"t": "quote", "lbl": "Source K", "cap": "Commentary by a climate scientist", "credit": "Adapted from a climate science commentary, 2022", "info": "Key claims: The rate, scale and direction of current change is unlike anything in the 800,000-year palaeoclimate record. | Human activities have produced more than 100× more CO₂ than natural causes in the last 30 years. | Natural variability alone \"cannot explain\" the rapid, sustained warming observed since the mid-20th century. Consider: Do natural factors play any role? What evidence supports or challenges the scientist's view?", "text": "The distinction between natural climate variability and anthropogenic climate change is not simply academic — it is the most consequential scientific question of our time. Earth's climate has always changed, and natural factors have driven those changes for billions of years. But the rate, scale and direction of current climate change is unlike anything recorded in human history or in the palaeoclimate record of the past 800,000 years. In the last 30 years, human activities have produced more than 100 times more carbon dioxide than natural causes. The science is unambiguous: natural variability cannot explain what we are seeing.\" Climate scientist Climate science commentary, 2022"}, "ans": "Agree — anthropogenic factors dominate current climate change: Source K presents a compelling argument that the current rate, scale and direction of climate change is 'unlike anything recorded in human history.' In the last 30 years, human activities have produced more than 100 times more CO2 than natural causes. The burning of fossil fuels produces approximately 35 billion tonnes of CO2 per year, while changing land use contributes a further 20% of annual GHG emissions through deforestation. The correlation between rising atmospheric CO2 (from ~317 ppm in 1960 to ~419 ppm in 2022) and rising global temperatures (+0.9°C above the 1951-1980 baseline by 2022) is strongly supported by scientific evidence. Partially agree — natural factors contribute but are secondary: Natural factors do contribute to climate variability — Milankovitch cycles have driven glacial and interglacial periods over hundreds of thousands of years, and the 1991 Mount Pinatubo eruption temporarily cooled global temperatures by approximately 0.5°C. However, Milankovitch cycles operate over timescales of tens of thousands of years — not the decades over which current warming has accelerated. Volcanic cooling is temporary and episodic. Solar output has not increased significantly since the mid-20th century. None of these natural factors can produce the sustained, accelerating warming trend seen in the modern temperature record. Conclusion: On balance, I strongly agree that anthropogenic factors are overwhelmingly more important than natural factors in causing current climate change. Source K's conclusion that 'natural variability cannot explain what we are seeing' is supported by the scientific consensus. Natural variability is real and important over geological timescales, but in the context of the last 150 years, it is a secondary contributor to a warming trend that is fundamentally driven by human activities.", "lo": true}, {"id": "Q3.2.q", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"The impacts of climate change on natural systems are more severe than its impacts on human systems.\" Do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — natural systems face irreversible and catastrophic impacts: Source L shows multiple indicators of severe and accelerating change in natural systems. Arctic sea ice has declined by 13% per decade since 1979, shrinking from approximately 7 million km2 to 4.7 million km2. This threatens polar ecosystems and species such as polar bears that depend on sea ice. Ocean acidification has increased by 25% since the Industrial Revolution, dissolving the calcium carbonate that corals, mussels and oysters need, threatening the reef ecosystems that support approximately 25% of all marine species. Coral reefs are expected to decline by up to 90% if temperatures increase by 1.5°C. Droughts in California (2012-2016) destroyed wetland ecosystems, while floods in Assam, India (2020) killed over 200 wild animals including endangered rhinoceroses. These are potentially irreversible changes on human timescales. Disagree — human systems face equally severe and more immediately destructive impacts: However, Source L also points to impacts on human systems that are extremely severe. The 400% increase in the frequency of extreme heat events relative to the 1950-1970 baseline has caused tens of thousands of human deaths — the 2003 European heat wave alone killed approximately 70,000 people. Sea level rise of +20 cm above the 1900 baseline, accelerating at 3.7 mm/year, threatens the existence of small island states such as the Maldives and Tuvalu, as well as hundreds of millions of people in coastal delta cities. More intense tropical cyclones have caused catastrophic human displacement — Typhoon Goni (2020) evacuated nearly one million people in the Philippines. Nuanced evaluation — impacts on natural and human systems are deeply interconnected: Source L's data reveals that natural and human system impacts are inseparable. Rising CO2 concentrations and global warming simultaneously threaten coral reef ecosystems and human coastal communities. Ocean acidification disrupts marine food webs, indirectly threatening the food security of the approximately 3 billion people who depend on seafood as their primary protein source. Arctic sea ice loss threatens both polar ecosystems and the indigenous communities whose cultures and livelihoods depend on sea ice for hunting and travel. The loss of natural systems cascades directly into human vulnerability. Conclusion: On balance, I do not agree that climate change impacts on natural systems are simply 'more severe' than impacts on human systems — both categories of impact are severe, interconnected and mutually reinforcing. Natural systems face potentially irreversible losses, particularly in coral reef ecosystems and polar environments. Human systems face immediate and devastating impacts from extreme weather events, sea-level rise and food insecurity. The most accurate characterisation is that climate change poses an existential threat to both natural and human systems simultaneously, and addressing these impacts requires urgent, integrated action that protects both.", "lo": true}, {"id": "Q3.2.r", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Burning of fossil fuels is more responsible for the enhanced greenhouse effect than changing land use.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — burning of fossil fuels is the dominant contributor: The burning of fossil fuels is the single largest source of greenhouse gas emissions globally. Coal, oil and natural gas have extremely high carbon content — when burned to generate energy for vehicles, power stations and industrial machinery, they produce approximately 35 billion tonnes of CO2 per year. The use of fossil fuels increased steeply since the start of the Industrial Revolution in the 1880s, and industries alone contribute approximately 43% of GHG emissions from energy use. Urbanisation compounds this — cities consume approximately 78% of the world's energy, predominantly from fossil fuels. The scale and global ubiquity of fossil fuel burning dwarfs the contribution of any single land use change in terms of total CO2 output. Partially disagree — changing land use is a highly significant contributor: However, changing land use contributes approximately 20% of annual GHG emissions through deforestation alone, making it a very substantial secondary contributor. Tropical deforestation is particularly significant — clearing and burning forests both releases stored carbon directly as CO2 and permanently removes the carbon sink function of the forest. Agriculture — itself a form of land use change — contributes approximately 30% of annual GHG emissions through methane from livestock rearing and paddy rice farming, and nitrous oxide from chemical fertilisers. Together, deforestation and agriculture contribute approximately 50% of annual GHG emissions, making changing land use collectively a more significant contributor than fossil fuels alone when viewed in aggregate. Nuanced evaluation — the two sources are interconnected: The distinction between fossil fuel burning and land use change is not always clear-cut. Deforestation is often driven by the need for land to produce food for a growing population — which is itself partly driven by the industrialisation and urbanisation that also burns fossil fuels. Clearing forests for agriculture uses fossil-fuel-powered machinery. The growing demand for biofuels as an alternative to fossil fuels has itself driven deforestation in tropical regions. The two sources of the enhanced greenhouse effect are therefore deeply interconnected. Conclusion: On balance, I agree that burning of fossil fuels is the single largest individual contributor to the enhanced greenhouse effect — no other single activity produces as much CO2 per year. However, I do not agree that changing land use is therefore insignificant. Deforestation and agriculture collectively contribute approximately 50% of annual GHG emissions. An effective response to the enhanced greenhouse effect must address both fossil fuel combustion and changing land use simultaneously, as tackling one without the other would leave a very substantial portion of emissions unaddressed.", "lo": true}, {"id": "Q3.2.s", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "Using Source M and your own knowledge, to what extent do you agree that the impacts of climate change on human systems are geographically uneven and represent a social justice challenge? Explain your answer.", "src": {"t": "quote", "lbl": "Source M", "cap": "Remarks by a delegate at COP27, Sharm el-Sheikh, Egypt, 2022", "credit": "Adapted from COP27 delegate remarks, Egypt, 2022", "info": "Key claims: Delay in climate action causes deepening, harder-to-reverse damage to natural systems. | Developing nations — who contributed least — suffer most from climate change impacts. | Climate change is framed as a social justice issue, not merely an environmental one. Consider: Are climate impacts truly geographically uneven? Do developed nations also face severe impacts? What evidence supports the social justice argument?", "text": "The data does not lie. Every year we delay action on climate change, the damage to our natural systems deepens and becomes harder to reverse. Coral reefs are bleaching. Arctic ice is melting. Extreme weather events are becoming the new normal. And it is not the wealthiest nations who are paying the highest price — it is the communities in the developing world who have contributed least to the problem but who suffer most from its consequences. Climate change is not just an environmental issue. It is the defining social justice issue of our generation.\" Delegate, COP27 UN Climate Conference, Sharm el-Sheikh, Egypt, November 2022"}, "ans": "Agree — climate impacts are profoundly geographically uneven: Source M powerfully articulates the injustice at the heart of climate change: 'it is the communities in the developing world who have contributed least to the problem but who suffer most.' Small island developing states such as the Maldives and Tuvalu face existential threat from sea-level rise, despite contributing negligibly to global emissions. Sub-Saharan Africa and South Asia face greater food insecurity from climate change than Europe or North America, despite historically lower per-capita emissions. Source L showed that developing countries lose a disproportionately larger share of GDP to climate disasters than developed countries, reflecting their weaker infrastructure, lower adaptive capacity and fewer financial resources. Agree — the social justice dimension is real and significant: The social justice dimension identified in Source M is reinforced by examining who bears the burden of climate change's indirect impacts. Vector-borne diseases such as dengue and malaria are expanding into new regions as temperatures rise, predominantly affecting tropical and subtropical developing countries. Climate-driven food insecurity disproportionately affects communities in Sub-Saharan Africa and South Asia who depend on rain-fed agriculture with limited technological buffers. These communities face the indirect impacts of climate change cascading from disrupted natural systems to their food security, water supply and health — impacts that wealthy nations can largely offset through technology, insurance and government intervention. Partially disagree — developed countries also face severe impacts: However, it would be inaccurate to suggest that developed countries are immune to climate change's human impacts. The 2003 European heat wave killed approximately 70,000 people across wealthy nations. More intense and frequent wildfires have devastated communities in Australia and California. Rising sea levels threaten coastal cities in the Netherlands, the United Kingdom and the United States. While developed countries generally have greater adaptive capacity, their absolute exposure to some climate impacts — particularly from extreme heat and wildfire — is significant and growing. Nuanced evaluation — vulnerability determines severity of impact: The key insight from Source M and the evidence is that it is not simply geographic location that determines climate vulnerability — it is the interaction of exposure, social and economic factors, and adaptive capacity. A wealthy coastal city in the Netherlands has similar geographic exposure to sea-level rise as a coastal city in Bangladesh, but its capacity to respond with advanced flood defences and evacuation planning is vastly different. Addressing climate change's uneven human impacts therefore requires not only emissions reduction but also significant investment in the adaptive capacity of the most vulnerable communities. Conclusion: On balance, I strongly agree with Source M's assertion that climate change impacts on human systems are geographically uneven and represent a profound social justice challenge. The evidence consistently shows that developing nations — which have contributed least to greenhouse gas emissions — face the most severe and least manageable climate impacts. This fundamental injustice underscores the moral urgency of international climate action that not only reduces emissions but also provides financial and technical support to the most vulnerable communities to adapt to the changes that are now unavoidable.", "lo": true}, {"id": "Q3.2.t", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "\"Natural climate variability is sufficient to explain all observed changes in Earth's climate over the past 200 years.\" Do you agree with this statement? Explain your answer.", "src": null, "ans": "Disagree — natural variability cannot explain the rate and scale of recent change: The most fundamental challenge to this statement is the rate of change. Earth's climate has always varied naturally — Milankovitch cycles have driven glacial and interglacial periods, and volcanic eruptions have caused short-term temperature fluctuations. However, these natural processes operate over timescales of tens of thousands of years or produce temporary, episodic cooling — they do not produce sustained, accelerating warming over just 150 years. Atmospheric CO2 has risen from approximately 280 ppm before industrialisation to approximately 419 ppm in 2022 — a 50% increase at the fastest rate in at least 800,000 years, according to ice core records. This rate of change cannot be explained by orbital variations, which shift CO2 concentrations over tens of thousands of years, not centuries. Disagree — scientific evidence directly refutes natural-only explanations: Source K noted that in the last 30 years, human activities have produced more than 100 times more CO2 than natural causes. The IPCC Sixth Assessment Report (2021) concluded with 'unequivocal' scientific consensus that human influence has warmed the climate, and that the observed 1.1°C warming above pre-industrial levels cannot be reproduced by climate models using only natural forcings — it requires the inclusion of anthropogenic greenhouse gas emissions to match observations. Solar output has not increased significantly since the mid-20th century, and volcanic eruptions since the Industrial Revolution have if anything slightly reduced temperatures through aerosol cooling — neither supports a natural-only explanation for the sustained warming trend. Conclusion: I strongly disagree with the statement. Natural climate variability is a real and important driver of climate change over geological timescales, and it continues to contribute minor fluctuations to the modern climate record. However, it is wholly insufficient to explain the sustained, accelerating warming of the past 200 years — the most rapid climate shift in at least 800,000 years. The evidence overwhelmingly points to the enhanced greenhouse effect driven by anthropogenic emissions as the primary cause of observed climate change since industrialisation.", "lo": true}], "3.3": [{"id": "Q3.3.a", "ao": "AO1", "marks": 1, "cmd": "State", "text": "State the difference between mitigation strategies and adaptation strategies in responding to climate change.", "src": null, "ans": "Mitigation strategies are efforts to reduce greenhouse gas emissions and enhance carbon sinks to slow down climate change, while adaptation strategies are efforts to adjust to climate change and its effects in order to reduce harm to people, properties and the environment. (1 mark)", "lo": false}, {"id": "Q3.3.b", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by a \"carbon sink\"?", "src": null, "ans": "A carbon sink is any reservoir — natural or human — such as forests, oceans or mangroves, that absorbs and stores more carbon than it emits, reducing the amount of greenhouse gases in the atmosphere. (1 mark)", "lo": false}, {"id": "Q3.3.c", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two structural adaptation strategies used to manage the risk of flooding from climate change.", "src": null, "ans": "Seawalls — constructed along the coast to prevent the sea from advancing onto the land, protecting people, properties and environments from coastal flooding. (1 mark) Polders — low-lying land surrounded and protected by barriers known as dykes, with excess water pumped out to protect communities from sea-level rise and coastal flooding. (1 mark) *Accept any two of: seawalls / polders / water storage tanks / drains and canals.*", "lo": false}, {"id": "Q3.3.d", "ao": "AO1", "marks": 2, "cmd": "Identify", "text": "Identify two mitigation strategies that reduce greenhouse gas emissions.", "src": null, "ans": "International agreements and cooperation — such as the UNFCCC and COP agreements — that commit countries to reducing their greenhouse gas emissions collectively. (1 mark) Use of clean energy sources — such as solar, wind or hydroelectric power — to replace fossil fuels and reduce carbon dioxide emissions. (1 mark) *Accept any two of: international agreements / low-carbon technologies / clean energy sources / changes in consumption patterns.*", "lo": false}, {"id": "Q3.3.e", "ao": "AO1", "marks": 3, "cmd": "State", "text": "State three reasons why mitigation strategies may be limited in their effectiveness.", "src": null, "ans": "Technological challenges — some countries lack the technology or technical expertise to implement low-carbon technologies or clean energy infrastructure. (1 mark) Economic challenges — mitigation strategies such as renewable energy infrastructure and carbon capture technology can be very costly to implement, particularly for developing countries with limited funding. (1 mark) Social challenges — people may be unwilling to change their consumption patterns or behaviours, such as reducing meat consumption or using public transport instead of private vehicles. (1 mark)", "lo": false}, {"id": "Q3.3.f", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source A, explain how climate action needs differ across countries and why mitigation and adaptation strategies are complementary.", "src": {"t": "table", "lbl": "Source A", "cap": "GHG emissions, mitigation commitments and climate vulnerability — selected countries", "credit": "Adapted from UNFCCC and Climate Action Tracker, 2022", "info": "Key pattern: The largest emitters (China, USA) have the lowest vulnerability. The smallest emitters (Bangladesh, Singapore) have the highest vulnerability and invest more in adaptation relative to GDP. This illustrates the fundamental injustice of climate change — those who contributed least suffer ", "hdr": ["Country", "Annual GHG emissions", "Mitigation commitment (NDC)", "Adaptation investment", "Vulnerability"], "rows": [["China", "~14 billion t CO₂e/yr", "Peak before 2030; net zero by 2060", "~0.08% of GDP", "Moderate"], ["USA", "~6.3 billion t CO₂e/yr", "50–52% reduction below 2005 levels by 2030", "~0.14% of GDP", "Low–Moderate"], ["India", "~3.3 billion t CO₂e/yr", "45% reduction in emissions intensity by 2030", "~0.26% of GDP", "High"], ["Bangladesh", "~0.3 billion t CO₂e/yr", "22% conditional reduction by 2030", "~0.75% of GDP", "Very High"], ["Singapore", "~0.05 billion t CO₂e/yr", "Net zero by 2050", "~0.3% of GDP (est.)", "Moderate–High"]]}, "ans": "Source A shows that countries contribute very different amounts to global emissions — China emits ~14 billion tonnes CO2e per year compared to Bangladesh's ~0.3 billion tonnes. This demonstrates that the primary responsibility for mitigation falls on the world's largest emitters, while smaller contributors like Bangladesh contribute very little to the problem. (1 mark) Source A also shows that vulnerability is inversely related to emissions — Bangladesh, which emits only ~0.3 billion tonnes CO2e per year, has a \"Very High\" climate vulnerability index and invests ~0.75% of GDP in adaptation. By contrast, the USA has a \"Low-Moderate\" vulnerability index. This illustrates the fundamental injustice of climate change and explains why adaptation investment is disproportionately concentrated in smaller, more vulnerable countries. (1 mark) Mitigation and adaptation strategies are complementary because they address climate change at different timescales and from different directions. Mitigation strategies — like China's net zero by 2060 commitment and the USA's 50-52% emissions reduction target — slow down climate change and reduce the severity of future impacts. Adaptation strategies — like Bangladesh's 0.75% GDP investment — manage the impacts already occurring. Without mitigation, adaptation needs grow continuously; without adaptation, communities are left unprotected from already-inevitable changes. Both are necessary for climate resilience and sustainable development. (1 mark)", "lo": false}, {"id": "Q3.3.g", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source B and your own knowledge, explain why climate risks vary across places and what this means for how communities should respond to climate change.", "src": {"t": "note", "lbl": "Source B", "cap": "Text extract — Adapted from IPCC Sixth Assessment Report, 2022 (verify)", "text": "Text extract — Adapted from IPCC Sixth Assessment Report, 2022 (verify)"}, "ans": "Source B explains that climate risk is determined by the interaction of three factors: the climate-related hazard itself; the vulnerability of the community (its physical, social, economic and environmental conditions); and its exposure (the extent to which people and properties are located in hazard-prone areas). Two communities facing the same hazard can therefore experience very different levels of risk depending on their vulnerability and exposure. (1 mark) Source B illustrates this through the tropical cyclone example — a community with strong building codes, early warning systems, well-funded disaster response and healthcare systems suffers fewer casualties and economic losses than a community lacking these capacities. This demonstrates that vulnerability — shaped by economic development, governance quality and social safety nets — is as important as the hazard itself in determining climate risk. (1 mark) Geographically, developing countries generally face higher climate risks not because they experience more intense hazards, but because their vulnerability is higher — they have weaker infrastructure, fewer financial resources for recovery, less well-equipped healthcare systems and lower adaptive capacity. Bangladesh, for example, faces extreme flooding risk not only because of its low-lying delta geography (high exposure) but because its dense population and limited resources make adaptation extremely difficult (high vulnerability). (1 mark) Source B's conclusion that climate risk is 'as much a development challenge as it is an environmental one' has important implications for how communities respond. Effective climate action must address both the environmental dimension (reducing emissions and building physical flood defences) and the development dimension (reducing poverty, improving governance, strengthening healthcare and building institutional capacity). (1 mark)", "lo": false}, {"id": "Q3.3.h", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source C and your own knowledge, explain why climate risks vary across places and how this creates challenges for building community resilience.", "src": {"t": "chart", "lbl": "Source C", "cap": "Climate vulnerability index vs annual per capita income — selected countries, 2022", "credit": "Adapted from ND-GAIN Country Index and World Bank, 2022", "info": "Key pattern: Clear inverse relationship — the most vulnerable countries are poorest. Bangladesh (most vulnerable, $2,500/yr) vs Norway (least vulnerable, $89,000/yr).", "chartCfg": "{\n  type:'bar',\n  data:{\n    labels:countries,\n    datasets:[\n      {label:'Vulnerability index',data:vuln,backgroundColor:barColors,borderWidth:0,borderRadius:3,yAxisID:'y-vuln',order:1},\n      {type:'line',label:'Per capita income ($000s)',data:income,borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0)',borderWidth:2.5,pointRadius:5,pointBackgroundColor:'#185FA5',pointBorderColor:'#fff',pointBorderWidth:2,tension:0.2,yAxisID:'y-income',order:0}\n    ]\n  },\n  options:{\n    responsive:true,maintainAspectRatio:false,\n    plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.yAxisID==='y-vuln'?'Vulnerability: '+ctx.parsed.y.toFixed(2):'Income: $'+(ctx.parsed.y*1000).toLocaleString()}}},\n    scales:{\n      x:{ticks:{autoSkip:false,maxRotation:45,font:{size:10},color:'#888780'},grid:{display:false},border:{display:false}},\n      'y-vuln':{type:'linear',position:'left',min:0,max:0.7,ticks:{stepSize:0.1,font:{size:11},color:'#E24B4A',callback:v=>v.toFixed(1)},grid:{color:'rgba(226,75,74,0.08)'},border:{display:false},title:{display:true,text:'Vulnerability index (0–1)',font:{size:11},color:'#E24B4A'}},\n      'y-income':{type:'linear',position:'right',min:0,max:100,ticks:{stepSize:20,font:{size:11},color:'#185FA5',callback:v=>'$'+v+'k'},grid:{display:false},border:{display:false},title:{display:true,text:'Per capita income ($000s)',font:{size:11},color:'#185FA5'}}\n    }\n  }\n}", "chartId": "chart_3_3_C_Q3.3.h"}, "ans": "Source C shows a clear inverse relationship between climate vulnerability and per capita income — Bangladesh, the most vulnerable country (score 0.54), has a per capita income of only ~$2,500/year, while Norway, the least vulnerable (score 0.18), has a per capita income of ~$89,000/year. This pattern reflects how economic development provides the resources needed to invest in adaptation infrastructure, early warning systems and social safety nets that reduce vulnerability. (1 mark) The vulnerability scores shown in Source C reflect not only physical exposure but also social and economic factors. Bangladesh's high vulnerability (0.54) reflects its combination of low-lying coastal geography (high exposure), dense population, limited infrastructure and low income. Even if Bangladesh faced a less intense hazard than Norway, its high vulnerability means its potential losses would be far greater relative to its resources and capacity to recover. (1 mark) Source C shows that the most vulnerable countries are also among the poorest. This creates a deeply inequitable situation: these countries have contributed least to global GHG emissions but face the highest climate risks, and they have the fewest financial resources to invest in adaptation. Building community resilience in these countries requires not only domestic policy action but also significant international financial support — for example, the Loss and Damage fund established at COP27 in 2022. (1 mark) The variation in vulnerability shown in Source C demonstrates that climate action must be place- and context-specific — there is no one-size-fits-all approach. A seawall that is cost-effective for the Netherlands may be completely unaffordable for Bangladesh. Building community resilience across these diverse contexts requires tailored strategies that account for each community's specific vulnerabilities, resources and capacities. (1 mark)", "lo": false}, {"id": "Q3.3.i", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source D and your own knowledge, explain how international agreements contribute to mitigation, and what limits their effectiveness.", "src": {"t": "note", "lbl": "Source D", "cap": "Text extract — Adapted from UNFCCC and IEA, 2022 (verify)", "text": "Text extract — Adapted from UNFCCC and IEA, 2022 (verify)"}, "ans": "Source D shows that the UNFCCC — signed by 197 parties — provides the framework for international climate cooperation. The Paris Agreement commits countries to limiting warming to well below 2°C, with efforts to limit it to 1.5°C. By bringing virtually all countries together under a common framework with shared targets, international agreements create a collective commitment to mitigation that no single country could achieve alone, and build political momentum for domestic policy action. (1 mark) The NDC system described in Source D encourages countries to set and publicly communicate their own emission reduction targets — creating transparency and accountability that can drive ambition over time. For example, China's NDC commits to peaking emissions before 2030 and achieving net zero by 2060 — targets that create domestic policy pressure and international expectations that are difficult to abandon without reputational consequences. (1 mark) However, Source D clearly identifies the fundamental limitation of the UNFCCC framework — NDCs are voluntary and legally unenforceable. Countries cannot be compelled to meet their targets, and the Climate Action Tracker found that even if all current NDCs were fully implemented, temperatures would still rise by ~2.4°C — far exceeding the 1.5°C target. This implementation gap reveals that international agreements, while necessary, are insufficient on their own without stronger enforcement mechanisms, domestic policy action and significantly higher levels of ambition in national targets. (1 mark)", "lo": false}, {"id": "Q3.3.j", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source E and your own knowledge, explain how mitigation strategies that reduce GHG emissions and enhance carbon sinks can build community resilience to climate change.", "src": {"t": "table", "lbl": "Source E", "cap": "Mitigation strategies — GHG reduction potential, global status and limitations", "credit": "Adapted from IEA, IRENA and Global Carbon Project, 2022", "info": "", "hdr": ["Strategy", "GHG potential", "Global status (2022)", "Key limitations"], "rows": [["Solar PV energy", "High", "~4.5% of global electricity; growing rapidly", "High upfront cost; land requirements; intermittency"], ["Wind energy", "High", "~7% of global electricity; growing rapidly", "Geographic constraints; visual/noise; intermittency"], ["Carbon capture (CCS)", "High (theoretical)", "Very limited — only ~0.1% captured", "Extremely costly; energy-intensive; limited geological sites"], ["Forest regeneration", "Significant", "Mixed results; 1 trillion trees initiative", "Risk of non-native species; water competition in arid areas; slow"], ["Consumption changes", "Potentially large", "Very limited adoption globally", "Behavioural change; social resistance; political sensitivity"]]}, "ans": "Source E shows that solar photovoltaic and wind energy both have high GHG reduction potential and are growing rapidly — solar accounts for ~4.5% and wind ~7% of global electricity in 2022. By replacing fossil fuel combustion with clean energy sources, these strategies directly reduce the atmospheric concentration of greenhouse gases, slowing the rate of climate change and reducing the severity of future impacts that communities will need to adapt to. (1 mark) However, Source E highlights significant limitations even for the most promising strategies. Solar and wind energy face issues of intermittency — they cannot generate power consistently when the sun is not shining or wind is not blowing — requiring expensive energy storage solutions. Carbon capture and storage (CCS), despite its high theoretical potential, currently captures only ~0.1% of global emissions at extremely high cost, demonstrating the large gap between technological potential and actual deployment. (1 mark) Forest regeneration shown in Source E enhances carbon sinks — more than 50% of emitted CO2 is reabsorbed by forests and oceans, and regenerating forests restores this absorption capacity. Forest regeneration also provides co-benefits for community resilience: trees reduce flood risk by absorbing water, protect against soil erosion, improve air quality and support biodiversity. However, Source E notes the risk of non-native species introduction and water competition in arid areas — demonstrating that mitigation strategies can themselves create new risks if poorly planned. (1 mark) Changes in consumption patterns shown in Source E have potentially large GHG reduction potential — shifting diets away from meat and reducing private vehicle use could significantly reduce emissions. However, Source E notes that adoption has been very limited globally due to the need for behavioural change, social resistance and political sensitivity. This illustrates why mitigation strategies alone are insufficient — without addressing the social and institutional challenges that limit their adoption, even highly effective strategies fail to build community resilience at the scale needed. (1 mark)", "lo": false}, {"id": "Q3.3.k", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source F and your own knowledge, explain why protecting and enhancing carbon sinks is an important mitigation strategy for building community resilience to climate change.", "src": {"t": "note", "lbl": "Source F", "cap": "Carbon sinks in the global carbon cycle", "credit": "Adapted from Global Carbon Project and IPCC, 2022", "info": "", "text": "Carbon sinks in the global carbon cycle"}, "ans": "Source F shows that forests and oceans together absorb more than 50% of annual human CO2 emissions — forests absorb approximately 2.6 billion tonnes CO2/year and oceans approximately 2.5 billion tonnes CO2/year. Carbon sinks therefore play a critical role in reducing the net accumulation of CO2 in the atmosphere. Without these natural sinks, atmospheric CO2 concentrations would rise far more rapidly, accelerating climate change and significantly increasing the climate risks that communities face. (1 mark) Source F highlights that despite the scale of carbon sink absorption, a net atmospheric increase of ~5 billion tonnes CO2/year still occurs — meaning carbon sources far outpace carbon sinks. This underscores the urgency of both reducing emissions from carbon sources and protecting and enhancing carbon sinks simultaneously, as a two-pronged mitigation approach. Reducing deforestation is therefore a critical mitigation strategy — every hectare of forest cleared removes a carbon sink that was absorbing atmospheric CO2. (1 mark) Protecting forests through reducing deforestation and implementing forest regeneration directly enhances the carbon sink capacity shown in Source F. Forest regeneration restores both the carbon storage function of forests and their broader ecosystem services — including water regulation, flood prevention and biodiversity support — which contribute directly to community resilience against climate impacts such as droughts and floods. (1 mark) Source F also notes that the capacity of carbon sinks is being reduced by deforestation and ocean acidification — a deeply concerning feedback loop. Deforestation releases stored carbon as CO2, which both adds to the carbon source and eliminates future absorption capacity. Ocean acidification, driven by the same CO2 emissions, reduces the capacity of phytoplankton to absorb CO2. Protecting carbon sinks is therefore not merely a mitigation strategy — it is essential to prevent the further deterioration of the Earth's natural capacity to regulate atmospheric CO2. (1 mark) Forest regeneration also creates risks and benefits for communities that must be carefully managed. Benefits include improved air quality, employment opportunities and enhanced biodiversity. However, planting trees in water-scarce areas can threaten water supplies by competing with agricultural uses. Non-native species plantations may reduce biodiversity. Effective forest regeneration requires careful species selection, long-term management commitment and community consultation — demonstrating that even well-designed mitigation strategies must be place- and context-specific. (1 mark)", "lo": false}, {"id": "Q3.3.l", "ao": "AO2", "marks": 3, "cmd": "Describe", "text": "Using Source G, describe how structural adaptation strategies manage the risk of flooding from climate change, and explain their economic limitations.", "src": {"t": "table", "lbl": "Source G", "cap": "Structural adaptation strategies — examples and economic limitations", "credit": "Adapted from IPCC, World Bank and case studies, 2022", "info": "", "hdr": ["Strategy", "How it works", "Example", "Economic limitation"], "rows": [["Seawall", "Constructed along the coast to prevent the sea from advancing onto land", "East Coast Park, Singapore — protects coastline from sea-level rise", "Very costly; Fiji seawalls expensive even using local coral and government materials"], ["Polder", "Low-lying land surrounded by dykes with excess water pumped out", "The Netherlands — polders since 12th century protect from river and sea flooding", "High construction cost; ongoing pump system maintenance"], ["Water storage tank", "Stores excess stormwater to prevent flooding in canals and drains", "Stamford Detention Tank, Singapore — stores and gradually releases excess water", "Costly underground construction; requires continuous monitoring systems"]]}, "ans": "Source G shows three structural adaptation strategies that physically modify the built environment to reduce flooding risk. Seawalls protect coastlines from rising sea levels; polders use dykes and pumps to protect low-lying areas; and water storage tanks capture excess stormwater and release it gradually, preventing flooding in canals and drains during heavy rainfall events. (1 mark) These structural strategies are effective because they provide a physical barrier or buffering system that directly reduces communities' exposure to flood hazards — addressing one of the three key determinants of climate risk identified alongside vulnerability and hazard. Once built, they provide continuous protection without requiring constant behavioural change from residents, making them reliable components of community resilience. (1 mark) However, Source G highlights significant economic limitations for all three strategies. Sea walls in Fiji are costly to build even when using local coral and government-supplied materials. Polders require both construction investment and ongoing operational costs for pump systems. The Stamford Detention Tank requires costly underground construction and continuous monitoring infrastructure. For developing countries with limited financial resources, these high costs make structural adaptation strategies extremely difficult to afford at the scale needed. (1 mark)", "lo": false}, {"id": "Q3.3.m", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source H and your own knowledge, explain how technological adaptation strategies can build food security and assess the limitations of this approach.", "src": {"t": "note", "lbl": "Source H", "cap": "Text extract — Adapted from Singapore Food Agency and FAO, 2022 (verify)", "text": "Text extract — Adapted from Singapore Food Agency and FAO, 2022 (verify)"}, "ans": "Source H describes how Singapore's high-tech farms — using automation, AI, remote monitoring and water quality sensors — increase food production efficiency in a land-scarce context. By monitoring crops remotely, conducting automated health checks and detecting disease early, these technologies maximise yields per unit of land, contributing to Singapore's goal of producing 30% of its nutritional needs locally by 2030 and reducing its dependence on global food supply chains disrupted by climate change. (1 mark) Technological adaptation strategies build food security and community resilience by directly addressing one of the most significant indirect impacts of climate change — the disruption of food supply chains. By producing food locally using controlled environments that are less vulnerable to weather extremes, high-tech farms insulate communities from the volatility of climate-affected global food markets. (1 mark) However, Source H clearly identifies the critical limitation of technological adaptation — cost. Singapore invested approximately S$40 million to fund just nine high-tech farms. Many developing countries that face the greatest food insecurity due to climate change — such as those in Sub-Saharan Africa and South Asia — simply cannot afford such capital-intensive approaches. The countries most vulnerable to climate-driven food insecurity are precisely those least able to afford the technological solutions that could address it, creating a deeply inequitable adaptation landscape. (1 mark) Beyond cost, technological adaptation strategies also face social limitations — communities accustomed to traditional farming practices may resist adopting radically different high-tech methods. Additionally, high-tech farms require skilled workers, reliable electricity supply and supply chains for equipment and spare parts — infrastructure that may be unreliable or unavailable in many developing countries. These limitations demonstrate why technological adaptation is most effective when combined with social and institutional approaches that address the human dimensions of climate resilience. (1 mark)", "lo": false}, {"id": "Q3.3.n", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source I and your own knowledge, explain how social and institutional adaptation strategies build community resilience and assess their limitations.", "src": {"t": "note", "lbl": "Source I", "cap": "Text extract — Adapted from case studies on social and institutional adaptation, 2022", "text": "Text extract — Adapted from case studies on social and institutional adaptation, 2022"}, "ans": "Source I shows that social adaptation strategies — raising awareness and educating communities — build resilience by ensuring that people are aware of warning signs of climatic hazards and know how to protect themselves. The Nepal example demonstrates how teaching farmers to grow drought-resistant crops like apples provides a practical, community-level response that improves food security in drier conditions. The Singapore example shows how public education on heat stress prevention reduces injuries and economic losses. (1 mark) These social strategies build community resilience in a cost-effective and inclusive way that complements structural and technological approaches — they do not require expensive infrastructure and can reach large numbers of people quickly through education campaigns and community programmes. (1 mark) However, Source I clearly identifies the social limitation of awareness-based strategies — people may not be willing to change their behaviour even when educated about better options. The Nepal community example illustrates this vividly: some communities prefer traditional migration over new drought-resistant crops despite receiving education about the alternatives. Cultural identity, social norms, trust in traditional knowledge and risk aversion all influence whether communities adopt new practices. This 'education-behaviour gap' means that social adaptation strategies must be complemented by other approaches that provide practical incentives and support for behavioural change. (1 mark) Source I also identifies the institutional limitation — countries may have competing national priorities and insufficient financial capacity to fund adaptation projects. Developing countries facing urgent development challenges such as poverty, education and healthcare may prioritise these over climate adaptation, leaving communities exposed to increasing climate risks. International financial support mechanisms — such as the Green Climate Fund — are therefore critical to enabling institutional adaptation in the most vulnerable developing countries. (1 mark)", "lo": false}, {"id": "Q3.3.o", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source J and your own knowledge, assess the extent to which adaptation strategies are sufficient to build community resilience to climate change without also implementing mitigation strategies.", "src": {"t": "table", "lbl": "Source J", "cap": "Adaptation strategies — effectiveness, limitations and community resilience built", "credit": "Adapted from IPCC, World Bank and academic literature, 2022", "info": "", "hdr": ["Strategy type", "Example", "Effectiveness", "Key limitation", "Resilience built"], "rows": [["Structural — seawall", "East Coast Park, Singapore", "High (wealthy countries)", "Very costly; may displace informal communities", "Reduces coastal flooding"], ["Structural — water storage", "Stamford Detention Tank, SG", "Effective for urban floods", "High construction and monitoring costs", "Reduces urban flood damage"], ["Technological", "Singapore '30 by 30' farms", "Highly effective but costly", "~S$40M for 9 farms; too expensive for most", "Improves food security"], ["Social — awareness", "Nepal drought crops; SG heat", "Widely applicable; low cost", "Cultural resistance; education-behaviour gap", "Improves individual preparedness"], ["Institutional — policy", "Bangladesh NAPA", "Provides framework", "Competing priorities; insufficient climate finance", "Strategic direction for resilience"]]}, "ans": "Source J shows a range of adaptation strategies with varying effectiveness. Structural strategies such as Singapore's seawalls and Stamford Detention Tank are highly effective at reducing flood exposure and urban flood damage, but are only affordable for wealthy countries. Technological strategies like high-tech farming significantly improve food security, but at costs (~S$40 million for 9 farms) that are prohibitive for most developing nations. This pattern suggests that while adaptation strategies can be very effective in wealthy contexts, they are far less accessible in the most vulnerable developing countries where they are most urgently needed. (1 mark) Social and institutional strategies shown in Source J — while widely applicable and lower-cost — face their own limitations. Education about drought-resistant crops or heat stress prevention builds individual preparedness but cannot change the underlying climate hazard that communities face. Bangladesh's National Adaptation Programme of Action provides strategic direction but is constrained by limited climate finance and competing national priorities. These strategies build resilience at the margins rather than addressing the root cause of increasing climate risk. (1 mark) The fundamental limitation of adaptation strategies acting alone is that they are reactive rather than preventive — they reduce the harm from climate impacts that are already occurring, but do not slow the rate of climate change itself. As climate change continues to intensify due to insufficient mitigation, the frequency and severity of extreme weather events increase, making adaptation increasingly costly and eventually insufficient. (1 mark) Mitigation strategies are therefore essential complements to adaptation. Without mitigation to slow the rate of climate change, the investment needed in adaptation grows continuously. The IPCC has consistently found that the costs of adequate adaptation increase dramatically with higher temperatures — at 1.5°C warming, adaptation costs are manageable; at 3°C or 4°C, adaptation becomes insufficient and irreversible losses occur. (1 mark) On balance, adaptation strategies alone are not sufficient to build lasting community resilience — they are essential for managing current and near-term climate risks, but they cannot substitute for mitigation in preventing the long-term escalation of climate hazards. The most resilient communities will be those that implement robust adaptation strategies now while simultaneously demanding ambitious mitigation action to prevent the worst future scenarios. (1 mark)", "lo": false}, {"id": "Q3.3.p", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source K and your own knowledge, to what extent do you agree that mitigation and adaptation strategies are equally important in building community resilience to climate change? Explain your answer.", "src": {"t": "quote", "lbl": "Source K", "cap": "Commentary by a climate policy analyst", "credit": "Adapted from a climate policy analyst's commentary, 2022", "info": "Key claims: Choosing between mitigation and adaptation is a \"false choice\" — both are essential simultaneously. | Adaptation without mitigation = \"sandcastles in a rising tide\" — eventually overwhelmed by escalating climate change. | Mitigation without adaptation abandons currently vulnerable communities to protect future generations. Consider: Are mitigation and adaptation truly equal in urgency? Does the context (wealthy vs developing country) affect which should be prioritised?", "text": "The debate about whether to prioritise mitigation or adaptation is, frankly, a false choice. Communities that invest in adaptation without mitigation are building sandcastles in a rising tide — no matter how well-engineered their seawalls, they will eventually be overwhelmed if global temperatures continue to rise unchecked. Equally, communities that focus only on mitigation while ignoring the impacts already unfolding are abandoning the most vulnerable people in the present to protect future generations. The evidence is unambiguous: mitigation and adaptation are not competing strategies. They are two sides of the same coin, and both must be pursued with equal urgency.\" Climate policy analyst Climate policy commentary, 2022"}, "ans": "Agree — both strategies are essential and complementary: Source K powerfully argues that the choice between mitigation and adaptation is a 'false choice' — both are essential. Mitigation strategies that reduce greenhouse gas emissions — such as the Paris Agreement NDC commitments, renewable energy deployment and forest regeneration — slow down climate change, reducing the future severity of impacts. Without mitigation, adaptation becomes increasingly costly and eventually insufficient — a seawall adequate for current sea levels may be overwhelmed by 2100 projections if emissions continue unabated. Adaptation strategies — including seawalls, high-tech farming, awareness education and national adaptation plans — address the impacts already occurring and provide immediate protection for vulnerable communities. Nuanced view — timing and context affect relative priority: However, while both are ultimately necessary, their relative urgency varies by context. For communities already experiencing severe climate impacts — such as Bangladesh facing cyclones and flooding — adaptation strategies that provide immediate protection must be the immediate priority, even while mitigation is pursued over longer timescales. For major emitters like China and the USA, mitigation must be the primary focus since their emissions directly determine the future severity of climate change for everyone. Source K's 'sandcastles in a rising tide' metaphor is particularly apt for small island states facing sea-level rise — for them, the urgency of global mitigation action is existential. Conclusion: On balance, I strongly agree with Source K that mitigation and adaptation strategies are both essential and should be pursued simultaneously. Neither is sufficient alone — mitigation without adaptation abandons present-day vulnerable communities, while adaptation without mitigation condemns future generations to escalating climate chaos. The most resilient communities will be those that invest in both with equal urgency, calibrating the balance between them according to their specific vulnerabilities and resources.", "lo": true}, {"id": "Q3.3.q", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Current global mitigation efforts are insufficient to build community resilience to climate change.\" Do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — the gap between current efforts and required action is enormous: Source L provides compelling evidence that current global mitigation efforts are severely insufficient. Current GHG emissions of ~54 billion tonnes CO2e/year need to fall to ~25 billion tonnes by 2030 for a 1.5°C pathway — a 54% reduction in just eight years. Yet current NDC commitments would result in ~2.4°C warming, nearly 1°C above the 1.5°C target. Renewable energy accounts for only ~29% of global electricity when 60-90% is needed by 2030. Annual global climate finance stands at ~$630 billion when $4-6 trillion per year is needed. On every measurable metric, current efforts fall dramatically short of what the science requires. Agree — insufficient mitigation makes adaptation increasingly unaffordable: If global temperatures rise to 2.4°C as projected by current NDC trajectories, the costs and requirements of adaptation grow dramatically. Source L shows that only ~79 countries have formal adaptation plans — and many are unfunded. If mitigation continues to fall short, adaptation needs will eventually exceed any realistic level of investment, particularly for the most vulnerable developing countries. Partially disagree — significant mitigation progress has been made: However, it would be an overstatement to say that current efforts have achieved nothing. Renewable energy's share of global electricity has grown from less than 10% in 2000 to ~29% in 2022. 197 countries have signed the UNFCCC and the Paris Agreement. China, the world's largest emitter, has committed to net zero by 2060. Many countries have enacted domestic legislation committing to net zero. These efforts represent real and meaningful progress, even if they are insufficient relative to the scale of the challenge. Nuanced evaluation — the problem is implementation, not ambition: Source L's data reveals that the primary gap is not in stated ambitions but in implementation. Countries are not on track to meet even their existing targets. Annual climate finance of $630 billion is significant — the gap is in scaling this up to the $4-6 trillion needed. The challenge is mobilising the political will, financial resources and institutional capacity to implement existing commitments at far greater speed and scale. Conclusion: On balance, I agree that current global mitigation efforts are insufficient to build the level of community resilience needed to manage the climate risks that are now inevitable. Source L's data makes this clear — on every key metric, current actions fall significantly short of what the science requires. However, I do not agree that current efforts are completely inadequate — they represent genuine and growing progress. The fundamental challenge is accelerating the scale and pace of implementation to close the enormous gap between current trajectories and the 1.5°C pathway, while simultaneously investing in adaptation for communities already facing the consequences of insufficient past mitigation.", "lo": true}, {"id": "Q3.3.r", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Structural adaptation strategies are more effective than social and institutional adaptation strategies in building community resilience to climate change.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — structural strategies provide reliable, sustained physical protection: Structural adaptation strategies have a strong case for being the most immediately effective approach for many communities. Seawalls and polders provide physical barriers that directly reduce communities' exposure to coastal flooding and sea-level rise, operating continuously without requiring ongoing behavioural change from residents. The Netherlands' polders — constructed since the 12th century — have successfully protected large areas of low-lying land from flooding for centuries, demonstrating sustained long-term effectiveness. Singapore's Stamford Detention Tank addresses the specific challenge of urban flash flooding by capturing excess stormwater during heavy rainfall events. These physical structures provide certainty and reliability that social education campaigns cannot match. Partially disagree — structural strategies have critical economic and social limitations: However, structural strategies face serious economic limitations that severely constrain their effectiveness in the most vulnerable communities. Source G showed that sea walls in Fiji are very costly to build even using local coral and government-supplied materials. For developing countries that face the greatest climate risks — Bangladesh, Nepal, Pacific island states — these structural approaches are simply unaffordable at the scale needed. Source J confirmed that structural adaptation is 'highly effective in wealthy countries; limited in developing countries.' A strategy that only works for wealthy nations cannot be considered universally more effective when the most vulnerable communities are those least able to afford it. Partially disagree — social strategies address the human dimension of resilience: Social and institutional adaptation strategies address dimensions of climate resilience that structural approaches cannot. The Nepal example demonstrates how education on drought-resistant crops provides a cost-effective, widely accessible way to improve food security in climate-affected communities. Singapore's heat stress education programme reduces injuries and economic losses at a fraction of the cost of infrastructure solutions. Institutional adaptation — such as Bangladesh's National Adaptation Programme of Action — provides the strategic framework that coordinates all other adaptation efforts and ensures they are prioritised and funded. Without institutional frameworks, even the most expensive structural investments may be poorly designed, mislocated or mismanaged. Nuanced evaluation — effectiveness depends on context and hazard type: The relative effectiveness of structural versus social/institutional strategies depends fundamentally on the type of climate hazard, the level of development and the specific vulnerabilities of the community. For coastal communities facing sea-level rise, structural strategies are essential and irreplaceable. For communities facing drought-related food insecurity, social strategies such as drought-resistant crop education may be more cost-effective and accessible. The most resilient communities will be those that deploy all four types of adaptation strategy in combination, rather than relying exclusively on any single approach. Conclusion: On balance, I partially disagree with the statement. Structural adaptation strategies are certainly highly effective for well-resourced communities facing specific physical hazards such as coastal flooding. However, their high costs make them largely inaccessible to the most vulnerable developing communities, where social and institutional strategies that are lower-cost and more widely applicable may be more practically effective. The most resilient communities will be those that deploy all four types of adaptation strategy in combination, calibrated to their specific vulnerabilities and resources.", "lo": true}, {"id": "Q3.3.s", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "Using Source M and your own knowledge, to what extent do you agree that developed countries have an obligation to fund climate adaptation in developing countries? Explain your answer.", "src": {"t": "quote", "lbl": "Source M", "cap": "Remarks by a climate finance negotiator at COP27, Sharm el-Sheikh, Egypt", "credit": "Adapted from COP27 climate finance negotiator remarks, Egypt, 2022", "info": "Key claims: Building resilience requires money that developing countries lack — they are trapped in a cycle of disaster recovery. | G20 countries produced ~80% of historical GHG emissions and therefore have a moral and financial obligation to fund adaptation. | The COP27 Loss and Damage fund is historic but pledges fall far short of what is actually needed. Consider: Do developed countries have a legal obligation, or only a moral one? Is the Loss and Damage fund sufficient evidence of meeting th", "text": "We keep hearing that developing countries need to 'build resilience.' But resilience costs money — money that developing countries do not have, because they spent their resources recovering from the last climate disaster. The G20 countries have produced roughly 80% of historical greenhouse gas emissions. They have the resources. They have the technology. They have the obligation. The Loss and Damage fund agreed here in Sharm el-Sheikh is a historic step — but the amounts pledged are still a tiny fraction of what is actually needed. You cannot ask the poorest communities on Earth to adapt to a crisis they did not create, without providing the financial and technical support to do so.\" Climate finance negotiator, COP27 UN Climate Conference, Sharm el-Sheikh, Egypt, November 2022"}, "ans": "Agree — the moral obligation is rooted in historical responsibility: Source M articulates a powerful moral argument grounded in historical responsibility. The G20 countries have produced roughly 80% of historical greenhouse gas emissions. Developing countries like Bangladesh — which emits only ~0.3 billion tonnes CO2e per year — face Very High climate vulnerability despite contributing minimally to the problem. Source C showed a clear inverse relationship between climate vulnerability and per capita income. The principle of 'common but differentiated responsibilities' — embedded in the UNFCCC — explicitly acknowledges that developed countries bear greater responsibility for climate change and therefore have a greater obligation to fund its solutions. Asking the poorest communities on Earth to adapt to a crisis they did not create without financial support is both morally indefensible and practically counterproductive. Agree — adaptation finance is also a practical necessity: Beyond the moral argument, funding adaptation in developing countries is a practical necessity for global climate resilience. Unmanaged climate impacts in vulnerable developing countries create cascading global consequences — climate-driven migration, regional instability, disrupted global supply chains and pandemic risks from disease spread in weakened healthcare systems. The World Bank estimates that every $1 invested in resilience saves $4 in disaster recovery costs — making adaptation finance not only morally justified but financially rational. Partially disagree — the scale and conditionality of obligations are debated: However, the nature, scale and conditionality of developed countries' obligations are legitimately debated. Source M notes that the COP27 Loss and Damage fund represents a 'historic step' but 'amounts pledged are still a tiny fraction of what is actually needed.' Annual global climate finance stands at ~$630 billion when $4-6 trillion per year is needed. Developed countries argue that private sector finance and domestic resource mobilisation must also play major roles — they cannot and should not be expected to fund all global adaptation needs alone. Nuanced evaluation — obligation must translate into action: Source M's most important insight is the gap between stated commitments and actual action. The COP27 Loss and Damage fund represents a formal recognition of developed countries' obligations — a step that would have been unimaginable a decade ago. But recognition of obligation without adequate funding is insufficient. The promised $100 billion per year from developed countries (agreed at COP15 in 2009) has still not been consistently delivered over a decade later. The credibility of developed countries' obligations depends on closing this implementation gap, not just making further pledges. Conclusion: On balance, I strongly agree that developed countries have a moral and practical obligation to fund climate adaptation in developing countries. The combination of historical responsibility, current capacity and practical necessity makes this case compelling. However, obligation alone is insufficient without mechanisms to ensure adequate, timely and accessible delivery of climate finance. The most important challenge is translating that principle into the $4-6 trillion per year of adaptation finance that the science says is needed, delivered in ways that genuinely reach the most vulnerable communities.", "lo": true}, {"id": "Q3.3.t", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "\"Forest regeneration is the most effective mitigation strategy for building community resilience to climate change.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — forest regeneration provides multiple co-benefits: Forest regeneration — including both reforestation and afforestation — is a particularly compelling mitigation strategy because it provides multiple simultaneous benefits. As a carbon sink enhancement, forests absorb approximately 2.6 billion tonnes of CO2 per year globally, and regenerating deforested areas restores this absorption capacity. Beyond carbon sequestration, forest regeneration improves air quality, reduces flood risk by absorbing rainfall and anchoring soil, supports biodiversity and provides employment opportunities. These co-benefits directly contribute to community resilience — reducing flood risk, improving public health and supporting livelihoods — in ways that technological mitigation strategies such as carbon capture and storage cannot. Disagree — forest regeneration has significant limitations: However, forest regeneration faces several limitations that prevent it from being the most effective mitigation strategy overall. Planting trees in water-scarce areas can threaten water supplies by competing with agricultural uses. Non-native species plantations may reduce biodiversity. Trees take decades to mature — making forest regeneration a slow-acting strategy. More fundamentally, forests can be destroyed by wildfires — which are themselves increasing in frequency due to climate change — releasing all stored carbon and reversing the mitigation benefit. Conclusion: On balance, I partially agree that forest regeneration is a highly effective and multi-beneficial mitigation strategy that should be a central component of global climate action. However, it is not the single 'most effective' strategy — its effectiveness depends heavily on the species planted, location, long-term management and whether it is properly designed to enhance local biodiversity and water security. It is most powerful when combined with the rapid reduction of fossil fuel emissions through clean energy deployment, which addresses the root cause of climate change at a scale and speed that forest regeneration alone cannot match.", "lo": true}], "4.1": [{"id": "Q4.1.a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by a \"tectonic plate\"?", "src": null, "ans": "A tectonic plate is one of the huge pieces of the lithosphere — the solid outermost part of the Earth made up of the crust and the uppermost mantle — that moves relative to other plates due to forces within the Earth. (1 mark)", "lo": false}, {"id": "Q4.1.b", "ao": "AO1", "marks": 1, "cmd": "State", "text": "State the difference between oceanic crust and continental crust.", "src": null, "ans": "Oceanic crust makes up the seafloor and is denser than continental crust, whereas continental crust makes up the land masses and is less dense than oceanic crust. (1 mark)", "lo": false}, {"id": "Q4.1.c", "ao": "AO1", "marks": 2, "cmd": "Explain", "text": "Explain how convection currents drive the movement of tectonic plates.", "src": null, "ans": "Heat from the Earth's core causes mantle material to become less dense and rise towards the surface, spreading beneath the plates and dragging them apart — causing divergent plate movement. (1 mark) The mantle material then loses heat, becomes denser and sinks back towards the
