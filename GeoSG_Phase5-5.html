 management must address all four earthquake hazard types simultaneously. (1 mark)", "lo": false}, {"id": "Q4.2.m", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source H and your own knowledge, explain how volcanic eruptions generate multiple hazards and their impacts on natural and human systems.", "src": {"t": "quote", "lbl": "Source H", "cap": "1991 Mount Pinatubo eruption — multiple volcanic hazards and their impacts", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and case studies of the 1991 Mount Pinatubo eruption", "info": "", "text": "\"The eruption of Mount Pinatubo in the Philippines in June 1991 (VEI 6) generated a range of volcanic hazards that affected the surrounding region for years. Pyroclastic flows — hot mixtures of rock, gas and ash moving at speeds of over 100 km/h — travelled down the flanks of the volcano, destroying forests, crops and settlements within a radius of 10 km. Tephra from the eruption covered an area of over 4,000 km² to a depth of several centimetres, collapsing roofs and choking rivers. Heavy rainfall from Typhoon Yunya, coinciding with the eruption, mixed with volcanic ash to create lahars — mudflows that buried entire villages and continued flowing down river valleys for years afterwards. The eruption killed approximately 800 people and displaced over 200,000. However, the ash cloud also re"}, "ans": "Source H describes how the 1991 Mount Pinatubo eruption generated three distinct simultaneous volcanic hazards. Pyroclastic flows — travelling at over 100 km/h — destroyed forests, crops and settlements within a 10 km radius, demonstrating how these fast-moving, extremely hot mixtures of rock, gas and ash are among the most immediately lethal volcanic hazards. Tephra covered over 4,000 km2 to a depth of several centimetres, collapsing building roofs across a vast area and choking waterways — demonstrating how tephra can cause widespread damage far beyond the immediate vicinity of pyroclastic flows. (1 mark) Source H illustrates the particularly dangerous interaction between volcanic eruptions and weather events. The coincidence of Typhoon Yunya with the eruption mixed heavy rainfall with volcanic ash to create lahars — mudflows that buried entire villages and continued flowing down river valleys for years after the initial eruption. This demonstrates how volcanic hazards can persist long after the eruption itself has ended, continuing to destroy infrastructure and farmland during every subsequent heavy rainfall event. (1 mark) The impacts on human systems shown in Source H were severe — approximately 800 deaths and over 200,000 displaced people. However, the impacts on natural systems were equally significant: forest ecosystems within the pyroclastic flow radius were completely destroyed, river channels were dramatically altered by lahar deposits, and agricultural land was buried under thick tephra deposits. The destruction of agricultural land and water supplies undermines the food security of communities that depend on natural systems for their livelihoods. (1 mark) Source H concludes with an important global dimension — the ash cloud from Pinatubo reflected sunlight, lowering global temperatures by approximately 0.5 degrees Celsius for 1-2 years. This illustrates how large volcanic eruptions affect not just local and regional systems but global climate, demonstrating that the environmental impacts of major eruptions extend far beyond the eruption site. This global temperature reduction affected agricultural yields worldwide — a powerful reminder that tectonic hazard impacts can cascade across spatial scales from local destruction to global climate effects. (1 mark)", "lo": false}, {"id": "Q4.2.n", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source I and your own knowledge, explain why communities continue to live near volcanoes despite the hazards they pose.", "src": {"t": "table", "lbl": "Source I", "cap": "Benefits of volcanic activity — why communities live near volcanoes", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and case studies", "info": "", "hdr": ["Benefit", "How it occurs", "Scale", "Example"], "rows": [["Fertile soil", "Volcanic materials (lava, ash) break down and weather over decades to form nutrient-rich soils", "Supports intensive agriculture for millions", "Java, Indonesia — volcanic soils support rice farming for ~140 million people; Campania, Italy — world-class wine and produce near Vesuvius"], ["Valuable minerals", "Magmas deep within extinct volcanoes contain metallic substances (copper, gold, silver, lead, zinc)", "Billions of dollars in national economies", "Mining around volcanic regions in Philippines, Chile, Indonesia"], ["Geothermal energy", "Energy harnessed from Earth's natural heat associated with active or geologically young inactive volcanoes", "Significant proportions of national electricity supply", "Iceland — geothermal ~25% of electricity; Kenya — Olkaria geothermal plant"], ["Tourism", "Volcanic landscapes — craters, lava flows, hot springs — attract tourists generating income and employment", "Millions of visitors and revenue", "Hawaii Volcanoes National Park — millions of visitors annually; Mount Fuji, Japan"]]}, "ans": "Source I shows that volcanic soils are among the most fertile on Earth — volcanic materials break down over decades to produce extremely nutrient-rich soils capable of supporting intensive agriculture. Java, Indonesia demonstrates this at enormous scale — volcanic soils support rice farming for approximately 140 million people, making Java one of the most densely populated agricultural regions on Earth. For communities in developing countries with few economic alternatives, the agricultural productivity of volcanic soils provides an overwhelming economic reason to remain in potentially hazardous locations. (1 mark) Source I also shows that geothermal energy provides a compelling economic reason to live near volcanic regions — Iceland generates approximately 25% of its electricity from geothermal sources, providing cheap, renewable energy that contributes significantly to the country's economic competitiveness and quality of life. For small island nations or developing countries with limited fossil fuel resources, geothermal energy from volcanic regions can represent a transformative economic resource that justifies accepting some degree of volcanic hazard risk. (1 mark) The tourism benefits shown in Source I provide additional economic motivation — Hawaii Volcanoes National Park attracts millions of visitors annually, generating substantial income and employment for local communities. Volcanic landscapes are among the world's most compelling tourist attractions precisely because of the volcanic activity that also generates hazard risk. For communities whose livelihoods depend on tourism income from volcanic attractions, abandoning the area would eliminate their primary source of income. (1 mark) Beyond economic factors, cultural, social and historical attachments to volcanic regions also explain why communities persist in hazard-prone areas. Many volcanic communities have lived in the same location for generations, with deep cultural and spiritual connections to the volcanic landscape — as seen in indigenous communities in Hawaii, Japan and Indonesia. Additionally, the long intervals between major eruptions mean that many residents have never directly experienced a significant volcanic hazard event, reducing their perceived risk relative to the daily economic and cultural benefits of living in a productive volcanic region. (1 mark)", "lo": false}, {"id": "Q4.2.o", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source J and your own knowledge, explain why two earthquakes of similar magnitude can have dramatically different impacts on natural and human systems.", "src": {"t": "quote", "lbl": "Source J", "cap": "Haiti (2010) vs Christchurch (2011) — why similar earthquakes had different impacts", "credit": "Adapted from case studies of the 2010 Haiti and 2011 Christchurch earthquakes", "info": "", "text": "\"The 2010 Haiti earthquake (Mw 7.0) killed over 230,000 people, injured 300,000 more, and displaced 1.5 million. The 2011 Christchurch earthquake (Mw 6.3) killed 185 people. Both earthquakes occurred on transform fault systems. Haiti's catastrophic death toll reflected the near-total absence of earthquake-resistant building design — approximately 60% of government buildings and 90% of hospitals in Port-au-Prince were destroyed or made unusable. In contrast, Christchurch's building codes required structures to withstand significant seismic forces. New Zealand's emergency response capacity, early warning systems and well-trained rescue teams were rapidly deployed. Both cities experienced significant soil liquefaction — but Christchurch's superior building quality meant that few buildings col"}, "ans": "Source J provides a compelling illustration of why earthquake magnitude alone does not determine impact. Haiti (Mw 7.0) killed over 230,000 people while Christchurch (Mw 6.3) killed 185 — yet Haiti's earthquake was only slightly larger in magnitude. The primary explanation is the vast difference in vulnerability. Haiti's near-total absence of earthquake-resistant building design meant that approximately 60% of government buildings and 90% of hospitals were destroyed or rendered unusable. In a community where virtually no buildings were designed to withstand seismic forces, even a moderate earthquake becomes catastrophic. (1 mark) Source J shows that Christchurch's mandatory building codes — requiring structures to withstand significant seismic forces — directly limited casualties and structural collapse despite widespread damage. This demonstrates that vulnerability (in this case, building quality) is a more powerful determinant of death toll than the physical magnitude of the hazard itself. The disaster risk equation (risk = hazard x vulnerability x exposure) is powerfully illustrated: reducing vulnerability through building codes can dramatically reduce disaster risk even when the hazard cannot be controlled. (1 mark) Source J also shows that emergency response capacity critically determines secondary impacts after an earthquake. Haiti's search and rescue operations were severely hampered by the lack of heavy lifting equipment, communication systems and trained personnel — meaning that people trapped under collapsed buildings died waiting for help. New Zealand's well-trained rescue teams, early warning systems and communication infrastructure enabled rapid, effective response that saved lives that better-prepared Haiti could not. (1 mark) Both cities experienced soil liquefaction — demonstrating that local geological conditions create similar secondary hazard risk in both locations. However, Source J shows that Christchurch's superior building quality meant few buildings collapsed catastrophically despite widespread liquefaction damage to roads, pipes and foundations. In Haiti, the combination of poorly constructed buildings and liquefaction created a catastrophic compound effect — liquefaction undermined the already weak foundations of buildings not designed to resist seismic forces, amplifying the structural collapse. (1 mark) Source J's comparison reveals a fundamental principle: the impacts of tectonic hazards are not primarily determined by the physical characteristics of the hazard but by the interaction of that hazard with human vulnerability and exposure. The most effective way to reduce earthquake disaster risk is not to avoid earthquake-prone regions — which is often economically and socially impossible — but to systematically reduce vulnerability through earthquake-resistant construction, robust emergency response systems and community preparedness. (1 mark)", "lo": false}, {"id": "Q4.2.p", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source K and your own knowledge, to what extent do you agree that the benefits of living near a volcano outweigh the risks? Explain your answer.", "src": {"t": "quote", "lbl": "Source K", "cap": "Commentary by a volcanologist on why communities choose to live near volcanoes", "credit": "Adapted from a volcanologist's commentary, 2022", "info": "Key claims: Communities choose to live near volcanoes \"because of\" the volcanic benefits — not \"despite\" the hazards. It is a rational economic choice. | Volcanic benefits — fertile soil (Java), geothermal energy (Iceland), tourism (Hawaii) — \"far outweigh the risk\" in the long intervals between eruptions. | \"The volcano that threatens once in a generation feeds a family every day\" — frequency of benefit far exceeds frequency of hazard for most communities. Consider: Does Source K understate the", "text": "People ask me why anyone would choose to live in the shadow of an active volcano. My answer is always the same: they don't choose despite the volcano — they choose because of it. The volcanic soils of Java support one of the highest agricultural population densities on Earth. The geothermal fields of Iceland have given that small nation energy independence and some of the lowest electricity prices in Europe. The volcanic landscapes of Hawaii generate billions of dollars in tourism annually. What looks from the outside like irrational risk-taking is, in reality, a perfectly rational economic calculation — the fertility, energy and economic opportunity that volcanoes provide in the long intervals between eruptions far outweigh the risk of the eruptions themselves for many communities. The vo"}, "ans": "Agree — economic and agricultural benefits are substantial and continuous: Source K makes a compelling case that for many communities, living near volcanoes is an economically rational choice. The volcanic soils of Java support approximately 140 million people — one of the highest agricultural population densities on Earth. For subsistence farmers with no alternative income, the fertility that volcanic soils provide every growing season is an immediate, tangible benefit that outweighs a volcanic eruption that may occur once a generation or less. Source K's observation that 'the volcano that threatens once in a generation feeds a family every day' captures this risk-benefit calculus precisely. Iceland's geothermal energy, Hawaii's tourism billions and the mineral wealth of volcanic regions globally all reinforce Source K's argument. Partially disagree — the risk is real and unevenly distributed: However, Source K's argument understates the scale of volcanic risks when eruptions do occur. The 1991 Mount Pinatubo eruption killed approximately 800 people and displaced over 200,000 — and lahars from that eruption continued burying villages for years afterwards. Furthermore, the benefits of volcanic regions are unevenly distributed: the fertile soils and tourism revenue accrue to those who own land and businesses, while the risks of living closest to the volcano often fall disproportionately on poorer community members who cannot afford to live further away. Conclusion: On balance, I partially agree with Source K that for many communities, the benefits of living near volcanoes outweigh the risks — particularly in developing countries where agricultural fertility and geothermal energy represent transformative economic advantages. However, the balance shifts decisively when a major eruption actually occurs, and the poorest communities bear disproportionate risk relative to the benefits they receive.", "lo": true}, {"id": "Q4.2.q", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"The impacts of earthquakes are determined more by human factors than by the physical characteristics of the earthquake itself.\" Do you agree with this statement? Explain your answer.", "src": null, "ans": "Strongly agree — vulnerability determines death toll more than magnitude: Source L provides compelling evidence that human factors are the primary determinants of earthquake impact. Haiti (Mw 7.0) killed ~230,000 people while Northridge, USA (Mw 6.7) killed 57 — yet Haiti's earthquake was only marginally more powerful. The difference in death toll by a factor of approximately 4,000 cannot be explained by the physical characteristics of the earthquakes; it can only be explained by the dramatic difference in human vulnerability. Haiti's 90% destruction of hospitals, absent building codes and limited rescue equipment are entirely human-determined factors that transformed a significant earthquake into a catastrophic disaster. Agree — governance and economic development mediate vulnerability: The pattern across all five cases in Source L shows a consistent relationship between economic development and earthquake death toll. Japan (Mw 9.0, 15,000 deaths) spent decades investing in earthquake-resistant construction, early warning systems and disaster preparedness that limited ground-shaking deaths dramatically even during the most powerful earthquake in its recorded history. Kashmir, Pakistan (Mw 7.6, 87,000 deaths) had neither the economic resources to enforce building codes nor the road infrastructure to enable rapid rescue response. The relationship between GDP per capita and earthquake death tolls is one of the most consistent patterns in natural hazard data. Partially disagree — physical characteristics still matter significantly: However, physical earthquake characteristics do influence impacts in ways that cannot be entirely attributed to human factors. The Tohoku earthquake (Mw 9.0) demonstrates this — even Japan's world-leading earthquake preparedness could not prevent the tsunami from overwhelming seawall defences designed for smaller events. The sheer scale of the Mw 9.0 earthquake generated tsunami waves exceeding the design specifications of even Japan's most advanced coastal defences. Physical magnitude does matter when it exceeds the design parameters of even well-engineered human protective systems. Nuanced evaluation — both matter, but human factors are more actionable: The most important insight from Source L is not whether physical or human factors are 'more important' in an absolute sense, but that human factors are far more actionable. A community cannot change its location relative to a plate boundary, but it can strengthen building codes, invest in early warning systems and train rescue teams. The dramatic difference between Haiti's 230,000 deaths and Christchurch's 185 deaths from earthquakes of similar magnitude demonstrates the enormous life-saving potential of reducing human vulnerability. Conclusion: On balance, I strongly agree that human factors are the primary determinants of earthquake impact — Source L's evidence consistently shows that the same physical hazard magnitude produces radically different death tolls depending on building quality, emergency response capacity, economic development and governance quality. However, the Tohoku case shows that exceptional physical events can overwhelm even advanced human preparedness systems. The most accurate statement is that human factors primarily determine earthquake impacts up to a certain physical magnitude threshold, beyond which even the best-prepared communities face the limits of human engineering.", "lo": true}, {"id": "Q4.2.r", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Volcanic hazards pose a greater threat to communities than earthquake hazards.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Agree — volcanic hazards are more diverse and can have longer-lasting impacts: Volcanic eruptions generate a wider variety of hazards than earthquakes — tephra, volcanic gases, lava flows, pyroclastic flows, lahars and volcanic landslides can all emerge from a single eruption, affecting communities through multiple simultaneous mechanisms. The 1991 Mount Pinatubo eruption illustrates this diversity: pyroclastic flows destroyed everything within a 10 km radius; tephra collapsed roofs across 4,000 km2; lahars buried villages for years after the eruption ended. The persistence of volcanic hazards is particularly significant — whereas earthquake ground shaking lasts seconds to minutes, lahars can continue destroying agricultural land for years or decades after the eruption. The 1815 Mount Tambora eruption (VEI 7) caused the 'Year Without a Summer' — a global agricultural catastrophe. Disagree — earthquake hazards have caused more deaths historically: However, comparing historical death tolls, earthquake hazards — particularly tsunami-generating subduction-zone earthquakes — have caused the greatest loss of life in recorded history. The 2004 Indian Ocean tsunami killed over 230,000 people across 14 countries from a single earthquake event. The 2010 Haiti earthquake killed approximately 230,000 people. The 1976 Tangshan earthquake in China killed an estimated 240,000-650,000 people. While volcanic eruptions can be catastrophic, the death tolls from individual volcanic events have generally been lower than the most deadly earthquake events. Partially disagree — the relative threat depends on community location and vulnerability: The relative threat of volcanic versus earthquake hazards is fundamentally context-dependent. For communities living on the flanks of stratovolcanoes — such as those around Mount Merapi, Pinatubo or Vesuvius — volcanic hazards clearly pose the most immediate and direct threat, with pyroclastic flows capable of killing entire communities in minutes. For communities in coastal areas near subduction zones — such as those around the Pacific Ring of Fire — earthquake-generated tsunamis represent a greater threat in terms of scale and speed. Nuanced evaluation — secondary effects of volcanic eruptions may be underestimated: One argument for volcanic hazards posing a greater threat than commonly acknowledged is the potential for large eruptions to cause global-scale impacts. The VEI 8 Toba eruption 74,000 years ago may have caused a severe population bottleneck in human evolution by drastically reducing global temperatures through volcanic winter. No earthquake, however powerful, has produced comparable global secondary effects. This suggests that while individual earthquake events may kill more people in direct mortality, the largest volcanic eruptions have the potential to threaten human communities at a genuinely global scale. Conclusion: On balance, I do not agree that volcanic hazards categorically pose a greater threat than earthquake hazards. Historical mortality data consistently shows that earthquake events — particularly through tsunami — have caused larger immediate death tolls than most volcanic eruptions. However, the comparison depends heavily on the specific hazard types, community locations and timescales considered. The statement is too absolute — both hazard types pose serious threats to different communities in different contexts.", "lo": true}, {"id": "Q4.2.s", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source M and your own knowledge, to what extent do you agree that inadequate early warning systems are the most important factor in determining the death toll from tectonic hazards? Explain your answer.", "src": {"t": "quote", "lbl": "Source M", "cap": "Remarks by an emergency management official in a volcanic region", "credit": "Adapted from remarks by an emergency management official, 2022", "info": "Key claims: The knowledge and technology to reduce tectonic hazard death tolls already exists — the barrier is political will and resources, not knowledge. | Three key gaps: \"not enough warning, not enough preparation, not enough resources\" — all human-determined factors, not physical ones. | The poorest communities living in the most hazardous locations are \"always the last to receive\" protection and \"the first to die\" — an equity problem. Consider: Is inadequate early warning the most importan", "text": "Every time there is a volcanic eruption or a large earthquake, people ask the same question: why did so many people die? And the answer is always the same: not enough warning, not enough preparation, not enough resources. The technology to monitor volcanoes and detect earthquakes exists. The knowledge to design buildings that can withstand seismic forces exists. The plans for evacuation exist on paper. What is missing is not knowledge or technology — it is the political will to implement them, and the resources to reach the communities that need protection the most. The poorest communities, living on the steepest slopes nearest the volcano or the most vulnerable coastal zones, are always the last to receive early warning systems, the last to have their buildings strengthened, and the first"}, "ans": "Partially agree — early warning systems save lives but are not the only critical factor: Source M identifies the lack of early warning systems as a key factor in earthquake and volcanic disaster death tolls — and the evidence supports this. Japan's earthquake early warning system gave residents seconds to tens of seconds of warning before the 2011 Tohoku shaking arrived. Kamaishi city's disaster prevention education programme, combined with evacuation drills, enabled nearly all 3,000 students to survive the tsunami. For volcanic hazards, monitoring systems that detect precursor activity can enable evacuation before major eruptions. The 1991 Mount Pinatubo eruption's monitoring allowed the evacuation of approximately 60,000 people from the most dangerous areas before the VEI 6 eruption, significantly limiting the death toll. (1 mark) However, Source M itself acknowledges that 'not enough warning, not enough preparation, not enough resources' are all contributing factors — not early warning alone. The 2010 Haiti earthquake demonstrates that even a complete and effective earthquake early warning system would have saved relatively few lives compared to enforcing earthquake-resistant building codes. When 90% of hospitals collapse and virtually every poorly constructed building fails, the seconds of warning that an early warning system provides are insufficient to save people already inside collapsing structures. Building quality is arguably more important than warning time for earthquakes specifically. (1 mark) Conclusion: On balance, I partially agree that inadequate early warning systems contribute significantly to tectonic disaster death tolls — particularly for volcanic eruptions (where monitoring can provide days to weeks of warning) and tsunamis (where warning buoys provide crucial minutes to hours). However, as Source M implies, early warning systems are most effective when combined with earthquake-resistant construction, accessible evacuation routes and community preparedness. For earthquake ground shaking specifically, building quality is likely a more important factor than warning time. The challenge is not knowledge or technology but the political will and resources to reach the poorest communities that need protection most urgently.", "lo": true}, {"id": "Q4.2.t", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Communities in developing countries face greater risk from tectonic hazards than communities in developed countries, primarily because of their location near plate boundaries.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Partially agree — many developing countries are located near active plate boundaries: There is a correlation between developing country status and proximity to plate boundaries — many of the world's most seismically and volcanically active regions coincide with developing country territories. Indonesia sits at the convergence of four tectonic plates — one of the most tectonically active locations on Earth — and is a developing country. Haiti lies on the Caribbean Plate boundary system. Bangladesh, Nepal and Pakistan are located in or near the Himalayan fold mountain region. For these countries, geographic location at plate boundaries is a genuine risk factor that cannot be easily changed. Disagree — location alone does not explain risk; vulnerability is the primary determinant: However, the statement's claim that location near plate boundaries is the 'primary' reason for greater risk in developing countries is demonstrably inaccurate. Japan is located at the convergence of four major tectonic plates — arguably the most hazardous plate boundary location on Earth — yet Japan's death rate from tectonic disasters is dramatically lower than developing countries at similar boundaries. New Zealand is located on the Pacific-Australian plate boundary yet its death toll was a fraction of that in developing countries experiencing earthquakes of similar magnitude. The decisive difference is not location but vulnerability — building construction quality, monitoring systems, emergency response capacity and healthcare availability. Disagree — some developing countries face tectonic risks without being near plate boundaries: Furthermore, not all developing countries that face tectonic hazard risk are located directly on plate boundaries. Ash from the Toba eruption 74,000 years ago covered India — a country not directly on a plate boundary — in over 15 cm of ash. Similarly, tsunamis generated at distant subduction zones threaten low-lying developing country coastlines regardless of their proximity to plate boundaries. Nuanced evaluation — economic development is the critical variable: The most important factor explaining developing countries' greater risk is not location but economic resources available to reduce vulnerability. Building earthquake-resistant structures, installing seismic monitoring networks, training rescue teams, maintaining early warning systems and developing functional emergency response capacity all require significant sustained investment. Developing countries that face the same physical hazard as developed countries at similar plate boundaries simply cannot afford the same level of vulnerability reduction. Bangladesh — which devotes most of its limited resources to economic development — has 21% earthquake-resistant buildings in Dhaka despite lying near a seismically active region. Japan, with decades of investment, has dramatically reduced structural vulnerability despite facing far more powerful earthquakes. Conclusion: On balance, I strongly disagree with the statement's claim that location near plate boundaries is the 'primary' reason for developing countries' greater tectonic hazard risk. The Haiti-Christchurch comparison makes unambiguously clear that vulnerability — not location — is the primary determinant of disaster risk. The most accurate reformulation would be: communities in developing countries face greater risk from tectonic hazards primarily because their lower economic development prevents them from reducing vulnerability through earthquake-resistant construction, effective monitoring and robust emergency response — regardless of whether they are located near plate boundaries or not.", "lo": true}], "4.3": [{"id": "Q4.3.a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by \"tectonic disaster risk\"?", "src": null, "ans": "Tectonic disaster risk refers to the potential damage to properties, injuries and loss of lives from a tectonic disaster in a given period of time. It is determined as a product of the interaction between tectonic hazard, vulnerability and exposure. (1 mark)", "lo": false}, {"id": "Q4.3.b", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by \"community resilience\" in the context of tectonic hazards?", "src": null, "ans": "Community resilience refers to the ability of a community to resist, adapt to, and recover from the impacts of tectonic disasters in a timely and efficient manner. (1 mark)", "lo": false}, {"id": "Q4.3.c", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two strategies used to reduce a community's exposure to tectonic hazards.", "src": null, "ans": "Land use planning — organising and regulating land use so that vulnerable communities and critical infrastructure are not built in the highest-risk zones, such as tsunami inundation zones, steep volcanic slopes or areas with high liquefaction potential. (1 mark) Zoning regulations — designating exclusion zones around active volcanoes or fault lines that prohibit permanent settlement, reducing the number of people exposed to primary tectonic hazards. (1 mark)", "lo": false}, {"id": "Q4.3.d", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two strategies used during disaster response after an earthquake.", "src": null, "ans": "Search and rescue efforts — finding and saving survivors trapped in collapsed buildings or disaster zones, using specialised equipment such as heat sensors and listening devices to locate trapped people as quickly as possible. (1 mark) Timely evacuation — moving people quickly from areas at risk of further collapse, aftershocks or tsunami to temporary shelters where food, water and medical supplies are provided. (1 mark)", "lo": false}, {"id": "Q4.3.e", "ao": "AO1", "marks": 3, "cmd": "Explain", "text": "Explain how disaster recovery strategies help communities rebuild after a tectonic hazard.", "src": null, "ans": "Constructing hazard-resistant buildings and infrastructure replaces destroyed structures with stronger, better-designed replacements that can withstand future hazard events — reducing vulnerability in rebuilt communities compared to pre-disaster conditions. (1 mark) Retrofitting surviving buildings and infrastructure with hazard-resistant features upgrades existing structures that were not destroyed but may be vulnerable to future events, extending the benefits of hazard-resistant construction beyond the immediate disaster zone. (1 mark) Allowing residents to eventually return to their original homes and communities — supported by housing assistance for those who lost their homes — keeps communities intact and supports psychological recovery by restoring people's sense of place, connection and livelihood. (1 mark)", "lo": false}, {"id": "Q4.3.f", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source A, explain how the three components of tectonic disaster risk interact to determine the severity of a tectonic disaster.", "src": {"t": "table", "lbl": "Source A", "cap": "The three components of tectonic disaster risk", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and academic literature", "info": "", "hdr": ["Component", "Definition", "Examples in tectonic hazard contexts"], "rows": [["Hazard", "The natural tectonic event — the physical threat", "Earthquake ground shaking; volcanic pyroclastic flows; tsunami waves"], ["Vulnerability", "Conditions that increase susceptibility to harm", "Poor building quality; soil liquefaction risk; water availability near volcanoes (lahars); prevailing wind direction (tephra)"], ["Exposure", "Presence of people, assets and activities in hazard-prone zones", "Population density near fault lines; settlements on volcanic slopes; coastal communities in tsunami inundation zones"]]}, "ans": "Source A shows that tectonic disaster risk is not determined by the physical hazard alone but by the interaction of three components: hazard, vulnerability and exposure. A powerful earthquake in an uninhabited region creates significant seismic hazard but minimal disaster risk because no people or assets are exposed to it. Conversely, a moderate earthquake in a densely populated city with poorly constructed buildings can generate enormous disaster risk — as demonstrated by the 2010 Haiti earthquake (Mw 7.0, ~230,000 deaths) compared to the 2011 Christchurch earthquake (Mw 6.3, 185 deaths). (1 mark) Source A identifies building quality as a key vulnerability factor. Communities with poor building design and construction quality face dramatically higher vulnerability to earthquake ground shaking — their buildings collapse at lower shaking intensities, trapping more occupants and destroying more infrastructure. Soil properties create additional vulnerability: loose, water-saturated soils can liquefy during earthquakes, causing buildings to sink or topple even in areas where the ground shaking itself was not extreme. (1 mark) Source A also identifies exposure factors that are particularly relevant to volcanic hazards — the availability of surface and ground water near volcanoes determines whether lahars can form, while prevailing wind conditions determine the direction and distribution of tephra fallout. A community located downwind of a volcano is at far greater risk from tephra than an identical community upwind of the same volcano experiencing the same eruption. This shows how exposure is not simply about distance from the hazard source but about the specific pathways through which hazard energy reaches people. (1 mark)", "lo": false}, {"id": "Q4.3.g", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source B and your own knowledge, explain how economic development influences a community's vulnerability and exposure to tectonic hazards.", "src": {"t": "quote", "lbl": "Source B", "cap": "Bangladesh vs Japan — how economic development determines disaster risk", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and academic case studies", "info": "", "text": "\"Bangladesh is a developing country that lies along a plate boundary. As about 30% of Bangladeshis live below the poverty line, much of the country's resources are devoted to economic development rather than disaster preparedness. It has been found that 21% of buildings in the capital, Dhaka, are easily damaged and unreinforced. 77% are reinforced but have not been designed to resist earthquakes. This makes Dhaka very vulnerable to the impacts of earthquakes. In contrast, Japan has invested heavily in disaster risk reduction for decades. During the 2011 Tohoku earthquake (Mw 9.0), monitoring and warning systems detected strong tremors and a signal was sent out to stop bullet trains, saving thousands of passenger lives. Despite experiencing one of the most powerful earthquakes ever recorded"}, "ans": "Source B demonstrates that economic development is a critical determinant of building quality — and therefore vulnerability to earthquake hazards. In Dhaka, Bangladesh, 21% of buildings are easily damaged and unreinforced, while 77% are reinforced but not designed to resist earthquakes. This means approximately 98% of Dhaka's building stock would be significantly damaged or destroyed in a major earthquake. This catastrophic vulnerability directly reflects Bangladesh's economic constraints: with 30% of the population living below the poverty line, resources that could fund hazard-resistant construction are devoted instead to basic economic development and poverty reduction. (1 mark) Source B contrasts Bangladesh with Japan, which has invested heavily in disaster risk reduction for decades. Japan's building codes requiring structures to withstand significant seismic forces represent enormous cumulative investment in reducing structural vulnerability. This investment directly saved lives during the 2011 Tohoku earthquake — despite experiencing a Mw 9.0 earthquake, Japan's ground-shaking death toll was relatively low because well-engineered buildings did not collapse at the rates that would have occurred in less economically developed countries. (1 mark) Source B also illustrates how economic development enables investment in monitoring and warning systems that reduce vulnerability to secondary hazards. Japan's earthquake early warning system detected the 2011 Tohoku tremors and automatically sent signals to stop bullet trains — a technological response that required years of infrastructure investment and could only be implemented by a country with the economic resources to develop, install and maintain a nationwide network of seismic sensors. Developing countries like Bangladesh lack the financial and technological resources to develop equivalent systems. (1 mark) However, Source B also highlights the limits of economic development as protection against tectonic hazards. Despite Japan's world-leading preparedness investment, the 2011 tsunami — not the ground shaking — caused the majority of fatalities. This demonstrates that even the wealthiest, best-prepared nations cannot eliminate tectonic disaster risk entirely: economic development enables substantial vulnerability reduction but cannot overcome the scale of extreme tectonic events that exceed even the most advanced protective infrastructure design parameters. (1 mark)", "lo": false}, {"id": "Q4.3.h", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source C, explain how different resilience-building strategies work together to reduce tectonic disaster risk across the three dimensions of exposure, vulnerability and preparedness.", "src": {"t": "table", "lbl": "Source C", "cap": "Resilience-building strategies — reducing exposure, vulnerability and increasing preparedness", "credit": "Adapted from Tectonic Textbook, Syllabus 2279", "info": "", "hdr": ["Strategy", "Approach", "How it reduces risk", "Example"], "rows": [["Land use planning", "Reducing exposure", "Organises and regulates land use so communities and critical infrastructure are not built in highest-risk zones", "Tsunami inundation zones where permanent settlement is prohibited; volcanic exclusion zones"], ["Hazard-resistant building designs", "Reducing vulnerability", "Structures built to withstand hazard forces — shock absorbers, dampers, diagonal cross braces prevent excessive swaying and collapse", "Taipei 101, Taiwan — weighted damper near top of building balances ground shaking, reducing sway and collapse risk"], ["Monitoring and warning systems", "Reducing vulnerability", "Devices detect seismic waves and ground deformation; warnings sent to enable timely evacuation before hazard arrives", "Japan EEW system — sensors detect tremors; alerts sent to smart devices; bullet trains stopped automatically during 2011 Tohoku"], ["Evacuation drills and preparedness", "Increasing preparedness", "Familiarise communities with evacuation procedures and routes; enable autonomous response without official instructions", "Kamaishi city, Japan — schools with disaster prevention education; nearly all 3,000 students survived 2011 tsunami"]]}, "ans": "Source C shows that reducing exposure through land use planning attacks tectonic disaster risk at its most fundamental level — by ensuring that fewer people and less critical infrastructure are located in hazard-prone zones in the first place. Tsunami inundation zone designations prevent permanent settlement in areas identified as high-risk coastal zones, directly reducing the number of people exposed to tsunami waves. Volcanic exclusion zones around active craters reduce exposure to pyroclastic flows and lahars. Land use planning prevents new exposure rather than protecting existing exposed communities. (1 mark) Source C demonstrates that reducing vulnerability through hazard-resistant building design and monitoring systems addresses the risk of communities already exposed to tectonic hazards. Taipei 101's weighted damper represents the structural engineering approach — designing buildings that can withstand tectonic forces. Japan's Earthquake Early Warning system represents the technological approach — detecting hazards in time for people to take protective action. Together, these approaches mean that even when people are exposed to a tectonic hazard, both the buildings they occupy and their own timely responses can reduce the probability of injury and death. (1 mark) Source C shows that increasing preparedness through evacuation drills completes the resilience-building system by ensuring that communities know what to do when a warning is issued. The Kamaishi city example demonstrates this most clearly — schools with disaster prevention education and regular evacuation drills enabled nearly all 3,000 students to respond correctly to the 2011 tsunami warning, evacuating to higher ground and surviving. Without preparedness, even the best early warning system would be less effective if people did not know the correct evacuation routes or froze in confusion when warnings were issued. (1 mark)", "lo": false}, {"id": "Q4.3.i", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source D and your own knowledge, assess the effectiveness of land use planning as a strategy for reducing exposure to tectonic hazards.", "src": {"t": "quote", "lbl": "Source D", "cap": "Land use planning — effectiveness and limitations (Tohoku post-disaster relocation)", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and case studies", "info": "", "text": "\"Land use planning is one of the most cost-effective strategies for reducing exposure to tectonic hazards, but it faces significant political and social challenges. In Japan's Tohoku region, the Japanese government developed ambitious land use plans to relocate coastal communities to higher ground, raising ground levels at rebuilding sites by up to ten metres and constructing new sea walls along the coast. However, many residents resisted relocation — they had deep attachments to their coastal homes and livelihoods. Fishermen and seafood processors argued that relocation away from the coast would destroy their economic activities. In some cases, the process of community consultation and planning took years, delaying the return of displaced residents to rebuilt homes.\""}, "ans": "Source D identifies land use planning's most important strength: it is a proactive strategy that prevents new exposure to tectonic hazards by restricting development in high-risk zones before disasters occur. For communities that have not yet been built in hazard-prone areas, land use planning offers the most cost-effective form of risk reduction — it is far cheaper to prevent construction in a tsunami inundation zone than to protect buildings already constructed there. Volcanic exclusion zones around active craters, tsunami inundation zone designations and restrictions on construction in high-liquefaction-risk zones all represent this preventive function. (1 mark) However, Source D identifies a critical limitation: land use planning 'cannot protect communities that are already established in hazard-prone areas.' Most high-risk tectonic zones around the world are already inhabited — often densely so. The Tohoku coastal communities had existed for generations before the 2011 tsunami. Land use planning can prevent new exposure but is largely ineffective at reducing existing exposure without the politically difficult and economically costly process of relocating established communities. (1 mark) Source D demonstrates through the Tohoku post-disaster relocation experience that even when governments have the political will and financial resources to implement ambitious land use planning after a disaster, social resistance creates significant practical challenges. Residents' deep attachments to coastal homes and livelihoods — particularly fishing communities whose economic activities depend on proximity to the sea — make relocation deeply unpopular. When community members resist planned relocations, the consultation and planning process can take years, delaying the return of displaced residents. (1 mark) Land use planning is also more effective as a long-term risk reduction strategy than as an immediate response. The years-long process of post-disaster planning in Tohoku — raising ground levels by ten metres and constructing new sea walls — demonstrates that land use planning operates at a fundamentally different timescale from other resilience-building strategies like early warning systems, which can reduce risk almost immediately after installation. This temporal mismatch means that land use planning must be combined with other strategies that provide immediate risk reduction for existing exposed communities. (1 mark) Despite its limitations, Source D shows that land use planning produces concrete, measurable risk reduction outcomes when successfully implemented. Raising ground levels at Tohoku rebuilding sites by ten metres and constructing new sea walls provided genuine additional protection against future tsunamis. The principle of 'building back better' — restoring communities while simultaneously improving their resilience — represents the most effective application of land use planning: combining the necessary post-disaster rebuilding process with structural improvements that reduce future vulnerability and exposure simultaneously. (1 mark)", "lo": false}, {"id": "Q4.3.j", "ao": "AO2", "marks": 4, "cmd": "Identify", "text": "Using Source E and your own knowledge, explain how monitoring and warning systems combined with evacuation planning can reduce tectonic disaster risk, and identify the limitations of these strategies.", "src": {"t": "quote", "lbl": "Source E", "cap": "Mount Merapi 2010 — monitoring, warning and evacuation: effectiveness and limits", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and case studies", "info": "", "text": "\"In 2010, after a warning of Mount Merapi's imminent eruption was issued by scientists, Indonesia's authorities organised a massive evacuation effort comprising more than 700 evacuation centres. The quick and massive evacuation efforts were credited for saving more than 10,000 lives. Monitoring systems had detected increased seismic activity and ground deformation at Merapi in the weeks before the eruption, providing scientists with the lead time needed to issue warnings and organise the evacuation. However, some residents refused to leave. The spiritual and cultural leader of the community, who chose to remain near the volcano rather than evacuate, was among those who died in the eruption. The eruption killed approximately 353 people, many of whom were among those who had refused to evacu"}, "ans": "Source E demonstrates how monitoring systems provided the essential lead time that made the 2010 Mount Merapi evacuation possible. Scientists detected increased seismic activity and ground deformation in the weeks before the eruption — a relatively long warning period that enabled the authorities to organise more than 700 evacuation centres and move large numbers of people to safety before the hazard struck. Without this monitoring-generated lead time, there would have been no opportunity to issue warnings, establish evacuation centres or reach the communities at risk. The monitoring system was therefore the foundational enabling condition for the entire risk reduction chain. (1 mark) Source E shows that the combination of monitoring, warning and evacuation planning saved more than 10,000 lives — a concrete, measurable demonstration of effectiveness when they function as an integrated system. The scale of the evacuation (700+ evacuation centres) reflects the importance of pre-planning: the authorities did not devise the evacuation plan after the eruption began but had systems in place that could be rapidly activated when monitoring systems issued the warning. (1 mark) However, Source E identifies a critical limitation: approximately 353 people died despite the warning and evacuation effort, many of whom had refused to evacuate or were unable to reach safety in time. This reveals the gap between the availability of a warning and the ability or willingness of all community members to act on it. Warning systems can only save lives if people receive, believe and act on warnings — and Source E shows that some residents did not believe the warnings, were physically unable to evacuate, or prioritised their attachment to livestock and property over their own safety. (1 mark) The persistent deaths despite warnings in Source E highlight that monitoring and warning systems must be complemented by community preparedness education that builds trust in warnings, by practical support for physically vulnerable community members who cannot self-evacuate, and by systems that reduce the economic cost of evacuation. Warning systems that communities do not trust or act upon provide little risk reduction benefit — effectiveness depends on the entire system from detection through communication to individual compliance. (1 mark)", "lo": false}, {"id": "Q4.3.k", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source F, explain how the four disaster response strategies work together to reduce the immediate and longer-term impacts of tectonic hazards on affected communities.", "src": {"t": "table", "lbl": "Source F", "cap": "Disaster response strategies — search and rescue, evacuation, basic and psychosocial services", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and case studies", "info": "", "hdr": ["Strategy", "Purpose", "How it is carried out", "Example"], "rows": [["Search and rescue", "Find and save survivors trapped in buildings or disaster zones", "Deploy skilled rescuers with heat sensors and listening devices; aim to rescue maximum people in minimum time", "2020 Aegean Sea earthquake (Mw 7.0, Turkey) — 8,000+ rescue teams deployed; 106 people rescued"], ["Timely evacuation", "Move people from areas at risk to safety before further harm occurs", "Earthquake: to open spaces (aftershock risk); tsunami: to higher ground; volcanic: away from danger zones; provide temporary shelters", "2010 Mount Merapi — 700+ evacuation centres; 10,000+ lives saved; 2011 Kamaishi students to higher ground"], ["Basic social services", "Prevent secondary deaths from disease, hunger and untreated injuries", "Provide clean water (prevent disease); food (prevent starvation); healthcare (treat injuries, prevent spread of disease)", "Haiti 2010 — ICRC provided water for 12,000 people daily; 2017 Mount Agung, Indonesia — NGOs provided food for 75,000+ evacuees"], ["Psychosocial services", "Help survivors cope with emotional trauma and rebuild their lives", "Counselling from mental health professionals; support groups; trauma-informed services for children", "2018 Palu earthquake (Indonesia, Mw 7.5) — volunteer groups worked with children to deal with trauma of losing families and homes"]]}, "ans": "Source F shows that search and rescue is the most immediately life-critical response strategy — its purpose is to save survivors who would otherwise die from injuries, dehydration, burns or crush syndrome while trapped under collapsed buildings. The 2020 Aegean Sea earthquake response (8,000+ teams deployed, 106 people rescued) demonstrates the scale of coordination required. Search and rescue must operate within a narrow time window — survival rates for trapped earthquake victims decline dramatically after the first 72 hours — meaning speed, skilled personnel and specialised equipment are all essential for maximising lives saved. (1 mark) Source F demonstrates that timely evacuation addresses a different time dimension — it reduces harm during and immediately after the hazard event by moving people away from continuing danger. After an earthquake, aftershocks can collapse already-weakened buildings, making remaining in structures extremely dangerous. For tsunamis, evacuation to higher ground is the only effective response — as Kamaishi's students demonstrated. For volcanic eruptions, moving people away from lava, pyroclastic flow and lahar paths directly prevents the fatalities that would otherwise occur. (1 mark) Source F shows that basic social and psychosocial services address the medium and longer-term human needs that persist after the immediate life-safety crisis is managed. Contaminated water supplies after earthquakes and volcanic eruptions create secondary risks of water-borne disease that can kill more people than the initial hazard event itself. Psychosocial services — as illustrated by the 2018 Palu earthquake example — address the psychological trauma that can persist for years after physical recovery is complete, recognising that effective disaster response must address the whole person rather than only physical needs. (1 mark)", "lo": false}, {"id": "Q4.3.l", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source G and your own knowledge, explain how disaster recovery strategies can both restore and improve community resilience, and assess the challenges they face.", "src": {"t": "quote", "lbl": "Source G", "cap": "Tohoku Japan disaster recovery — \"building back better\" after the 2011 earthquake and tsunami", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and case study of Tohoku Japan recovery", "info": "", "text": "\"The disaster displaced approximately 500,000 people. The Japanese government developed a recovery plan that aimed not simply to restore what had been destroyed but to reduce vulnerability to future disasters simultaneously. By 2016, a majority of displaced residents had been rehoused in settlements built with enhanced tsunami-resistant features. In one port town, the ground level of sites for new houses was raised by ten metres and two additional sea walls were built. The total recovery cost exceeded US$250 billion. However, for some communities, the recovery process was deeply traumatic — many residents spent years in temporary housing while lengthy community consultations and planning processes delayed the completion of permanent homes. Some displaced residents, particularly elderly peo"}, "ans": "Source G demonstrates through the Tohoku recovery how 'building back better' — restoring communities while simultaneously improving their resilience — represents the most effective approach to disaster recovery. Rather than simply rebuilding what was destroyed in its original location and form, the Japanese government raised ground levels by ten metres and built additional sea walls, directly reducing the exposure and vulnerability of rebuilt communities to future tsunamis. By 2016, a majority of the 500,000 displaced residents had been rehoused in enhanced, tsunami-resistant settlements — a measurable improvement in community resilience compared to pre-disaster conditions. (1 mark) Source G illustrates how disaster recovery creates a unique window of opportunity to implement risk reduction measures that would be politically and practically impossible in undamaged communities. The destruction of coastal settlements removed the social and political resistance to major changes in land use and building standards that would normally prevent governments from implementing radical restructuring. Disasters create 'windows of opportunity' for resilience building that peacetime risk management cannot easily open. (1 mark) However, Source G reveals serious challenges in implementing ambitious recovery plans. The lengthy community consultation and planning processes delayed completion of permanent homes for years — during which some displaced residents, particularly elderly people, died in temporary housing before returning home. This demonstrates a fundamental tension in disaster recovery: thorough community consultation takes time, but the longer recovery takes, the greater the psychological and physical toll on displaced communities. (1 mark) The scale of the financial challenge shown in Source G — recovery costs exceeding US$250 billion — illustrates why effective disaster recovery is available only to wealthy nations. Japan could mobilise this investment because of its large economy, strong government finances and well-developed insurance systems. For developing countries facing comparable devastation — such as Haiti after its 2010 earthquake — domestic financial resources are wholly insufficient, creating dependence on international aid that is often slower, less coordinated and less sustained than what a wealthy government can mobilise internally. (1 mark)", "lo": false}, {"id": "Q4.3.m", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source H and your own knowledge, explain how challenges in disaster management can undermine the effectiveness of disaster response and recovery.", "src": {"t": "table", "lbl": "Source H", "cap": "Challenges in disaster management — financial, technological and stakeholder coordination", "credit": "Adapted from Tectonic Textbook, Syllabus 2279 and case studies", "info": "", "hdr": ["Challenge", "How it occurs", "Impact", "Case study"], "rows": [["Lack of financial resources", "Country lacks funds to invest in preparedness or respond and recover from disasters", "Slower search and rescue; fewer trained personnel; delayed basic services; slower recovery", "Haiti 2010 — critical shortage of ambulances; no heavy machinery; rescue teams removed rubble manually with hammers"], ["Lack of technological resources", "Country lacks monitoring equipment, communication systems and specialised rescue equipment", "Reduced warning time; inability to detect hazards in advance; slower and less effective search and rescue", "Haiti 2010 — limited seismic monitoring; poor communication infrastructure hampered coordination"], ["Stakeholder collaboration challenges", "Different stakeholders have different priorities, resources and operational procedures", "Duplication of efforts; gaps in service provision; coordination failures; slower aid delivery", "Multiple international organisations responding to Haiti 2010 with insufficient coordination"], ["Community capability to organise", "Communities lack training, leadership structures or social cohesion to organise disaster response", "Delayed community-level response; residents do not know what to do; evacuation plans not followed", "Bangladesh — significant earthquake risk but limited community disaster preparedness programmes"]]}, "ans": "Source H illustrates how the lack of financial resources directly undermines disaster response effectiveness through the Haiti 2010 case study. The critical shortage of ambulances and heavy machinery meant that rescue teams had to spend hours manually removing rubble with hammers and rods to reach trapped survivors — dramatically slowing the rescue process during the critical 72-hour survival window. Each hour of delay in locating and extracting trapped survivors directly translates into preventable deaths. This demonstrates how financial constraints at the national level create a cascading chain of capacity failures that ultimately cost lives during disaster response. (1 mark) Source H shows that technological resource limitations compound financial constraints. Without seismic monitoring equipment, countries cannot provide early warnings that give communities time to take protective action before hazard impacts arrive. Without sophisticated communication infrastructure, coordination between different response agencies becomes difficult, leading to duplication of effort and gaps in service provision. Japan's ability to stop bullet trains automatically during the 2011 Tohoku earthquake required decades of investment in both monitoring technology and automated response systems that are simply unavailable to resource-constrained developing countries. (1 mark) Source H identifies stakeholder collaboration challenges as a distinctive management problem. When multiple organisations respond simultaneously to a major disaster, coordination failures are common — different organisations may serve the same communities with the same services while other communities receive no assistance. The challenges of coordinating the multi-organisational response to Haiti in 2010 demonstrated that even when substantial international resources are mobilised, poor coordination can significantly reduce their collective effectiveness. (1 mark) Source H's final challenge — community capability to organise — highlights that effective disaster management depends not only on governments and external organisations but on communities' own capacity to respond. Communities with trained community emergency response teams, established neighbourhood communication networks and practised evacuation plans can begin life-saving responses in the minutes immediately after a disaster strikes — before any external assistance can arrive. Building community-level disaster response capability through training and preparedness programmes is therefore one of the most cost-effective investments in disaster management effectiveness. (1 mark)", "lo": false}, {"id": "Q4.3.n", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source I and your own knowledge, explain how preparedness strategies can build community resilience and assess what limits their effectiveness.", "src": {"t": "quote", "lbl": "Source I", "cap": "Kamaishi city vs Mount Merapi — preparedness strategies: potential and limits", "credit": "Adapted from case studies of Kamaishi city and Mount Merapi 2010", "info": "", "text": "\"In Kamaishi city, Japan, schools implemented disaster prevention education programmes including regular evacuation drills. When the 2011 Tohoku earthquake struck, nearly all of the 3,000 students responded immediately — evacuating to higher ground without waiting for official instructions. This rapid, autonomous evacuation saved virtually all of them from the tsunami that followed. In contrast, the Mount Merapi eruption in 2010 in Indonesia revealed the limits of preparedness when community trust in warnings is insufficient. Despite monitoring systems issuing accurate warnings and authorities establishing 700+ evacuation centres, some residents refused to leave. The spiritual and cultural leader of the community, who chose to remain near the volcano rather than evacuate, was among those w"}, "ans": "Source I demonstrates through the Kamaishi case study how well-designed preparedness programmes can create autonomous community resilience — the ability to respond correctly and immediately without depending on real-time instructions from authorities. The students' rapid, self-directed evacuation to higher ground without waiting for official instructions shows that the disaster prevention education and evacuation drills had been internalised as instinctive responses. This autonomous capability is particularly valuable in the first critical minutes of a tectonic disaster when communication systems may be disrupted and official instructions may not reach everyone in time. (1 mark) Source I shows that preparedness strategies are most effective when they are specific, practised and contextually relevant. Kamaishi's evacuation drills were specifically designed for the earthquake-tsunami scenario that actually occurred — students knew the correct response (evacuate to higher ground) and had practised it repeatedly. Generic disaster preparedness without this specificity would be less effective: communities that know they should 'evacuate' but have never practised the specific route, pace and destination of evacuation are less likely to execute correctly under the stress of an actual disaster event. (1 mark) However, Source I reveals a fundamental limitation: preparedness strategies can only be effective if communities trust and comply with warnings and evacuation plans. The Mount Merapi 2010 case shows that even accurate warnings, established evacuation routes and community preparedness failed to protect everyone — some residents refused to leave for cultural, spiritual and attachment reasons. The death of the community's spiritual leader — who chose to remain near the volcano — illustrates that preparedness and warning compliance is not simply a matter of knowledge or logistics but of deeply held cultural values and individual agency. (1 mark) Source I implies that effective preparedness must go beyond practical drill training to include community engagement that builds trust in scientific warning systems and addresses cultural and social factors that influence evacuation compliance. In communities where traditional leaders have significant authority, engaging those leaders in preparedness planning is essential — if community leaders endorse and participate in evacuation procedures, compliance rates improve dramatically. The most resilient communities are those where technical preparedness (knowing what to do) is combined with social preparedness (trusting warnings and supporting each other's evacuation). (1 mark)", "lo": false}, {"id": "Q4.3.o", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source J and your own knowledge, assess how effectively different disaster management strategies reduce the overall impact of tectonic hazards on communities.", "src": {"t": "quote", "lbl": "Source J", "cap": "Japan vs Haiti — how economic development determines the entire disaster management system", "credit": "Adapted from comparative case studies of tectonic disaster management, 2022", "info": "", "text": "\"The contrast between disaster management in Japan and Haiti reveals how economic development determines the entire disaster risk management system — from prevention through response to recovery. Japan's decades of investment in earthquake-resistant construction, monitoring and early warning systems, trained rescue teams and post-disaster recovery planning enabled it to manage a Mw 9.0 earthquake with a ground-shaking death toll far lower than a comparable event in a less prepared country would have caused. Haiti's lack of financial and technological resources meant that when its Mw 7.0 earthquake struck, almost every element of the disaster management system was absent or inadequate: buildings collapsed at far higher rates, rescue teams lacked equipment, basic services could not be sustai"}, "ans": "Source J argues that disaster management effectiveness is not primarily determined by the specific strategies deployed but by the underlying economic investment that determines whether those strategies can be built, maintained and executed effectively. Japan's system of earthquake-resistant construction, monitoring networks, trained rescue teams and recovery planning represents decades of cumulative investment that created a comprehensive, integrated disaster management capability. The relatively low ground-shaking death toll from the Mw 9.0 Tohoku earthquake is the outcome of this entire system operating as intended. No single strategy alone would have achieved this outcome without the others. (1 mark) Source J demonstrates that pre-disaster strategies are more effective at saving lives than post-disaster strategies because they prevent deaths from occurring rather than trying to save people after harm has already been inflicted. Japan's ground-shaking death toll was low primarily because buildings did not collapse — a function of pre-disaster investment in building codes. Once buildings collapse, even the best search and rescue operation will save only a fraction of the people that earthquake-resistant construction would have protected. (1 mark) However, Source J's Japan-Haiti comparison implicitly raises a fundamental equity challenge in disaster risk management: the countries that most need effective disaster management systems are precisely the countries least able to afford them. Haiti's absence of adequate disaster management systems was not a failure of political will alone but a direct consequence of the economic constraints of one of the world's poorest countries. This creates a structural inequality in global disaster risk that economic development alone cannot quickly resolve. (1 mark) Source J notes that even 'substantial international assistance' failed to enable Haiti to recover at the pace that Japan's domestic resources enabled. This reveals the limitations of post-disaster international aid as a substitute for pre-disaster investment in domestic disaster management capacity. International aid is valuable but inherently slower, less coordinated and less contextually appropriate than domestic systems built over decades — it cannot replicate in weeks what Japan built over generations. (1 mark) The overall assessment suggested by Source J is that disaster management strategies are most effective when they form an integrated system — pre-disaster prevention and preparedness reducing the hazard impact; real-time monitoring and warning enabling timely response; immediate post-disaster response saving lives; and medium-term recovery restoring and improving community conditions. The weakest link in this chain — whether financial, technological or social — ultimately determines the system's overall effectiveness. (1 mark)", "lo": false}, {"id": "Q4.3.p", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source K and your own knowledge, to what extent do you agree that governance failures are the most important barrier to effective disaster risk management? Explain your answer.", "src": {"t": "quote", "lbl": "Source K", "cap": "Commentary by a disaster risk management specialist", "credit": "Adapted from a disaster risk management specialist's commentary, 2022", "info": "Key claims: The problem is not technology but governance — wealthy, well-governed countries manage tectonic risk; poorly governed countries turn manageable hazards into catastrophes. | Unenforced building codes, distrusted evacuation plans and unheeded warnings all save no lives — the gap is a \"governance gap\" not a \"technological gap.\" | Deaths from tectonic hazards in vulnerable communities are \"entirely preventable\" — implying governance failures are the primary cause. Consider: Does Source K", "text": "We have spent decades perfecting the technology of disaster management — seismic sensors, early warning apps, tsunami buoys, earthquake-resistant engineering. And yet people continue to die in earthquakes and volcanic eruptions in numbers that are entirely preventable. The problem is not technology — it is governance. The wealthiest, best-governed countries have turned their tectonic hazard environments into manageable risks. The poorest, most poorly-governed countries have turned manageable hazards into catastrophic disasters. Building codes that exist on paper but are never enforced save no lives. Evacuation plans that communities do not trust save no lives. Monitoring systems that generate warnings that no one acts upon save no lives. The gap between the potential of disaster risk manag"}, "ans": "Agree — Source K correctly identifies governance as the critical gap: Source K's argument is powerfully supported by the evidence from tectonic disaster case studies. The Haiti 2010 earthquake illustrates the governance failure argument most starkly — building codes existed in principle but were never enforced, meaning that 90% of hospitals in Port-au-Prince were destroyed. This was not a technological failure: earthquake-resistant building design is well-understood engineering. It was a governance failure — the absence of effective code enforcement, building inspection systems and accountability mechanisms that would have translated knowledge into practice. Japan and Haiti face comparable tectonic hazard environments in some respects, but their governance systems for translating risk knowledge into risk-reducing action are incomparably different — and so are their disaster outcomes. Partially disagree — financial resources are an equally fundamental barrier: However, Source K's exclusive focus on governance understates the degree to which governance failures are themselves products of resource constraints. Bangladesh cannot enforce earthquake building codes primarily because it lacks the financial resources to train and deploy the inspection workforce, the legal system capacity to prosecute violations, and the political space to prioritise disaster risk over immediate poverty reduction. Governance failure and resource constraint are deeply intertwined — characterising them as separate problems misrepresents the structural relationship between poverty, governance capacity and disaster risk. Conclusion: On balance, I agree that governance failures are a critically important barrier to effective disaster risk management — Source K's examples of unenforced building codes, distrusted evacuation plans and unheeded warning systems all demonstrate governance failures with lethal consequences. However, I do not agree that governance is the 'most important' barrier as an isolated factor: governance capacity and financial resources are interdependent, and addressing one without the other rarely produces sustained improvement.", "lo": true}, {"id": "Q4.3.q", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Pre-disaster strategies are more effective than post-disaster strategies in reducing the overall impact of tectonic hazards on communities.\" Do you agree with this statement? Explain your answer.", "src": null, "ans": "Strongly agree — pre-disaster strategies prevent deaths that post-disaster strategies cannot reverse: Source L demonstrates that pre-disaster strategies fundamentally change the hazard impact equation rather than responding to it after the fact. Japan's building codes meant that the ground shaking from the Mw 9.0 Tohoku earthquake did not collapse buildings at the catastrophic rates that would have occurred in a less prepared country. Deaths from building collapse that never happened cannot be saved by post-disaster search and rescue, however skilled or well-equipped. The evidence in Source L consistently shows that countries with strong pre-disaster investment experience dramatically lower death tolls than those relying primarily on post-disaster response. Agree — pre-disaster strategies multiply the effectiveness of post-disaster strategies: Source L also shows that pre-disaster preparedness determines the effectiveness of post-disaster response. The Kamaishi students' successful autonomous evacuation during the 2011 Tohoku tsunami was only possible because of years of pre-disaster evacuation drills — the post-disaster survival response was entirely a product of pre-disaster preparedness investment. Japan's monitoring and early warning systems enabled post-disaster response to be faster and more targeted by identifying risk areas and directing aid where most needed. Pre-disaster investment multiplies the effectiveness of post-disaster response. Partially disagree — post-disaster strategies are essential when pre-disaster investment is absent: However, Source L also shows that in many of the world's most disaster-vulnerable communities, pre-disaster investment is minimal or absent. For these communities, post-disaster response — search and rescue, evacuation, provision of basic services, psychosocial support — is the primary available mechanism for reducing disaster impact. The 2010 Haiti earthquake case shows that international post-disaster response, despite its limitations, did save lives and provide critical basic services that a community with no domestic disaster management capacity could not self-provide. Nuanced evaluation — the time horizon of assessment matters: The statement's conclusion also depends on the time horizon considered. In the immediate term — the hours and days after a disaster — post-disaster search and rescue and evacuation are the dominant life-saving interventions, and no pre-disaster strategy can substitute for them after the event has already occurred. Over a multi-decade timeframe, pre-disaster strategies are clearly more cost-effective: investing in building codes costs a fraction of the post-disaster recovery cost of rebuilding collapsed structures. Conclusion: On balance, I strongly agree that pre-disaster strategies are more effective than post-disaster strategies in reducing the overall impact of tectonic hazards. Source L's evidence consistently shows that communities with strong pre-disaster investment experience dramatically lower disaster impacts. However, post-disaster strategies are essential for communities where pre-disaster investment has been absent or insuff
